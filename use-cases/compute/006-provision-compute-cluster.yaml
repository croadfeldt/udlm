scenario:
  description: 'A platform engineer requests a KubernetesCluster by intent — a Kubernetes release and network ranges — without naming individual nodes, a control-plane host, or provider-native cluster internals.
    The provider provisions the control plane at the declared release; the worker nodes are separate KubernetesNodePool
    orders contained by the cluster (ruling 072), and the cluster reaches Realized with those properties published on its outputs (Kubernetes
    version, API endpoint). This stresses that a Cluster is portable intent expressed as a release and
    network ranges, not an enumeration of machines: the declared release IS the build instruction, the realized topology is readable from the record rather than inferred from the provider, a
    downstream consumer binds on the ready-node output, and the cluster rehydrates by replaying the same
    release intent, then its pool orders, against an eligible provider.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - application-team-member
    - platform-operator
    - sre
  intent: Request a Cluster by declared node count and version, and have it realize with those properties
    published on its outputs
  success_criteria:
  - The request carries the node count and Kubernetes version from the record alone; no individual node or
    control-plane host is enumerated in the intent
  - The provider provisions the control plane and the declared worker count at the declared version; the
    cluster reaches Realized
  - The Kubernetes version, ready node count, and API endpoint are readable from the cluster's declared
    outputs, not inferred provider-side
  - A downstream consumer binds on the ready-node-count output, contract-checked, rather than polling the
    provider
  - The cluster rehydrates by replaying the same count-and-version intent against an eligible provider
  dimensions:
    lifecycle_phase: provisioning
    resource_complexity: single_with_deps
    policy_complexity: system_defaults_only
    provider_landscape: single_eligible
    governance_context: no_governance
    failure_mode: happy_path
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the declared node count and version are the complete, portable build record
  - domain: policy
    interaction: validation confirms the requested version and an admitted provider before dispatch
  - domain: provider
    interaction: the cluster provider (OCM/CAPI-class) realizes the control plane and worker nodes to the
      declared intent
  - domain: audit
    interaction: the provision path and the realized topology are recorded against the record
