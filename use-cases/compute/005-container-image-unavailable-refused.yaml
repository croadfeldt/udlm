handle: compute/container-image-unavailable-refused
version: 1.0.0
scenario:
  description: 'A platform engineer deploys a Compute.Container workload whose declared image reference is
    unresolvable — the image does not exist, the tag is not published, or the registry cannot serve it.
    Success for this use case is the REFUSAL: the deployment must be rejected before scheduling, never left
    crash-looping as replicas pull-fail forever, and never reported Realized when nothing runnable exists.
    The refusal must be typed as an image-unavailable error — machine-matchable and distinct from a resource
    exhaustion (there was capacity) and from a policy denial (the image was not disallowed, it was
    unresolvable) — and it must name the missing image reference concretely: the image and tag that could not
    be resolved and the registry that was consulted, so the reader can tell a typo from a registry outage. No
    workload is scheduled, no replicas are admitted to pull-loop, and an audit record carries the
    unresolvable image reference that justified the refusal.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - application-team-member
    - platform-operator
    - sre
    - compliance-auditor
  intent: Deploy a Container whose image reference cannot be resolved, and receive a refusal naming the
    missing image rather than a crash-loop
  success_criteria:
  - The deployment is refused before scheduling; no replicas are admitted to pull-loop and no workload is
    reported Realized
  - The refusal is typed as an image-unavailable error, distinct from resource exhaustion and from policy
    denial
  - The workload is never left crash-looping on a pull failure, and is never left Pending indefinitely
    awaiting an image that will not appear
  - The refusal names the unresolvable image and tag and the registry consulted, so a typo is
    distinguishable from a registry outage
  - An audit record of the refusal exists, carrying the unresolvable image reference
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_with_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: provider_failure
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the declared image reference and the registry consulted are resolvable records the refusal
      cites
  - domain: policy
    interaction: the image-resolution rule refuses the deployment rather than admitting replicas to
      pull-loop or deferring
  - domain: provider
    interaction: no workload is scheduled for the unresolvable image; no replicas enter a pull-fail loop
  - domain: audit
    interaction: the refusal and the unresolvable image reference are recorded
