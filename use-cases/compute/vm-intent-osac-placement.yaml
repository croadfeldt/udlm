handle: compute/vm-intent-osac-placement
version: 1.0.0
scenario:
  description: 'An application team member submits a VM intent through the control plane API. Validation
    policies run before placement; the placement engine selects an OSAC-backed provider from the eligible
    set; the request is dispatched to that provider for implementation; and the realized record carries
    provider provenance naming OSAC. Policies are evaluated again on the placement-informed payload. The
    point being proven is that a sovereign cloud participates through the ordinary provider contract:
    it is selected, never assigned, and nothing in the path needs a different answer because the provider
    is OSAC.'
  actor:
    persona: application-team-member
    profile: standard
  perspectives:
    - cloud-operator
    - compliance-auditor
  intent: Realize a VM intent on an OSAC-backed provider chosen by placement, with provenance naming the
    provider
  success_criteria:
    - The consumer submits a portable VM intent that names no provider, namespace, or native storage class
    - Validation policies are evaluated before placement and again after it, on the placement-informed
      payload
    - The placement engine selects the OSAC-backed provider from the eligible set by declared capability
      and capacity
    - The request is dispatched to OSAC through the ordinary provider contract, and provider-specific
      fields are added at enrichment from OSAC's Provider Class
    - The realized record carries provider provenance identifying OSAC
    - The provisioned VM is reachable, and the intent-to-realized path is auditable end to end
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_with_deps
    policy_complexity: multi_validation
    provider_landscape: multiple_eligible
    governance_context: sovereignty_constrained
    failure_mode: happy_path
  profile: standard
  expected_domain_interactions:
    - domain: data
      interaction: the portable VM intent, the assembled payload with field-level provenance, and the
        realized record with provider provenance
    - domain: policy
      interaction: validation before placement; re-validation of the placement-informed payload; placement
        selects among eligible providers
    - domain: provider
      interaction: the OSAC-backed provider declares capability and capacity, answers the reserve, and
        realizes the VM
    - domain: audit
      interaction: the placement decision and the realizing provider are recorded on the realized record
