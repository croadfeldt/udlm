handle: audit/refusal-emits-audit-record
version: 1.0.0
scenario:
  description: 'This use case is the single authoritative home of one requirement: EVERY refusal in
    the system emits an immutable audit record. A refusal that leaves no audit record is not a
    lighter-weight refusal — it is a defect. When a policy gate refuses an admission, a dispatch, a
    binding, or a crossing, the refusal and an audit record of it are one atomic outcome: the record
    carries the refused coordinates, the deciding policy, the identities involved, and the typed
    refusal reason, and it lands in the tamper-evident audit store whose shape and integrity model
    the AUD-006 Merkle audit design owns (RFC 9162 inclusion/consistency proofs). This UC exists so
    that every other refusal use case — CVE-gate, cross-tenant, sovereignty egress, inline-credential,
    off-vocabulary quarantine — can reference auditability by naming the compliance-auditor perspective
    instead of restating the audit-record requirement in its own words, where it would drift and leak
    diffusely across the corpus. The must-reject facet is the inverse property under test: a refusal
    path that completes WITHOUT emitting a corresponding audit record is itself non-conformant and must
    be caught — silence on the refusal path is the failure, exactly as a silent soft-fail is on the
    admission path. The record is immutable and independently verifiable: an auditor confirms the
    refusal happened, and a regulator verifies it from a signed tree head and an inclusion proof alone,
    without access to the operator''s database.'
  actor:
    persona: compliance-auditor
    profile: standard
  perspectives:
    - security-officer
    - regulator
    - platform-engineer
    - sre
  intent: Establish, as the single authoritative requirement, that every refusal emits an immutable
    audit record — and that a refusal leaving no audit record is itself non-conformant
  success_criteria:
  - Every refusal emits an audit record as one atomic outcome with the refusal — the refusal and its
    record are not separable, and there is no refusal path that skips the record
  - The audit record carries the refused coordinates, the deciding policy, the identities involved,
    and the typed refusal reason
  - The record lands in the tamper-evident store whose shape and integrity model AUD-006 owns — RFC
    9162 inclusion/consistency proofs, not assertion
  - A refusal that completes without a corresponding audit record is non-conformant and is caught —
    silence on the refusal path is the defect, not an acceptable lighter outcome
  - The record is independently verifiable — a regulator confirms the refusal from a signed tree head
    and an inclusion proof alone, without access to the operator's database
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: audit_heavy
    failure_mode: policy_violation
  profile: standard
  expected_domain_interactions:
  - domain: audit
    interaction: the refusal emits an immutable audit record — refused coordinates, deciding policy,
      identities, and typed reason — into the AUD-006 Merkle store as one atomic outcome
  - domain: policy
    interaction: the deciding policy that refused is named in the record; a refusal without an
      emitted record is treated as non-conformant, not as a lighter refusal
  - domain: data
    interaction: the refused coordinates and the identities are the records the audit entry carries;
      protected values are excluded per the refusing gate's firewall discipline
  - domain: provider
    interaction: no provider is dispatched on a refused path; the audit record is the durable
      evidence the refusal occurred
