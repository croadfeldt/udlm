handle: security/credential-used-outside-scope-refused
version: 1.0.0
scenario:
  description: 'A consumer attempts to resolve a Security.CredentialRef from a context outside the scope
    the reference was authorized for — a different tenant, resource, or boundary than the one the
    handle-and-scope grants. Success for this use case is that the out-of-scope resolution is REFUSED
    before the secret store is ever consulted, not resolved-anyway with the material handed to an
    unauthorized caller: the request must be driven to a typed terminal refusal that names the scope
    violation — the authorized scope and the scope actually presented — and the referenced secret must
    NEVER be exposed, materialized, or logged in the process. The refusal must be typed as a policy
    violation — machine-matchable and distinct from a provider failure and from a not-found reference —
    and carry an actionable resolution (request from within the authorized scope, or obtain a reference
    scoped to this context). It must name the scope boundary without leaking the secret handle''s value
    or any material, and it must leave a tamper-evident audit record of the denied resolution, the
    authorized scope, and the deciding rule. It must never be left Pending on an out-of-scope request
    that will not become authorized on its own.'
  actor:
    persona: security-officer
    profile: standard
  perspectives:
    - platform-operator
    - sre
    - compliance-auditor
    - regulator
  intent: Attempt to resolve a CredentialRef outside its authorized scope, and have it refused as a
    typed policy violation naming the scope breach with the secret never exposed
  success_criteria:
  - 'typed: the resolution reaches a typed terminal refusal typed as a policy violation, distinct from
    a provider failure and from a not-found reference — never resolved-anyway, and never left Pending on
    an out-of-scope request'
  - 'actionable: the refusal names the authorized scope and the scope actually presented, and carries a
    resolution the requester can act on (request from within scope, or obtain a correctly-scoped reference)'
  - 'non-leaking: the referenced secret is never exposed, materialized, or logged — the refusal names the
    scope boundary only, not the secret value or the handle''s material'
  - 'whole: the resolution is refused as a unit — no partial material is handed back before the scope
    check completes'
  - 'auditable: the denied resolution, the authorized scope, and the deciding rule leave a tamper-evident
    audit record'
  dimensions:
    lifecycle_phase: day2_operations
    resource_complexity: single_with_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: compliance_gated
    failure_mode: policy_violation
  profile: standard
  expected_domain_interactions:
  - domain: policy
    interaction: the scope rule denies the resolution before the secret store is consulted, driving a typed refusal
  - domain: data
    interaction: the authorized scope and the presented scope are resolvable records the refusal cites — the secret is not
  - domain: provider
    interaction: no secret store is consulted — the out-of-scope resolution is caught before the material is fetched
  - domain: audit
    interaction: the denied resolution, the authorized scope, and the deciding rule are recorded; the secret never is
