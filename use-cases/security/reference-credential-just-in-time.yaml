handle: security/reference-credential-just-in-time
version: 1.0.0
scenario:
  description: 'A security officer declares a Security.CredentialRef that names a secret by handle
    (a path/URI into a secret store) rather than carrying the secret value inline in the portable
    record. The reference is a pointer with a scope, not a copy: the credential material is resolved
    just-in-time at the point of use — when a consumer actually dispatches against it — and is never
    materialized back into the model, the audit trail, or any published output. This stresses that
    portable data carries a handle, never a secret: the CredentialRef record is safe to store,
    replicate, and rehydrate because it holds no material, the resolution is a late binding that
    happens at the trust boundary and nowhere earlier, and the same reference replays against an
    eligible secret store without ever having leaked the value it points at.'
  actor:
    persona: security-officer
    profile: standard
  perspectives:
    - platform-operator
    - sre
    - compliance-auditor
  intent: Declare a CredentialRef that names a secret by handle and is resolved just-in-time at use,
    with the secret never materialized into the portable record
  success_criteria:
  - The CredentialRef carries only a handle/path and a scope; no secret value is ever inline in the
    record
  - The secret is resolved just-in-time at the point of use, at the trust boundary, and nowhere earlier
  - The resolved material is never written back into the model, an output, or the audit record — the
    stored and rehydrated record holds no secret
  - A consumer binds by resolving the handle against an eligible secret store at dispatch, not by
    reading a value off the record
  - The reference rehydrates by replaying the same handle-and-scope against an eligible store, having
    never carried the material
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: system_defaults_only
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: happy_path
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the CredentialRef holds a handle and scope only — the portable record carries no secret
  - domain: policy
    interaction: validation confirms the reference is a handle, not inline material, before it is admitted
  - domain: provider
    interaction: the secret store resolves the handle just-in-time at dispatch, at the trust boundary
  - domain: audit
    interaction: the reference and its resolution point are recorded; the resolved material never is
