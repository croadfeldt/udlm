handle: storage/dataset-parent-pool-missing-refused
version: 1.0.0
scenario:
  description: 'A platform engineer requests a Storage.Dataset whose parent Storage.Pool is absent —
    never declared, or declared but unrealizable (its members are missing, so it cannot reach Realized).
    A dataset cannot exist without a pool to carve its space from: the parent pool is an operational
    dependency (ADR-052), not merely a request-time reference. Success for this use case is the REFUSAL:
    the dataset must not be created orphaned, and the request must not be left Pending forever waiting
    on a pool that will never realize. The refusal must be a typed dependency error — machine-matchable
    as a missing/unrealizable parent, distinct from a quota exhaustion or a schema-invalid request — and
    it must name the missing parent (the pool the dataset depends on) and its state (absent vs
    unrealizable), so the reader can tell a mis-referenced parent from a broken one. No dataset is
    realized, and an audit record carries the unresolved dependency that justified the refusal.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - platform-operator
    - sre
    - compliance-auditor
  intent: Request a Dataset whose parent pool is absent or unrealizable, and receive a refusal naming
    the missing operational dependency
  success_criteria:
  - The request is refused; no dataset is created orphaned without a realizable parent pool
  - The refusal is typed as a missing/unrealizable operational dependency, distinct from quota
    exhaustion and from schema-invalid
  - The request is not left Pending forever awaiting a parent pool that will not realize
  - The refusal names the missing parent pool and distinguishes absent from declared-but-unrealizable
  - An audit record of the refusal exists, carrying the unresolved parent-pool dependency
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: hard_dependencies
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: policy_violation
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the dataset's parent-pool reference is resolved and found absent or unrealizable before
      any implementation
  - domain: policy
    interaction: the dependency rule refuses the request on the missing operational parent, not by
      attempting and failing
  - domain: provider
    interaction: no provider is dispatched; no orphaned dataset is created
  - domain: audit
    interaction: the refusal and the unresolved parent-pool dependency are recorded
