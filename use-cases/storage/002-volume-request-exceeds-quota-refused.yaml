uuid: uc-9ff3c3ae-5c4a-4d51-9c6d-d9f89fcf8d6d
handle: storage/volume-request-exceeds-quota-refused
version: 1.0.0
scenario:
  description: 'A platform engineer requests a Storage.Volume whose declared size exceeds the bound
    pool''s available capacity — or the quota governing the requesting scope. Success for this use
    case is the REFUSAL: the request must be rejected before realization, never silently truncated
    to what fits (a size the consumer did not ask for) and never left Pending indefinitely waiting on
    capacity that is not coming. The refusal must be a typed capacity error — machine-matchable as a
    quota/available-capacity exhaustion, distinct from a not-found pool or a schema-invalid request —
    and it must name the constraint concretely: the requested size against the pool''s available
    capacity and the governing quota, so the reader can tell a too-large request from an over-subscribed
    pool. No volume is realized, no capacity is reserved, and an audit record carries the
    requested-versus-available comparison that justified the refusal.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - application-team-member
    - platform-operator
    - sre
    - compliance-auditor
  intent: Request a Volume larger than the bound pool's available capacity or the governing quota,
    and receive a refusal naming the constraint
  success_criteria:
  - The request is refused before realization; no volume is created and no capacity is reserved
  - The refusal is typed as a capacity/quota exhaustion, distinct from not-found and from schema-invalid
  - The request is never silently truncated to a smaller size the consumer did not ask for
  - The request is never left Pending forever awaiting capacity that will not arrive
  - The refusal names the requested size, the pool's available capacity, and the governing quota, so
    too-large is distinguishable from over-subscribed
  - An audit record of the refusal exists, carrying the requested-versus-available comparison
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_with_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: resource_exhaustion
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the pool's available capacity and the governing quota are resolvable records the
      refusal cites
  - domain: policy
    interaction: the capacity/quota rule refuses the request rather than truncating or deferring it
  - domain: provider
    interaction: no provider is dispatched for the refused intent; no capacity is reserved
  - domain: audit
    interaction: the refusal and the requested-versus-available comparison are recorded
