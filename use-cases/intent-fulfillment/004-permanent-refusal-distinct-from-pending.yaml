scenario:
  description: 'A best_effort intent has a member that is refused for a PERMANENT reason (a policy violation
    — it will never realize unless the intent changes), alongside a member merely pending for capacity.
    The two are surfaced DIFFERENTLY: the permanent refusal names what is wrong and how to resolve it
    (change the intent), and is NOT presented as ''wait, it will converge''; the pending member is presented
    as converging. Conflating them would tell the consumer to wait forever for something that can never
    happen.'
  actor:
    persona: platform-engineer
    profile: standard
  intent: Surface a permanent refusal distinctly from a transient pending member so a consumer is never
    told to wait for something that cannot converge
  success_criteria:
  - The permanently-refused member is typed as refused (needs intent change), not pending
  - Its surface names the violated rule and the resolution (what to change), actionable per the refusal
    contract
  - The transient-pending member is surfaced as converging, separately
  - The two are never conflated into one 'partial' status
  - Under best_effort the satisfiable members still realize; the refusal does not block them
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: composite_service
    policy_complexity: governance_matrix_enforcement
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: policy_violation
  profile: standard
  expected_domain_interactions:
  - domain: policy
    interaction: permanent refusal vs transient pending are distinct classifications
  - domain: data
    interaction: per-member classification drives per-member surfacing
  - domain: audit
    interaction: refusal names rule + resolution; pending names blocker + expectation
