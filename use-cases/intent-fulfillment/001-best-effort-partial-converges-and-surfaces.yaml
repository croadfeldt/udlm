version: 1.0.0
scenario:
  description: 'A consumer declares a multi-resource intent (best_effort — the default). One member cannot
    realize now for a transient reason (no eligible provider capacity); the others realize. The platform
    does what a declarative control plane does — converges what it can — and the unsatisfied member stays
    at Intent, reconciling. Crucially the consumer is told: a warning names the member not yet realized,
    why (transient capacity), and that it will converge when capacity frees — not a partial_failures field
    a consumer can miss, but an actionable surface.'
  actor:
    persona: platform-engineer
    profile: standard
  intent: Realize the satisfiable members of a best-effort multi-resource intent, hold the rest pending,
    and surface the shortfall as an actionable warning
  success_criteria:
  - Satisfiable members realize (Intent->Realized); the unsatisfiable member stays at Intent, pending
  - The pending member is classified transient (converges later), distinct from a permanent refusal
  - The consumer receives a warning naming the pending member, the reason, and the expected resolution
    — not only a structured field
  - The reconciliation loop continues attempting the pending member (reconciliation.participates)
  - The overall intent is not reported as fully satisfied while a member is pending
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: composite_service
    policy_complexity: single_validation
    provider_landscape: none_eligible
    governance_context: standard_governance
    failure_mode: partial_fulfillment
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: member lifecycle_states diverge (some Realized, one Intent) — a legal composite state
  - domain: policy
    interaction: best_effort converges independently; pending is transient, surfaced
  - domain: provider
    interaction: no eligible provider now; the reconciliation loop re-attempts
  - domain: audit
    interaction: the shortfall warning and per-member state are recorded
