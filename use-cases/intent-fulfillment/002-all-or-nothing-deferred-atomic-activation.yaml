  profile: standard
  expected_domain_interactions:
  - domain: policy
    interaction: all_or_nothing = readiness barrier; atomic activation on all-ready
  - domain: data
    interaction: members held at Requested; atomic Intent->Realized transition
  - domain: provider
    interaction: reserve (ADR-011) across all members before any activates
  - domain: audit
    interaction: the barrier, the blocker, and the atomic activation are recorded
