scenario:
  description: 'The same multi-resource intent, but the consumer declares all_or_nothing. A member cannot
    reserve yet (a dependency is still converging). Under the readiness barrier NO member activates —
    all are held at Requested (reserved where possible, ADR-011 validate-and-reserve). The intent does
    not fail: it waits, converging, until every member can reserve, then commits all members to Realized
    atomically. All-or-nothing is deferred atomic activation within the convergence model, not a fail-fast
    transaction.'
  actor:
    persona: platform-engineer
    profile: standard
  intent: Hold an all_or_nothing intent at a readiness barrier through transient blockers, then activate
    every member atomically once all can reserve
  success_criteria:
  - No member transitions to Realized while any member cannot reserve (the readiness barrier)
  - The intent waits (does not fail) through transient blockers — it converges, not fails fast
  - When every member can reserve, all members commit to Realized atomically (none partially before the
    others)
  - The consumer's surfaced state shows all-held-pending with the specific blocker named
  - A member that reserved early is not left running while siblings are held — reservation is not activation
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: hard_dependencies
    policy_complexity: governance_matrix_enforcement
    provider_landscape: multiple_eligible
