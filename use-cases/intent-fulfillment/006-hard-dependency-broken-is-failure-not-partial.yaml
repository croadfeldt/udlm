handle: intent-fulfillment/hard-dependency-broken-is-failure-not-partial
version: 1.0.0
scenario:
  description: 'A best_effort intent has member B that hard-depends on member A. A is permanently refused.
    Realizing B would create state that cannot function (it points at a dependency that does not exist)
    — so B is NOT partial-fulfilled-with-a-warning; realizing B is a FAILURE. B is refused (or held),
    never realized dangling. The boundary: partial fulfillment of INDEPENDENT members is correct-with-a-warning;
    partial fulfillment that BREAKS A HARD DEPENDENCY is a failure.'
  actor:
    persona: platform-engineer
    profile: standard
  intent: Treat a member whose hard dependency is unrealized as a failure to refuse/hold, never realize
    it into non-functional dangling state
  success_criteria:
  - A member whose hard dependency is permanently refused is itself refused, not realized
  - The platform never creates a realized member pointing at a non-existent hard dependency
  - This is typed as a failure (broken dependency), distinct from a benign independent-member shortfall
  - Independent members with no dependency on A still realize under best_effort (the failure is scoped
    to the dependency chain)
  - The consumer is told B failed because its hard dependency A was refused, with A's reason
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: hard_dependencies
    policy_complexity: cross_domain_constraint
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: policy_violation
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: hard-dependency edge makes B's realization conditional on A's
  - domain: policy
    interaction: broken hard dependency = failure, not warned-partial
  - domain: audit
    interaction: B's failure names A as the cause
