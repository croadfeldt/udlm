  profile: prod
  expected_domain_interactions:
  - domain: data
    interaction: the realized-duration report + the updated estimate value and freshness horizon
  - domain: policy
    interaction: the estimate is refreshed; no gating decision here — this is the enrichment that feeds later fit gates
  - domain: provider
    interaction: the provider runs the adoption and reports realized duration back (the realized-state callback / T6 loop)
  - domain: audit
    interaction: the realized duration and the estimate update are recorded as provenance
