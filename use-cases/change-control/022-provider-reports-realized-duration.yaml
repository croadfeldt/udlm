scenario:
  description: >-
    An adoption run — a Process-family job (ADR-053 boundary) — completes, and the provider reports
    its realized duration back alongside the realized state (ADR-053 §8, the realized-state callback
    it already uses). That actual becomes validation evidence (T6) for the provider's advertised
    time-to-complete estimate, updating it and refreshing its freshness horizon. The honesty loop:
    the estimate the next window-fit gate reads is corrected by what the last run actually took, so
    it tracks reality instead of drifting from a one-time guess.
  actor:
    persona: provider-owner
    profile: prod
  perspectives:
    - platform-operator
    - sre
    - platform-engineer
  intent: >-
    Report an adoption's realized duration back through the realized-state callback so it validates
    and refreshes the provider's time-to-complete estimate for the next fit decision
  success_criteria:
  - The realized duration is reported through the provider's existing realized-state callback (ADR-053 §8)
  - The actual is recorded as validation evidence for the advertised estimate (T6 loop)
  - The estimate and its freshness horizon are updated from the actual
  - The next window-fit decision reads the corrected estimate — it tracks reality, not a one-time guess
  dimensions:
    lifecycle_phase: day2_operations
    resource_complexity: multi_dependent
