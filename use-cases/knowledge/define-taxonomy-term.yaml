handle: knowledge/define-taxonomy-term
version: 1.0.0
scenario:
  description: 'A platform engineer defines a TaxonomyTerm — a single term in a controlled vocabulary,
    carrying its identifier, its label, and its place in the vocabulary — as first-class knowledge that
    other records classify against by reference. The term is declared knowledge, not a free string: it
    belongs to a named vocabulary, so a consumer that tags a resource with the term resolves to one
    authoritative definition rather than inventing its own synonym. This stresses that a taxonomy is
    single-sourced, referenceable data: the TaxonomyTerm record IS the authoritative definition
    classification consults, a consumer references it by handle rather than re-spelling the label, and the
    vocabulary rehydrates by replaying the same term declarations so classification stays consistent and
    drift-free across the estate.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - platform-operator
    - compliance-auditor
    - sre
  intent: Define a TaxonomyTerm in a controlled vocabulary as a referenceable, single-sourced term other
    records classify against
  success_criteria:
  - The TaxonomyTerm is defined with its identifier, label, and place in a named controlled vocabulary
    from the record alone
  - The term is referenceable by handle; a consumer classifies against it rather than re-spelling the label
    as a free string
  - Classification resolves to one authoritative definition — no consumer invents its own synonym
  - The term definition is readable from the record, single-sourced, not duplicated per consumer
  - The vocabulary rehydrates by replaying the same term declarations, keeping classification consistent
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: no_policy
    provider_landscape: single_eligible
    governance_context: no_governance
    failure_mode: happy_path
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the TaxonomyTerm record is the complete, portable, authoritative definition of the term
  - domain: policy
    interaction: validation confirms the term belongs to a named vocabulary and is well-formed before admission
  - domain: provider
    interaction: no provider is dispatched — the term is a knowledge fact, not a realized resource
  - domain: audit
    interaction: the term definition is recorded as a single-sourced, referenceable vocabulary entry
