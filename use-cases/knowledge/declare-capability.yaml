handle: knowledge/declare-capability
version: 1.0.0
scenario:
  description: 'A platform engineer declares a Capability — a platform or provider capability fact, such
    as a supported feature, protocol, or backend class — as first-class knowledge that other resources
    can reference by handle. The Capability is a stated fact, not a running resource: it names the
    capability, the thing that offers it, and its identifying attributes, so placement and validation can
    consult it as data rather than hard-coding provider knowledge into the substrate. This stresses that a
    capability is declared knowledge, not inferred behavior: the Capability record IS the fact intent and
    routing consult, a consumer references it by handle rather than re-asserting the same fact, and the
    knowledge rehydrates by replaying the same declaration so what a provider is known to offer is data
    the model carries, not tribal knowledge baked into code.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - platform-operator
    - sre
    - compliance-auditor
  intent: Declare a Capability as a referenceable platform/provider fact that placement and validation
    consult as data
  success_criteria:
  - The Capability is declared as a fact — naming the capability, the offerer, and its identifying
    attributes — from the record alone
  - The Capability is referenceable by handle; a consumer cites it rather than re-asserting the same fact
  - Placement and validation consult the Capability as data, not as provider knowledge hard-coded into
    the substrate
  - The capability fact is readable from the record, not inferred from a running provider
  - The knowledge rehydrates by replaying the same declaration, unchanged
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: no_policy
    provider_landscape: single_eligible
    governance_context: no_governance
    failure_mode: happy_path
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the Capability record is the complete, portable statement of the fact — capability, offerer, attributes
  - domain: policy
    interaction: validation confirms the capability declaration is well-formed before it is admitted
  - domain: provider
    interaction: placement consults the declared capability as data rather than hard-coded provider knowledge
  - domain: audit
    interaction: the capability declaration is recorded as a referenceable knowledge fact
