handle: observability/log-shipper-sink-unreachable-refused
version: 1.0.0
scenario:
  description: 'A platform engineer requests an Observability.LogShipper whose declared sink is unreachable
    or unauthorized — the destination cannot be resolved, or the shipper is not authorized to write to it.
    Success for this use case is that the shipper is REFUSED at admission, not realized into a running
    forwarding path that silently discards every log line because the sink never accepts it (a soft-fail
    that looks healthy while the logs — the very evidence an incident is later reconstructed from — are
    dropped on the floor). The request must be driven to a typed terminal refusal that names the failure —
    the unreachable or unauthorized sink — never admitted as a live shipper forwarding into a void, and
    never left Pending on a sink that will not become reachable on its own. The refusal must be typed as a
    policy violation — machine-matchable and distinct from an unrelated provider fault and from a
    capability mismatch — and carry an actionable resolution (correct the sink, or grant the shipper
    authorization to it). It must name the sink failure without leaking the internal address or ownership
    of destinations the requester is not authorized to see, and it must leave a tamper-evident audit
    record of the denied request and the deciding rule.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - sre
    - platform-operator
    - security-officer
    - compliance-auditor
  intent: Request a LogShipper whose sink is unreachable or unauthorized, and have it refused as a typed
    policy violation naming the sink failure rather than admitted as a shipper that silently drops logs
  success_criteria:
  - 'typed: the request reaches a typed terminal refusal typed as a policy violation, distinct from an
    unrelated provider fault and from a capability mismatch — never admitted as a live shipper, and never
    left Pending on an unreachable sink'
  - 'actionable: the refusal names the unreachable or unauthorized sink and carries a resolution the
    requester can act on (correct the sink, or grant the shipper authorization to it)'
  - 'whole: no partial shipper is stood up — logs are never silently dropped into a void; the shipper is
    refused as a unit rather than realized as a half-working forwarding path'
  - 'non-leaking: the refusal names only the sink failure, not the internal address or ownership of
    destinations the requester is not authorized to see'
  - 'auditable: the denied request, the sink failure, and the deciding rule leave a tamper-evident audit record'
  dimensions:
    lifecycle_phase: provisioning
    resource_complexity: single_with_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: policy_violation
  profile: standard
  expected_domain_interactions:
  - domain: policy
    interaction: the sink-reachability/authorization rule denies the request before realization, driving a typed refusal
  - domain: data
    interaction: the declared sink and the reason it is unreachable or unauthorized are resolvable records the refusal cites
  - domain: provider
    interaction: no shipper is realized — the sink failure is caught at admission, not discovered as silently-dropped logs
  - domain: audit
    interaction: the denied request, the sink failure, and the deciding rule are recorded
