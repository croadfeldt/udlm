version: 1.0.0
scenario:
  description: >-
    A platform engineer authors a Base Class as SharedDataElements at one scope (ADR-038). 'Base field', 'shared vocabulary', and 'provider extension' collapse into scope: a Base element is portable across the category's types, a Type element across the type's providers, a Provider element provider-bound. No portability is declared — the scope position IS the portability.
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - platform-operator
    - solution-architect
    - provider-owner
  intent: >-
    Author a Class of scoped SharedDataElements where each element's scope alone determines portability — base fields, shared vocabularies, and provider extensions as one shape
  success_criteria:
  - A Class composes SharedDataElements at one scope; each carries {scope, schema, values, state}
  - An element's scope equals its owning Class; scope is its portability (no separate declaration)
  - Base/shared/extension collapse into scope — one shape, not three constructs
  - A governed value vocabulary is `values` reference-data, not an inline enum (PVD-001)
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_with_deps
    policy_complexity: system_defaults_only
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: happy_path
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the Class artifact + its SharedDataElements (scope, schema, values, state)
  - domain: policy
    interaction: the assembly/placement engine reads the compiled spec; portability derives from scope
  - domain: provider
    interaction: a provider naturalizes the class's elements at its edge (T9 / ADR-023)
  - domain: audit
    interaction: the class version, its elements, and any promotion/compile are recorded
