  description: >-
    A Type Class extends its Base Class, adding type-specific elements and refining an inherited one — narrowing a bound, tightening an enum, adding a required field. The Liskov invariant holds (add or refine, never contradict), so a Provider Class is-a Type Class is-a Base Class. The refinement is accepted and the compiled spec carries the narrowed shape.
