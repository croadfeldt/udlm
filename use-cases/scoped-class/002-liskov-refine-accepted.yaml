  intent: >-
    Extend a Base Class by adding and refining elements under the Liskov invariant, so the child narrows the parent and the extension is accepted
  success_criteria:
  - A child adds new elements freely and may refine an inherited one (narrower bound, tighter enum, added required)
  - A refinement that narrows the parent is accepted by the Liskov gate
  - The is-a relationship holds; the compiled child spec carries the refined shape
