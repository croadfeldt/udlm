handle: software/image-unsigned-refused
version: 1.0.0
scenario:
  description: 'A platform engineer references a SoftwareImage into the catalog by digest, but the image
    carries no signature — or a signature that does not verify against any trusted signing identity. Success
    for this use case is the REFUSAL: the image must be rejected at the supply-chain admission gate, not
    admitted with an unverified base, and not admitted-with-a-warning that later consumers are free to ignore
    (a silent downgrade that lets unverified bytes into every Service built on it). The refusal must be typed
    and machine-matchable as a signature-verification failure — distinct from a not-found reference and from a
    schema-invalid record — and it must name what failed: that no verifiable signature from a trusted signer
    exists over the referenced digest, so the reader can supply a signature rather than guess at the cause.
    Nothing is admitted; no consumer inherits the unverified image; and an audit record carries the refused
    digest and the failed verification that justified the rejection.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - application-team-member
    - security-officer
    - compliance-auditor
  intent: Reference a SoftwareImage whose signature is absent or unverifiable, and receive a refusal naming
    the failed verification rather than a silent admission-with-warning
  success_criteria:
  - The image is refused at the admission gate; nothing is admitted, and specifically it is not admitted with
    an unverified base or admitted-with-a-warning consumers can ignore
  - The refusal is typed as a signature-verification failure, distinct from not-found and from schema-invalid
  - The unverified image is never silently downgraded into the catalog — refusal of the whole admission, never
    a partial admission with a soft warning
  - The refusal names that no verifiable signature from a trusted signer exists over the referenced digest,
    so the reader can supply a signature, and carries an actionable resolution
  - An audit record of the refusal exists, carrying the refused digest and the failed verification
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: compliance_gated
    failure_mode: policy_violation
  profile: standard
  expected_domain_interactions:
  - domain: policy
    interaction: the supply-chain admission gate refuses the digest when no verifiable signature from a
      trusted signer exists, rather than admitting with a warning
  - domain: data
    interaction: the referenced digest and the absent-or-failed signature are the records the refusal cites
  - domain: provider
    interaction: no provider is dispatched; the refused image never becomes a base any Service inherits
  - domain: audit
    interaction: the refused digest and the failed verification are recorded
