handle: software/database-ha-no-eligible-provider-refused
version: 1.0.0
scenario:
  description: 'A platform engineer requests a Data.Database with high availability declared as a hard
    requirement, but no registered data provider declares the capability to realize a multi-node HA topology
    for the requested engine — every eligible backend can serve only a single node. Success for this use case
    is the REFUSAL: the request must be rejected naming the unmet requirement, not accepted and then silently
    degraded to a single-node database the requester never asked for (a partial realization that reports
    success while quietly dropping the HA guarantee). The refusal must be typed as a capability mismatch —
    machine-matchable, distinct from a provider failure (no provider broke; none was ever eligible for HA)
    and from a policy denial — and it must name the required capability (the HA topology at the requested
    engine) against what the eligible providers actually declared, so the reader can tell a mis-routed
    request from an unsatisfiable one. No database is realized single-node as a consolation; any evaluation
    artifact is reconciled, and an audit record carries the required-versus-declared comparison that
    justified the refusal.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - application-team-member
    - sre
    - provider-owner
    - compliance-auditor
  intent: Request an HA-required Database for which no provider declares the HA capability, and receive a
    refusal naming the unmet requirement rather than a silent single-node degradation
  success_criteria:
  - The request is refused; no database is realized, and specifically none is realized single-node as a
    silent substitute for the declared HA requirement
  - The refusal is typed as a capability mismatch, distinct from a provider failure and from a policy denial
  - The HA requirement is never silently dropped to make the intent fit — refusal of the whole intent, never
    a degraded partial that reports success
  - The refusal names the required HA capability at the requested engine against the eligible providers'
    actually-declared sets, so mis-routed is distinguishable from unsatisfiable, and carries an actionable
    resolution
  - An audit record of the refusal exists, carrying the required-versus-declared capability comparison
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_with_deps
    policy_complexity: single_validation
    provider_landscape: none_eligible
    governance_context: standard_governance
    failure_mode: policy_violation
  profile: standard
  expected_domain_interactions:
  - domain: provider
    interaction: no provider declares the HA topology capability for the engine; none receives work, and
      none realizes a single-node substitute
  - domain: policy
    interaction: the eligibility rule refuses on the declared HA requirement rather than degrading the intent
      to fit an eligible single-node backend
  - domain: data
    interaction: the required HA capability and the providers' declarations are resolvable records the
      refusal cites
  - domain: audit
    interaction: the refusal and the required-versus-declared comparison are recorded against the request
