handle: software/reference-signed-image
version: 1.0.0
scenario:
  description: 'A platform engineer references a SoftwareImage into the catalog by immutable digest, carrying
    a cryptographic signature that a trusted signer produced over that digest. The admission gate verifies the
    signature against the trusted signing identity before the image becomes referenceable: the digest pins
    exactly which bytes are admitted, and the verified signature attests they came from an approved source.
    Success is that the image is admitted to the catalog with the verified-signature attestation recorded on
    its record, so any later Service that references it inherits a supply-chain-verified base. This stresses
    that a SoftwareImage is admitted by reference (digest) rather than by copy, that the signature is verified
    at admission time rather than assumed, and that the verification outcome is readable from the catalog
    record rather than re-derived by every consumer.'
  actor:
    persona: platform-engineer
    profile: standard
  perspectives:
    - application-team-member
    - platform-operator
    - security-officer
    - compliance-auditor
  intent: Reference a SoftwareImage by digest with a signature from a trusted signer, and have it admitted to
    the catalog with the verified-signature attestation recorded
  success_criteria:
  - The image is referenced by immutable digest — the exact bytes admitted are pinned, not copied into the
    catalog
  - The signature is verified against the trusted signing identity at admission time, not assumed
  - The image is admitted and the verified-signature attestation is recorded on its catalog record
  - A downstream Service that references the image inherits the supply-chain-verified base, readable from the
    record rather than re-derived
  - The admission and its verification outcome are recorded against the image
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: happy_path
  profile: standard
  expected_domain_interactions:
  - domain: data
    interaction: the digest and the signature are the portable admission record; the digest pins the admitted
      bytes
  - domain: policy
    interaction: the admission gate verifies the signature against the trusted signer before the image is
      referenceable
  - domain: provider
    interaction: no implementation provider is dispatched; admission is a catalog-reference operation
  - domain: audit
    interaction: the admission and the verified-signature outcome are recorded against the image
