  \ string for what looks like a selectable value, present when the gate landed 2026-08-15. Reported; a NEW one\
  \ fails. This is a TRIAGE list, not an exemption list: some entries are genuine findings that need a vocabulary\
  \ (partition_mechanism, architecture, protocol, media_type, severity, health), and some are false positives the\
  \ name heuristic cannot tell from them (a Quantity, an adopted format). Fix by constraining the value or by widening\
  \ the out-of-scope names with a reason \u2014 never by adding a line here."
