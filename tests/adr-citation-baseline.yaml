_comment: Burn-down baseline for tests/check_adr_citations.py (ADR-CITE-001). Bare ADR citations with no local file. Reported
  as WARN; a NEW one fails CI. Most are DCM control-plane ADRs cited without the `DCM ` prefix - the numbering spaces OVERLAP,
  so a bare citation resolves to the WRONG decision for a reader who assumes it is local. Fix by QUALIFYING, never by baselining.
  The 2026-08-12 additions came from widening SCAN to the surfaces the gate had never read - docs/adr/ itself (the densest
  citer in the repo, and the one place a dead citation could live unchallenged), docs/authoring/, docs/design/, docs/guides/
  and use-cases/. They are not new defects; they are defects that were never visible.
