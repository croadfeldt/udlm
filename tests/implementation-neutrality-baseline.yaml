_comment: "Burn-down baseline for tests/check_implementation_neutrality.py (IMP-001). Unmarked implementation references across the whole normative tier \u2014 docs/spec/, docs/adr/ AND registry/ (generated/\
  \ excluded: a reference there is a projection of one in the authored class, and failing on both makes one defect look like two). Reported as WARN; a NEW one fails CI. Entries store a HASH of the line,\
  \ never the line \u2014 an early version stored the text and the estate-token gate caught it copying a denylisted token into tests/. Shrink with every burn-down PR (#503); never add an entry to silence\
  \ a new violation."
