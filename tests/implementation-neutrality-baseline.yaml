_comment: 'Burn-down baseline for tests/check_implementation_neutrality.py (IMP-001). Implementation references present in the normative tier when the gate landed 2026-08-10; reported as WARN, a new one
  fails CI. Entries store a HASH of the line, never the line: an early version stored the text and the estate-token gate caught it copying a denylisted token out of a document. A baseline recognises a line,
  it does not reproduce it. Prompted by dcm-project/udlm PRs 55/56/57, six comments making the same objection.'
