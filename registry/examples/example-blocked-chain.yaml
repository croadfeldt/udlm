      capacity: 500Gi
      access_mode: read_write_once
    at: '2026-08-10T09:00:00Z'
    time_source: authored example — no clock claim
status:
  state: pending
  conditions:
    # THE ROOT. `refused` carries no `blocked_on` and the schema conditional exempts it: it IS the
    # root of the chain, so there is nothing upstream to point at. Its cause is its own reason.
    - type: refused
      status: 'True'
      reason: no pool in this zone can satisfy 500Gi, and none is planned
      last_transition_time: '2026-08-10T09:00:05Z'
