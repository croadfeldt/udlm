# asserts: DEP-017, FUL-001, FUL-002, FUL-003
# proves: a member that has not realized says WHY and what it waits on, and the chain reaches a root
#
# THREE RECORDS, ONE STORY — the case the use-case corpus already designed and the model could not
# record. A volume has no capacity. A container needs it. An app needs the container.
#
#   app  --blocked-permanent-->  container  --blocked-permanent-->  volume  (refused: the root)
#
# The refusal at the root is PERMANENT, so each link inherits blocked-permanent rather than
# blocked-transient. That is the whole distinction: transient waits and converges when it can,
# permanent is refused window-independently. Had the volume merely been short of capacity today,
# the same three records would read blocked-transient and nobody would need to act.
#
# WHY THIS IS NOT A REFUSAL. Nothing here is wrong; it is EARLY. The container is blocked on a value
# that arrives one step later, and refusing the request would fail something that was always going
# to succeed. So the model holds the intent and records what is being waited on. Whether the wait
# ever becomes permanent is the execution pipeline's call over the convergence window — the model's
# job is to make that call rest on evidence rather than on a stopwatch.
#
# WHY EACH LINK NAMES ONLY ITS IMMEDIATE BLOCKER. The app does not carry a copy of "the volume".
# The root is found by WALKING (app -> container -> volume), never by copying it down the chain —
# a copied root is a second source that goes stale the moment the middle of the chain changes
# (DRV-001). What each record owes is one honest hop.
#
# LIFECYCLE_STATE IS UNTOUCHED. All three are `Requested`. Blocking is an overlay on a lifecycle
# that never leaves its five values, exactly as recovery and health are — there is no BLOCKED
# lifecycle state and adding one would put the same fact on two axes.
---
