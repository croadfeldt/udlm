# "You may adopt this, if the promotion diff is clean." WHEN it may run is not here.
#
# THE POLICY DECIDES WHETHER; ITS CONFIGURATION DECIDES WHEN (ADR-053, POL-011). This record is the
# evidence check: the logic, the same in every deployment. The window, the freeze and the expedite
# approval are one deployment's, so they are schedule clauses on its configuration
# (example-policy-configuration-change-window.yaml).
#
# TEMPORAL CLAUSES GOVERN WHEN, NEVER WHETHER. A clause carries no field that can express a
# decision, and it sits on a different record from the rule, so no schedule clause, `expedite`
# included, can reference the evidence check away. Expedite compresses the calendar; it never skips
# the diff. A deadline must not be able to decide a safety question.
#
# WHY A CLAUSE CONFIGURES A VALIDATION POLICY and is not a new policy_type: when a change may run
# is a property of the gate, not a different kind of gate.
record_type: policy
uuid: 9a4c6e18-73b2-4d05-8f39-1c62e0847ab5
handle: adoption-evidence-gate
conforms_to: udlm/1.0
name: Adoption proceeds only on a clean promotion diff
description: >-
  Validation policy — a promotion may proceed only when the promotion diff reports no violation.
  When it may run is its configuration's. Worked example (cexample content).
version: 2.0.0
status: {state: active}
policy_type: validation
policy_class: structural
concern_type: change_control

# THE EVIDENCE CHECK. This is what decides WHETHER, and nothing on a configuration can change it.
match:
  facts: [operation.type, limits.violations]
  rule:
    engine: rego
    body: |
      package udlm.adoption_gate
      # The ADR-046 promotion diff is the gate. No schedule clause can reference this away.
      deny if { count(input.limits.violations) > 0 }

output:
  decision: deny
  reason: >-
    this adoption is refused by the promotion diff, or it is outside the declared change window or
    held by a freeze — a refusal for timing names the clause holding it and the next transition, so
    an estate that is behind can show it is on-policy behind rather than merely late
metadata:
  display_name: Adoption evidence gate
  notes:
  - at: '2026-08-16T00:00:00Z'
    author: UDLM project
    text: >-
      Worked example for ADR-053. Typed adoption debt is DERIVED from the configuration's schedule
      clauses and never stored — `pin_behind` when nothing holds it, `windowed` when a window does,
      `frozen` when a freeze does. Storing the verdict would let it disagree with the clauses that
      produce it.
  - at: '2026-11-22T00:00:00Z'
    author: UDLM project
    text: >-
      Version 2.0.0 holds the logic alone. The schedule clauses, the tenant, the scope and the
      enforcement level moved to a policy configuration (POL-011).
