  notes:
  - at: '2026-07-25T16:45:00Z'
    author: udlm-maintainers
    text: Worked example of the full round trip — a refused promotion becomes an upstream finding, the
      finding becomes a classifier fix, and the fix becomes a change with its own regeneration manifest.
      Note what the reporter did not have to disclose to make it actionable — an opaque estate reference,
      output names and change kinds, and a digest were enough; the full diff stayed behind the estate's
      egress gate and was never requested.
  - at: '2026-07-27T00:00:00Z'
    author: udlm-maintainers
    text: Supersedes the original example record (ADR-051 v2-file pattern) — artifact_revision moved
      from uuid to digest when the identity/version/digest ruling landed; a finding is immutable, so
      the migration is a new record naming its predecessor, with the prior bytes in the revision store.
