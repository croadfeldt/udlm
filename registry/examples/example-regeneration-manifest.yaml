  summary: The `firmware` element moved out of the Compute Base Class and into the Compute.VirtualMachine
    Type Class. No field was added, removed, or reshaped — the element's scope narrowed, so everything
    that inherited `firmware` from the Base Class no longer carries it portably.
classification:
  compatibility: breaking
  classified_by: element-scope narrowing (ADR-045 Decision 4 — portability derives from scope position,
    so moving an element to a narrower scope shrinks every carrier's portable surface)
  required_bump: major
  declared_bump: major
  reasons:
  - level: major
    rule: element-scope narrowing
    detail: element `firmware` moved from Base scope to Type scope on Compute.VirtualMachine; carriers
      outside that Type Class lose it from their portable surface
  - level: minor
    rule: element added
    detail: element `firmware_settings` added at Type scope alongside the moved element
