# A PROVIDER TAKES UP A NEWER CLASS VERSION BY RE-REGISTERING (VERSIONING.md, "Versions carry down the class tree").
#
# NetworkGateway 0.10.0 added `identity` and the `located_in` edge (register row 164). This provider had
# not built support for them, so its registration 1.0.0 stayed bound to the earlier version:
#
#       - fqn: NetworkGateway
#         version: 0.9.2
#
# That was legal and visible: the registry moved on, the provider's statement of support did not. A record
# that stated an `identity` did not fit this provider; one that left it out still did.
#
# The provider now honours both, so it re-registers with the binding raised to 0.10.0. This is that
# registration. Two versions are involved, each moved by its owner:
#   - the class version was already there; the registry published 0.10.0 and the provider only names it.
#   - the registration's own `version` goes 1.0.0 -> 1.1.0. Honouring more elements is an additive change
#     to the provider's declared surface, so it is a minor (ADR-045 Decision 8).
# The uuid does not move: it is the same provider. Lowering a binding would withdraw support, a breaking change.
record_type: provider_registration
uuid: 2f7b6c15-9e04-4d83-b2a7-6c1d8e30f942
conforms_to: udlm/1.0
handle: lab/network/edge-firewall
version: 1.1.0
display_name: Edge firewall
description: Routes and filters traffic at the edge of the lab network.

capabilities:
  - realize_resources

capability_profiles:
  realize_resources:
    resource_types:
      # The bound version is the statement of support.
      - fqn: NetworkGateway
        version: 0.10.0
    two_phase_realization:
      hold_supported: false

sovereignty_declaration:
  operating_jurisdictions: [US]
  data_residency_zones: [US-MN]
  enforcement_plane: both

accepts_roles: [execution]

health_endpoint: https://edge-firewall.lab.example/health

certificate:
  pem: |
    -----BEGIN CERTIFICATE-----
    (provider leaf certificate)
    -----END CERTIFICATE-----
  ca_chain: |
    -----BEGIN CERTIFICATE-----
    (lab intermediate CA)
    -----END CERTIFICATE-----
