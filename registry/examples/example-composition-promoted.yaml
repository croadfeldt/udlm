# The other end of the story: a composition that WAS promoted.
#
# The retail team's storefront diagram (example-composition-record.yaml) is still PROPOSED — nobody
# nominated it. This one went the whole way: ingested, nominated, reviewed, accepted. The class it
# became is `Template.Application.AcmeThreeTier`, and that class points back here.
#
# THE ROUND TRIP IS THE POINT (ING-017). Both halves, or neither counts: a one-way pointer is how a
# promotion that never happened still looks like one from whichever side you happen to read first.
# check_composition_promotion.py walks both directions.
#
# THE RECORD SURVIVES (ING-018). Promotion did not consume it. When the platform team re-exports the
# same architecture next quarter, the importer matches `provenance.source_ref` and updates THIS
# record — instead of filing a second composition that looks brand new and starts the whole review
# over.
#
# WHAT THE REVIEW ACTUALLY DECIDED, because it is the part nothing can compute (ING-020): this
# record states fixed values — one database, one app tier, one web tier. The class states what may
# VARY: `tier_size` and `database_capacity`, offered as `supports` ranges. Somebody had to decide
# that the sizing was a consumer's choice and the wiring was not. That judgement IS the promotion,
# and it is why this is a governed process rather than a conversion.
