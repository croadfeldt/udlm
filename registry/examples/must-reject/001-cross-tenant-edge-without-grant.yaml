# The executable half of a scenario written long before anything enforced it.
must_reject:
  rule: GRD-001
  gate: check_grant_derivation
  because: A VM in a THIRD tenant binds to a VLAN the platform tenant owns. The shipped estate grants that VLAN
    to the payments tenant and to nobody else, so this crossing has no grant behind it — and the case is deliberately
    in a tenant the grant does not name, because a payments VM binding to the same VLAN would be legitimately authorised
    and would prove nothing. CTX-001 requires one. Caught at admission it costs a rejected request; caught at dispatch
    it costs a partially realized composite and a compensation path (CMP-009's trade, which ADR-066 applies to authorization).
  use_case: must-reject/001-cross-tenant-reference-refused
