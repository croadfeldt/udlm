must_reject:
  rule: WIR-003
  gate: schema
  expect_path: $.handle
  because: An uppercase handle with an underscore. The grammar is lowercase, hyphen-separated, slash-namespaced
    — and it exists so a handle means the same thing to every peer. Two peers disagreeing on case turns one name
    into two, which is the failure the grammar prevents. It was stated in identifier-scheme §3, required by §6,
    and enforced by none of the nine schemas carrying a handle.
