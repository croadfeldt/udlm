must_reject:
  rule: WIR-007
  gate: schema
  expect_path: $.states.realized.at
  because: >-
    A timestamp with a `+02:00` offset instead of `Z`. Two peers comparing instants written in
    different offsets have to agree on a conversion before they can agree on ordering, and audit
    chains depend on that ordering. Normalising to UTC at the wire is what makes an instant mean the
    same thing on both sides; an offset is readable and still wrong here.
