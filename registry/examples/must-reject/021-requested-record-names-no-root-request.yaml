must_reject:
  rule: DEP-015
  gate: schema
  expect_path: $
  because: 'A requested record with no root_request_uuid. Every requested record names the root request it
    was expanded for — a root names itself — so the whole of one order is recoverable from the records
    alone (DEP-015). A requested record that names no root is an order nobody can reassemble: a child
    expanded from a dependency or a composition would float free of the request that caused it, and the
    audit question "what did this order cause" would need the dependency graph, which the records exist
    to make unnecessary.'
