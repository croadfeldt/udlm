must_reject:
  rule: ING-019
  gate: check_composition_promotion
  because: >-
    An importer is not a human. A composition synthesized from a LikeC4 diagram is
    `discovered-derived` however clean the mapping was; marking it `declared` claims a person wrote
    these constituents and reviewed them. The distinction is not bookkeeping — a reviewer deciding
    whether to promote this into shared vocabulary weights inferred content differently from
    authored content, and the marker is the only thing that tells them which they are reading. Same
    rule brownfield entity ingestion already applies.
