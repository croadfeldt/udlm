must_reject:
  rule: payload.fields
  gate: conformance
  because: The mount's `subpath` is `../other`. A subpath names a directory inside the export, relative to its
    root; a `..` segment climbs out of the export the FileShare offers, so the guest would mount a path the share
    never exported. Machine 2.7.0 refuses a leading `/` or any `..` segment.
