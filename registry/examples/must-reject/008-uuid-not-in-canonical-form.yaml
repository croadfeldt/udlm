must_reject:
  rule: WIR-001
  gate: schema
  expect_path: $.uuid
  because: >-
    An uppercase UUID. RFC 9562 canonical form is lowercase hyphenated, and two peers writing the
    same identity in different cases would compare unequal — so identity itself stops working across
    the boundary the form exists to make safe. Cheap to accept, expensive to detect later.
