must_reject:
  rule: PRV-003
  gate: schema
  expect_path: $.capability_profiles.realize_resources.resource_types[0]
  because: The binding names a class and no version. The version is the provider's statement of support, every
    element of the class at that version. Without it nobody can tell which elements the provider honours, and
    a base class moving underneath would change the answer silently.
record:
  __schema__: provider-registration.schema.json
  record_type: provider_registration
  uuid: 5c1e9a72-3d48-4b06-8f1a-2e7d90c4b642
  conforms_to: udlm/1.0
  handle: lab/compute/kvm-host-c
  version: 1.0.0
  display_name: KVM host C
  description: Realizes virtual machines on one lab host.

  capabilities:
    - realize_resources/Machine

  capability_profiles:
    realize_resources:
      resource_types:
        - fqn: Machine.VM
      two_phase_realization:
        hold_supported: false

  sovereignty_declaration:
    operating_jurisdictions: [US]
    data_residency_zones: [US-MN]
    enforcement_plane: both

  accepts_roles: [execution]

  health_endpoint: https://kvm-host-c.lab.example/health

  certificate:
    pem: |
      -----BEGIN CERTIFICATE-----
      (provider leaf certificate)
      -----END CERTIFICATE-----
    ca_chain: |
      -----BEGIN CERTIFICATE-----
      (lab intermediate CA)
      -----END CERTIFICATE-----
