must_reject:
  rule: REL-002
  gate: conformance
  because: A scanner writes a bill of materials that lists a package and names no subject. A list of packages that
    belongs to nothing answers no question, since nobody can say which image or machine carries them. The class
    marks `describes` structural with cardinality 1..1, so a record with no such edge is refused. Its one edge
    resolves to a SoftwarePackage, which `contains` declares and `describes` does not.
