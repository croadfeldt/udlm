# A filing lives on the class, never on a record (ADR-082, CLS-010). A record's groups resolve through
# its resource_type to the class's CURRENT filing; writing them into a sealed record would freeze
# organization into identity. The state-record schema is closed, so the property is refused there.
must_reject:
  rule: CLS-010
  gate: schema
  expect_path: $
  because: "a requested record carries `filed_under`; a filing is organization on the class, not content of a record"
record:
  __schema__: state-record.schema.json
  record_type: requested_record
  state: Requested
  record_uuid: 01a0e3cb-34d0-7261-9517-df3cbac3ce99
  intent_ref: 01a0e3cb-34d0-7261-9517-df3cbac3ce20
