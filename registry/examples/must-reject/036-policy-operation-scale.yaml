must_reject:
  rule: POL-001
  gate: schema
  expect_path: $.lifecycle_scope.operations[1]
  because: A policy configuration scoped to the operation `scale`. The operation list is closed at twelve
    values; a change of capacity is an `update`, and a policy that wants only sizing changes filters on
    `changed_fields`. A name outside the list would never match an operation the control plane performs, so
    the policy would never fire and nobody would know (#723).
record:
  __schema__: policy-configuration.schema.json
  record_type: policy_configuration
  uuid: 5a1f3c86-2d49-4b7e-8c13-9f0e6d2a4b57
  handle: research/scale-scoped-configuration
  conforms_to: udlm/1.0
  name: A configuration scoped to an operation the model does not name
  description: Deliberately wrong (must-reject). Configures the residency gate, scoped to initial_provisioning and scale.
  version: 1.0.0
  tenant_uuid: 75ccf4ff-3e8d-4963-bc51-459ae1014cb7
  status: {state: active}
  configures: data-residency-gate@3.0.0
  parameters:
    classification_levels: [eu_personal]
    allowed_zones: [eu-west]
  domain: tenant
  enforcement: hard
  lifecycle_scope:
    operations: [initial_provisioning, scale]
  audit_on: [DENY]
  notification_on: [DENY]
