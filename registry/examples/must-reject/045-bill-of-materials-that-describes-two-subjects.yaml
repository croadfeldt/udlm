must_reject:
  rule: REL-002
  gate: conformance
  because: A scanner merges the package lists of a bastion host and a virtual machine into one bill of materials
    and points it at both. A reader can no longer tell which machine carries which package, so an advisory against
    one package would be reported against both. `describes` is one relation declared for several kinds of subject,
    and its cardinality of 1..1 counts across all of them, so one edge to a Machine and one to a Machine.VM is two
    subjects, and the record is refused.
