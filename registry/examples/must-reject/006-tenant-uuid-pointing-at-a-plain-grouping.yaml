must_reject:
  rule: GRP-INV-001
  gate: check_group_invariants
  because: >-
    tenant_uuid points at a cost-centre grouping rather than a tenant. Before Grouping.Tenant
    existed the two were indistinguishable in the data and this could not be caught at all — a
    record could claim membership of a label and read as correctly owned. Ownership, cost
    attribution, audit scope, and drift accountability all resolve through this field, so pointing
    it at something that isn't an owner gives four subsystems the same wrong answer.
