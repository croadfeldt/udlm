must_reject:
  rule: WIR-002
  gate: schema
  expect_path: $.uuid
  because: >-
    A v1 UUID where identity is required — the version nibble reads 1, not 4. v1 encodes the MAC
    address and the time it was minted, so an identity leaks where and when it was created, and
    becomes guessable from a neighbouring one. UUIDv7 is permitted only on fields declared
    time-ordered; identity is not one of them.
