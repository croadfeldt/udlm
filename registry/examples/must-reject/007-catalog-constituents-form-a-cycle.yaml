must_reject:
  rule: CMP-002
  gate: check_composition_constraints
  because: >-
    The three tiers depend on each other in a ring: web needs app, app needs database, database
    needs web. Ordering a composite means walking its dependency graph to decide what to build
    first, and a ring has no first. Caught at admission it is a rejected catalog item; caught at
    expansion it is a deadlock the operator has to diagnose from a stalled request.
record:
  record_type: class
  uuid: 2ad4f168-9b73-4c05-8e21-6f37b9a0d4c5
  handle: acme/ouroboros-stack
  conforms_to: udlm/0.1
  resource_type: Template.Application.AcmeOuroboros
  class: provider
  parent: Template.Application
  version: 1.0.0
  family: Resource
  status: active
  constituents:
    - component_id: database
      resource_type: Data.Database
      provided_by: external
      failure_effect: required
      depends_on: [web]
    - component_id: app
      resource_type: Compute.Container
      provided_by: self
      failure_effect: required
      depends_on: [database]
    - component_id: web
      resource_type: Compute.Container
      provided_by: self
      failure_effect: required
      depends_on: [app]
