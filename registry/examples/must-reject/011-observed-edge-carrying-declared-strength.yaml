must_reject:
  rule: RHY-007
  gate: schema
  expect_path: $.dependencies[0]
  because: A discovered record whose observed edge carries a declared strength. A probe saw that the VM is on this
    host; it cannot see whether the VM is allowed to run without it. That is a declaration of placement, carried on the
    requested record, and of the provider, carried on the realized one. Accepting it here would let a sweep write
    declared semantics into the one record that holds only what was seen, and drift (the comparison of the two lists)
    would then compare a declaration with itself.
