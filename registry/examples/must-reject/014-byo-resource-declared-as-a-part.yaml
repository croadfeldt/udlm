must_reject:
  rule: CMP-012
  gate: check_class_constituents
  because: >-
    A constituent the consumer supplies — an existing VLAN they already have — declared as a part the
    composite owns. You cannot own a thing you were handed a reference to. Modelled this way the
    composite claims a resource other tenants may also be using, and GRP-INV-002 is non-overridable:
    the parts of one thing may not span two owners. At realization that is a refusal at best and a
    silent ownership transfer at worst.
record:
  record_type: catalog_item
  uuid: 1c3d5e7f-2a48-4b60-9d82-4f16ba90c357
  handle: acme/catalog/byo-as-part
  conforms_to: udlm/0.1
  name: ApplicationStack.ByoConfusion
  version: 1.0.0
  tenant_uuid: 75ccf4ff-3e8d-4963-bc51-459ae1014cb7
  constituents:
    - component_id: app
      resource_type: Compute.Container
      edge_type: contained_by
      provided_by: self
      failure_effect: required
    - component_id: existing_vlan
      resource_type: Network.VLAN
      edge_type: contained_by      # the defect — BYO is borrowed, never owned
      provided_by: external
      fulfillment: consumer
      failure_effect: required
