must_reject:
  rule: GRP-INV-002
  gate: check_group_invariants
  because: >-
    The VM claims the platform tenant's VLAN as a PART of itself rather than taking a stake in it.
    GRP-INV-002 is non-overridable: the parts of one thing may not span two owners. Modelled this
    way an app team quietly acquires a VLAN that four other teams are also using, and every
    ownership question — who pays, who may decommission, whose audit scope — gets the wrong answer.
    A cross-tenant relationship is binds_to or references, behind an authorization.
