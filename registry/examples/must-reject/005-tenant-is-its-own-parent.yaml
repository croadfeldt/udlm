must_reject:
  rule: GRP-INV-006
  gate: check_group_invariants
  because: >-
    A tenant nested inside itself. The rule exists separately from the general acyclicity rule
    because this is the case a typo produces — pasting a record's own uuid into its parent — and
    because a self-parent makes every nesting question unanswerable rather than merely wrong.
