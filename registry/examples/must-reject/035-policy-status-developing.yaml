must_reject:
  rule: POL-004
  gate: schema
  expect_path: $.status.state
  because: A policy with status `developing`. The lifecycle has four statuses (proposed, active, deprecated,
    retired); an unpublished policy is a draft in a working tree, not a record, so there is no status for it.
    Accepting one would let a policy exist in the registry that no environment applies and nothing reviews (#723).
record:
  __schema__: policy.schema.json
  record_type: policy
  uuid: 2c7d9e41-8a35-4f6b-9d02-7e1c3a5b8f64
  handle: research/developing-policy
  conforms_to: udlm/1.0
  name: A policy that claims a status the lifecycle does not have
  description: Deliberately wrong (must-reject). Copies the EU residency policy with status developing.
  version: 1.0.0
  tenant_uuid: 75ccf4ff-3e8d-4963-bc51-459ae1014cb7
  status: {state: developing}
  policy_type: validation
  policy_class: compliance
  concern_type: compliance
  domain: tenant
  match:
    facts: [data_classification, sovereignty_zone]
    rule:
      engine: rego
      body: |
        package udlm.residency
        deny if {
          input.data_classification == "eu_personal"
          not input.sovereignty_zone in {"eu-west", "eu-central", "eu-north"}
        }
  enforcement: hard
  lifecycle_scope:
    operations: [all]
  output:
    decision: deny
    reason: eu_personal data may only be realized in an EU sovereignty zone
  audit_on: [DENY]
  notification_on: [DENY]
