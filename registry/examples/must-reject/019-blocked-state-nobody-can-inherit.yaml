must_reject:
  rule: FUL-001
  gate: check_fulfillment_conditions
  because: >-
    A near-miss spelling of a governed fulfillment condition. The family is closed because its
    members carry PROPAGATION semantics — a dependent inherits its dependency's status, and
    transient waits where permanent refuses — so an unrecognised member is not a new condition, it
    is a state nothing downstream knows how to inherit. The condition vocabulary at large stays
    open: health, recovery and provider conditions are unaffected, and only something claiming to
    be a fulfillment condition is held to the closed set.
