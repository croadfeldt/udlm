must_reject:
  rule: FUL-002
  gate: check_fulfillment_conditions
  because: >-
    A member that says it is blocked and does not say by what. This is the case the whole family
    exists to prevent: an operator reading it learns that something is wrong and nothing about what
    to do, and the root-naming obligation is unsatisfiable because there is no first hop to walk.
    "Blocked" alone is indistinguishable from "we have not looked".
