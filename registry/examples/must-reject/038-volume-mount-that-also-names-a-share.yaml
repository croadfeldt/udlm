must_reject:
  rule: payload.fields
  gate: conformance
  because: The mount names both a local Volume (`volume_ref`) and a FileShare export (`source_ref`, `share`). A
    mounts entry is one or the other, so a provider cannot tell whether the path stays on the machine or comes from
    the share. Machine 2.7.0 requires exactly one kind per entry.
