# THE RESOURCE CHAIN (ADR-059 Decision 2) — this version's link in the record's own timeline.
#
# WHY ON THE RECORD, not only in the ledger: records are unbounded in lifetime and stores are not.
# This VM may run for a decade while audit is retained for years; an operation that reached into the
# ledger to ask "has this been altered" would work until the day it silently did not. `integrity`
# answers it without any other system.
#
# `head` is SHA-256 over the RFC 8785 canonical form of this record MINUS `integrity` itself, with
# `previous` folded in — the same strip-and-canonicalize machinery the identity digest uses, so the
# two can never disagree about what the bytes of a record are. Self-exclusion is a necessity: a
# digest covering itself would be uncomputable.
#
# `previous: null` means CHAIN ROOT, and it is not the same as omitting the field — an omitted
# `previous` on a later version is a broken link. Folding it in is what makes this a chain rather
# than a checksum: without it, dropping a version would leave every remaining head still valid.
# A PROVIDER PIN — preference, not eligibility (ADR-050).
#
# It decides WHICH eligible provider, never WHETHER an ineligible one is reached. The
# effective_capabilities ceiling applies at the dispatch boundary on every path (PRV-009/PRV-011),
# so pinning a provider that has not been admitted for what this request needs is refused with
# `placement.capability_mismatch` BEFORE dispatch, carrying the required-versus-declared comparison.
#
# The pin is absolute over the CHOICE and not over CAPABILITY. That is what keeps one sentence true
# everywhere instead of true-with-an-exception — and an exception is precisely what a reader cannot
# see from the rule.
#
# There is deliberately no bypass field. Whether an operator may dispatch outside a declared
# capability is an operational choice a conformant implementation may make differently (ADR-008), so
# it belongs to policy; a field here would move it into the substrate and make every implementation
# inherit one estate's risk appetite.
provider_preference:
  provider: estate/providers/osac-primary
  # SOFT: a preference. If this provider is ineligible, at capacity or absent, placement chooses
  # another eligible one and the request stays portable. `hard` would mean refuse rather than
  # substitute — the form operators genuinely need, and the one that costs something, which is why
  # it must also carry `acknowledged`.
  #
  # Neither value bypasses the ceiling: effective_capabilities applies at the dispatch boundary on
  # every path. `hard` changes whether placement SUBSTITUTES, never what is REACHABLE.
  strength: soft
  reason: Co-located with the payments storage estate; avoids a cross-fabric hop.
  set_by: platform-admin/alice

integrity:
  head: sha256:ce42653a322968c6cf26dbe26de34fcc07d9bb85aedd8cca1c4ddbfa9f4f2a50
  previous: null
  algorithm: sha256-jcs
