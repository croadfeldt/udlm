configures: data-residency-gate@3.0.0
parameters:
  classification_levels: [eu_personal]
  allowed_zones: [eu-west, eu-central, eu-north]
domain: tenant
enforcement: hard
lifecycle_scope:
  operations: [all]
audit_on: [DENY]
notification_on: [DENY]
notification_urgency: high
compliance_basis: "GDPR Art. 44 (transfers)"
review_required_before: "2027-01-01T00:00:00Z"
metadata:
