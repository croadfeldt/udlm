# Stability of every part of the spec — UDLM-1.0-LOCKDOWN.md §1 ruling 4, VERSIONING.md "Stability marker".
# One row per class, record schema and spec document. Gate: tests/check_stability.py (STB-001..003).
#   stable        carries the 1.0 promise: nothing removed, renamed or narrowed inside 1.x. Earned, never
#                 declared: a part is stable once a running implementation has used it and the conformance
#                 suite has judged its records (row 144). Nothing is stable yet.
#   experimental  may change in a minor without deprecation; not part of the 1.0 claim
#   reference     a document that states no rule, so there is nothing to promise
# `why` is one short reason, for the reader; it is not checked.
