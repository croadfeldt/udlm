# Policy-fact taxonomy — the governed vocabulary of facts a policy engine may reference.
#
# UDLM does NOT specify a policy language or engine (policy-contract §7.2a: an external engine "is,
# in effect, a *Provider of policy decisions*, bound by the contract, not by shared storage"). What
# UDLM owes an engine is the ability to REFERENCE THE CORRECT INFORMATION — so the fact vocabulary,
# not the predicate grammar, is the deliverable.
#
# That vocabulary previously existed only as prose inside the description of
# `policy.schema.json` match.conditions[].field — a paragraph, enforced by nothing, which is why it
# drifted into five disagreeing spellings across the spec. Here it is a curated vocabulary: closed
# where it can be, validated, and citable by uuid.
#
# Each entry is a TaxonomyTerm (registry/classes/knowledge/taxonomy-term), curation-governed
# (registry-governance §2). This is the `policy-fact` ROOT subtree — DISJOINT from access-role,
# dcm-function, and provider-capability. One shared TaxonomyTerm TYPE, distinct subtrees.
#
# The four source subtrees mirror policy-contract §2.1: every fact belongs to exactly one, and the
# subtree says WHERE the value comes from during evaluation — which is what an engine needs to know
# to bind it, and what impact analysis needs to know when the source changes.
#
# Scope note: this vocabulary is what a policy may READ. What a policy may WRITE is the decision /
# constraint shape, which policy.schema.json already specifies per `policy_type` (its allOf block:
# validation -> decision, placement -> constraints, override -> scope + expires_at). The two halves
# together are UDLM's side of the engine contract.

conforms_to: udlm/0.1
term_type: TaxonomyTerm
root: policy-fact

terms:
  # ---- root ----
  - term: policy-fact
    root: policy-fact
    parent: null
    curation_state: canonical
    definition: >-
      Root of the vocabulary of facts a policy engine may reference during evaluation. A policy
      declares the facts it consumes from this subtree; it never declares how it compares them —
      the predicate language belongs to the engine.

  # ---- the four sources (policy-contract §2.1) ----
  - term: request-payload
    root: policy-fact
    parent: policy-fact
    category: request payload
    curation_state: canonical
    definition: >-
      The consumer's declared fields plus the assembled layers and their provenance. OPEN subtree —
      any spec dot-path of the requested resource type is addressable here, so the named terms below
      are the cross-type facts, not the whole surface.

  - term: operation-context
    root: policy-fact
    parent: policy-fact
    category: operation context
    curation_state: canonical
    definition: >-
      What lifecycle operation is being performed and what changed. CLOSED subtree — the operation
      surface is defined by this spec, not by a resource type.

  - term: evaluation-context
    root: policy-fact
    parent: policy-fact
    category: evaluation context
    curation_state: canonical
    definition: >-
      Constraints emitted by policies earlier in the same evaluation pass, plus the derived
      diagnostics computed for that pass. Re-entrant: a fact here may be the output of another
      policy, which is what makes evaluation convergent rather than single-shot (ADR-006).

  - term: entity-metadata
    root: policy-fact
    parent: policy-fact
    category: entity metadata
    curation_state: canonical
    definition: >-
      Tenant, actor, classification, and lifecycle state carried on the record rather than requested
      by the consumer. CLOSED subtree.

  # ---- request payload ----
  - term: resource_type
    root: policy-fact
    parent: request-payload
    curation_state: canonical
    definition: The fully-qualified Class name being requested (e.g. Compute.VM). The primary specificity axis.

  - term: sovereignty_zone
    root: policy-fact
    parent: request-payload
    curation_state: canonical
    definition: >-
      The declared placement zone. Note the open finding: an entity's zone is an operator-coined
      label while accreditation scopes are ISO 3166, and nothing binds the two (matrix §3.8).

  - term: application_uuid
    root: policy-fact
    parent: request-payload
    curation_state: canonical
    definition: The application this request belongs to — the grouping axis for application-scoped policy.

  # ---- operation context ----
  - term: operation.type
    root: policy-fact
    parent: operation-context
    curation_state: canonical
    definition: >-
      The lifecycle operation being performed (initial_provisioning, update, rehydration,
      provider_migration, decommission, compliance_rescan …). The axis that lets a policy fire on
      change rather than on every evaluation.

  - term: operation.changed_fields
    root: policy-fact
    parent: operation-context
    curation_state: canonical
    definition: The set of fields this operation modifies — how a policy scopes itself to placement-affecting change.

  - term: operation.pipeline_stage
    root: policy-fact
    parent: operation-context
    curation_state: canonical
    definition: Which stage of the pipeline is evaluating, so a policy can bind to a specific barrier.

  # ---- evaluation context: emitted constraints ----
  - term: allowed_zones
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: Zone set narrowed by an earlier policy in this pass — the placement-constraint accumulator.

  - term: distribution_requirement
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: Spread/anti-affinity requirement emitted by an earlier policy in this pass.

  - term: cost_ceiling
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: Cost bound emitted by an earlier policy in this pass.

  - term: excluded_providers
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: Providers ruled out by an earlier policy in this pass.

  # ---- evaluation context: graph diagnostics (docs/guides/graph-integrity.md) ----
  - term: graph.has_cycle
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: >-
      Whether the effective dependency graph contains a cycle. Computed over the effective graph,
      never a stored field — which is why it is a fact of the pass, not of the record.

  - term: graph.cycle_severity
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: Severity of the detected cycle — the axis a blocking-vs-advisory policy keys on.

  - term: graph.cycle_members
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: The entities participating in the cycle.

  - term: graph.cycle_mechanisms
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: The relationship mechanisms through which the cycle closes.

  - term: graph.fault_domain
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: The fault domain a placement would land in — the redundancy axis (ADR-010).

  - term: graph.blast_radius
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: What a failure of this entity would reach — the impact axis (ADR-010).

  - term: composition.unreadable_constituents
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: >-
      The component_ids of a composition the requesting actor would not be able to READ once
      realized — computed for this actor, over this composition's expanded placement. Empty means
      every part is readable. This is the fact that makes "you ordered a thing and cannot see part
      of it" a decidable question BEFORE the order rather than a discovery afterwards (CMP-013).
      `composition_visibility` does not answer it: that declares ADDRESSABILITY — whether a part has
      its own identity you could refer to — and a part can be perfectly addressable and still
      unreadable to you, because access is decided by the grouping it lands in. A fact of the pass
      and never a stored field: the answer changes with the actor and with the placement, so storing
      it would record one actor's answer as everyone's. Deliberately NOT paired with a
      `has_unreadable_constituent` boolean, though graph.has_cycle / graph.cycle_members set that
      precedent — "is this list empty" is a predicate, and ADR-065 leaves predicates with the engine.

  - term: graph.unmet_dependency
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: A declared dependency with no satisfying entity, carrying its own severity.

  # ---- evaluation context: reserve-phase facts (ADR-011) ----
  - term: reserved
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: >-
      Reserve-phase holds as they land, exposed during the reconciliation loop so a participating
      policy evaluates against them BEFORE commit. OPEN subtree — `reserved.<component>.<fact>` is
      addressable per component (e.g. reserved.segment_ref).

  # ---- evaluation context: quota (the commit barrier) ----
  - term: quota.dimension
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: Which quota dimension is being consumed.

  - term: quota.used
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: Consumption against the dimension at evaluation time.

  - term: quota.limit
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: The declared bound for the dimension.

  - term: quota.exceeded
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: >-
      Whether consumption exceeds the limit — precomputed rather than left to the engine to derive.
      A comparison the model performs itself is a fact an auditor can read and verify; a comparison
      left to policy text is one they must re-derive.

  # ---- entity metadata ----
  - term: tenant_uuid
    root: policy-fact
    parent: entity-metadata
    curation_state: canonical
    definition: The owning tenant — the isolation axis every tenant-domain policy binds to.

  - term: data_classification
    root: policy-fact
    parent: entity-metadata
    curation_state: canonical
    definition: The sensitivity classification carried on the data, governing where it may be realized.

  - term: data_role
    root: policy-fact
    parent: entity-metadata
    curation_state: canonical
    definition: >-
      The role the data plays at a boundary (ADR-PROV-001) — parallel to data_classification, and
      what lets a Governance-Matrix policy control which roles a provider may receive at the
      the control plane→Provider boundary.

  - term: actor.roles
    root: policy-fact
    parent: entity-metadata
    curation_state: canonical
    definition: >-
      The requesting actor's granted roles. UDLM carries the fact; the access DETERMINATION stays
      external (ADR-008) — a policy may read a role, never adjudicate one.

  - term: lifecycle_state
    root: policy-fact
    parent: entity-metadata
    curation_state: canonical
    definition: Where the entity sits in its lifecycle — the axis a state-gated policy binds to.

  - term: cost_center
    root: policy-fact
    parent: entity-metadata
    curation_state: canonical
    definition: The chargeback attribution carried on the record.

  # ── REFERENCE GRAPH — the fifth match source (ADR-041 Decision 2) ────────────────────────────
  # STRUCTURAL matching: what the graph SAYS, without dereferencing what it points at.
  #
  # WHY THIS IS THE CHEAPER SURFACE, and why a firewall wants it. Matching on a VALUE means
  # resolving the pointer first — and resolving is the act a sovereignty boundary exists to
  # control. Structural matching pulls no data: it decides on the address. So it works when
  # resolution is gated, unavailable, or is itself the thing being refused, which is precisely the
  # situation the guard is for.
  #
  # It also matches STABLE IDENTITY rather than transient value. "Gate any edge to a decommissioning
  # DC" stays true while the DC's fields churn.
  #
  # AND IT UNIFIES WITH BLAST RADIUS: "everything that points to X" IS the impact_report graph
  # query (ADR-010). Decommission-impact and structural policy read one graph, not two that must
  # agree.
  #
  # CLOSED, like every other subtree here. A general graph query language would make "can this
  # policy be checked before it runs" unanswerable; these four predicates cover every example
  # ADR-041 gives, and the curation ladder is how a fifth arrives.
  - term: reference-graph
    root: policy-fact
    parent: policy-fact
    category: reference graph
    curation_state: canonical
    definition: >-
      The declared edges of the record under evaluation — matched STRUCTURALLY, without
      dereferencing the target. The fifth match source (ADR-041); CLOSED subtree.

  - term: edge_relation
    root: policy-fact
    parent: reference-graph
    curation_state: canonical
    definition: >-
      The declared relation name on the edge (`located_in`, `mounts`). What the edge MEANS,
      answerable from the record alone — a type declares its relations (REL-001), so this is part
      of the contract rather than whatever a consumer can spell.

  - term: edge_type
    root: policy-fact
    parent: reference-graph
    curation_state: canonical
    definition: >-
      Which of the four edge types the edge is (`common-elements` `$defs/edge_type`). Carries the
      lifecycle coupling: a policy that cares whether a crossing binds lifecycle or merely points
      reads this rather than inferring it from the relation name.

  - term: edge_target_authority
    root: policy-fact
    parent: reference-graph
    curation_state: canonical
    definition: >-
      The authority the edge's target belongs to — the URF `//` axis, present when the target is a
      peer's and elided when local. The datum a sovereignty refusal decides on (GMX-011), readable
      from the reference itself, which is what lets the decision be taken BEFORE the crossing
      rather than after reading what it points at.

  - term: edge_target_lifecycle_state
    root: policy-fact
    parent: reference-graph
    curation_state: canonical
    definition: >-
      The lifecycle state of the target, resolved from the local index without dereferencing the
      target's data. Enough to gate an edge into something decommissioning; not enough to read
      anything the target holds.

  # ── THE LAYER ENVELOPE — computed during assembly, read by a validation policy ───────────────
  # LAY-009 rules that a layer's `limits` are DATA and a policy enforces them, because a layer holds
  # an estate's configuration and what is permitted there is the estate's call. That needs a fact:
  # assembly computes which envelopes apply and where a value fell, and the policy decides what to
  # do about it. Without these terms, "a validation policy enforces it" is not expressible — the
  # policy has no way to read what assembly found.
  #
  # These are facts OF THE PASS, not fields on any record — the applicable envelope depends on which
  # layers this request drew from, so it cannot be answered anywhere but during this assembly. Same
  # shape as `graph.has_cycle` and `composition.unreadable_constituents`, and it lands in
  # evaluation-context for the same reason: an envelope IS a constraint emitted earlier in the pass.
  - term: limits.violations
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: >-
      The values that fell outside an applicable ancestor envelope. Empty is the passing case. Each
      entry carries what LAY-010 requires a denial to name — the binding layer, its owner, the field,
      the submitted value and the clause with its reason — so the policy that refuses can produce an
      actionable refusal rather than a boolean.

  - term: limits.binding_layers
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: >-
      Every layer whose envelope bound a field on this request, whether or not it was violated.
      Distinct from the violations above: a policy may want to refuse on WHO bound a value as well
      as on whether it fit — an org-compliance layer binding a field is a different situation from a
      team layer binding it, and the two are indistinguishable from the violation list alone.

  - term: limits.skipped_layers
    root: policy-fact
    parent: evaluation-context
    curation_state: canonical
    definition: >-
      Layers this request declined via `skip` whose envelopes would otherwise have applied. The
      audited escape route is visible here: a bound has no override, so declining the layer is the
      only way past it, and a policy that cares about compliance layers being skipped needs to see
      that it happened.
