  # 2026-08-11 — the app-profile indirection collapses. This layer's entire content was a pointer
  # at the app_profile reference-data record: `fields: {app_profile: <data_reference>}`. Now that an
  # app profile is itself a layer carrying `covers`, the profile says who it applies to and the
