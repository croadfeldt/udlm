metadata:
  display_name: Identity Group
  description: 'A group of identities — persons and service accounts — as identity data, the subject side of the
    RBAC bridge. A Base by the Base test (CLS-002): SCIM (RFC 7643) Group abstracts over every directory''s and
    IdP''s group, so a group with a handle, a source and members is one deliverable any of them serves. Distinct
    from Grouping, which groups resources by a stored criterion; this groups subjects.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
elements:
  - element: handle
    scope: IdentityGroup
    optional: false
    state: canonical
    description: Group name.
    schema:
      type: string
      description: Group name.
  - element: display_name
    scope: IdentityGroup
    optional: true
    state: canonical
    description: Human-readable name.
    schema:
      type: string
      description: Human-readable name.
  - element: source
    scope: IdentityGroup
    optional: false
    state: canonical
    description: '`built_in` (a native group of local identities) or `external` (mirrors a directory or IdP group,
      referenced not custodied).'
    schema:
      enum:
        - built_in
        - external
      description: '`built_in` (a native group of local identities) or `external` (mirrors a directory or IdP group,
        referenced not custodied).'
  - element: external_group_ref
    scope: IdentityGroup
    optional: true
    state: canonical
    description: Reference to the directory's group object, for an external source.
    schema:
      description: Reference to the directory's group object, for an external source.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
  - element: members
    scope: IdentityGroup
    optional: true
    state: canonical
    description: For a built-in group, the member identities by uuid; for an external one, resolved from the directory.
    schema:
      type: array
      items:
        type: string
      description: For a built-in group, the member identities by uuid; for an external one, resolved from the directory.
