    display_name: Platform Administrators
    source: external
    external_group_ref: corp-directory-platform-admins
    members:
      - 679b14ef-f169-441e-968d-dacafffe1966
outputs:
  group_ref:
    type: string
    description: Referenced by a grouping (access_grouping) membership source and by auth-providers role_mapping.
relationships:
  - edge_type: references
    target: Identity.Person
    cardinality: 0..n
    description: Members (for built_in groups).
  - edge_type: references
    target: Identity.ServiceAccount
    cardinality: 0..n
    description: Members (for built_in groups).
  - edge_type: references
    target: DirectoryService
    cardinality: 0..1
    description: The directory this group is sourced from (for source=external).
context:
  purpose: Models a group of identities — native or mirrored from a directory — that role bindings and memberships
    resolve through.
  plain_description: 'A named set of person and service-account identities, keyed by its required `handle`. Two
    sources — the required `source` property: a `built_in` group owns its `members` list locally; an `external`
    group mirrors a directory/IdP group and is referenced, never copied — membership stays authoritative in the
    directory. Access-control machinery binds roles to groups rather than to individuals, so joining or leaving
    a group is the whole access change.'
  use_when:
    - You need role assignments to bind to a set of identities instead of to individuals.
    - You need a directory (LDAP/IdP) group represented in the model without duplicating its membership.
  not_for:
    - The directory server that hosts an external group — DirectoryService.
    - The secret an account authenticates with — CredentialRef; groups hold identities, never credentials.
  works_with:
    - Identity.Person / Identity.ServiceAccount — the members, for built_in groups.
    - DirectoryService — the source of an external group's membership.
entity_type: Identity
adopts:
  - standard: SCIM
    version: RFC 7643
    standard_name: Group
    role: group-of-subjects vocabulary (displayName, members)
    source: https://www.rfc-editor.org/rfc/rfc7643
    license: IETF Trust (BCP 78)
    license_compatibility: compatible-reference
    disposition: tier1_value
