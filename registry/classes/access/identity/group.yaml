metadata:
  display_name: Identity Group
  description: 'An identity-side group of persons/service-accounts — identity DATA (the RBAC bridge — `Access.Grouping` subject_bindings plus the function-capability matrix). Distinct
    from a grouping: a grouping with record kind `access_grouping` is the DCM-native RBAC subject-set
    that role-assignments bind to (and that the authority-enforcement voting model references); an Identity.Group
    models a group as it exists in a directory / IdP (e.g. an external group mapped to roles via auth-providers
    role_mapping) or a native logical grouping of accounts. A grouping (access_grouping) MAY reference
    an Identity.Group as its membership source. The two are kept distinct so external directory groups
    stay referenced (PIP), not custodied.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
  converted_from: flat spec Identity.Group@0.2.2 (bulk mechanical conversion 2026-08-04; factoring later
    via scope promotion)
