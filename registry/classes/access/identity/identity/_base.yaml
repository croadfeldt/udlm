metadata:
  authority: canonical
  display_name: Identity Base Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-08-04T00:00:00Z'
  description: 'An identity the control plane authenticates and authorizes — a person or a service account. A Base
    by the Base test (CLS-002): SCIM (RFC 7643) User abstracts over both forms, and every identity provider — a
    directory, an IdP, a cloud IAM — fills an order for a subject with a handle, an actor type, an authentication
    source and a credential reference the same way; Person and ServiceAccount are its two forms (CLS-004). It was
    a folder until ADR-082 (row 089): a group of identities shares none of this and is the IdentityGroup Base.'
elements:
  - element: handle
    scope: Identity
    optional: false
    state: canonical
    description: Login handle / username, unique within the implementation.
    schema:
      type: string
      description: Login handle / username, unique within the implementation.
  - element: display_name
    scope: Identity
    optional: true
    state: canonical
    description: Converted verbatim from the flat Identity.Person spec.
    schema:
      type: string
  - element: actor_type
    scope: Identity
    optional: false
    state: canonical
    description: From the closed actor-type vocabulary (universal-audit); a Person is always `human`.
    schema:
      type: string
      enum:
        - human
        - service_account
      description: What kind of actor this identity is; each form narrows it to one value.
  - element: authenticated_by
    scope: Identity
    optional: true
    state: canonical
    description: 'handle/uuid of the Auth Provider (auth capability) or DirectoryService that authenticates this
      person. Default: the built-in provider (no external IdP required).'
    schema:
      type: string
      description: 'handle/uuid of the Auth Provider (auth capability) or DirectoryService that authenticates this
        person. Default: the built-in provider (no external IdP required).'
  - element: credential_ref
    scope: Identity
    optional: true
    state: canonical
    description: Reference to CredentialRef — the credential record for this person. Common-elements Reference shape
      (handle string or {uuid, handle} object); resolvable and policy-walkable, never an opaque string.
    schema:
      description: Reference to CredentialRef — the credential record for this person. Common-elements Reference
        shape (handle string or {uuid, handle} object); resolvable and policy-walkable, never an opaque string.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
  - element: status
    scope: Identity
    optional: true
    state: canonical
    description: Converted verbatim from the flat Identity.Person spec.
    schema:
      enum:
        - active
        - suspended
        - disabled
entity_type: Identity
adopts:
  - standard: SCIM
    version: RFC 7643
    standard_name: User
    role: identity/subject vocabulary (userName, displayName, active, userType; a person and a service account are
      both Users)
    source: https://www.rfc-editor.org/rfc/rfc7643
    license: IETF Trust (BCP 78)
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Declares a subject the control plane authenticates and authorizes — a person or a service account — with
    the handle, actor type, authentication source and credential reference every identity provider serves.
  plain_description: 'Who can act. An identity has a `handle`, an `actor_type` (`human` or `service_account`, which
    its two forms narrow to one), where it is `authenticated_by`, an optional `credential_ref` to the secret that
    proves it, and a `status`. It is the subject side of the RBAC bridge: a Grouping''s subject bindings name identities,
    and the function-capability matrix says what those identities may do. Modelled on SCIM''s User so a directory,
    an IdP and a cloud IAM all fill it the same way.'
  use_when:
    - You need a person or a service account as a first-class subject that groupings can bind and audit records
      can name.
    - You need identities portable across directories and identity providers by the SCIM vocabulary.
  not_for:
    - A set of identities — IdentityGroup.
    - The secret itself — CredentialRef holds the reference; custody stays with the store.
    - What an identity may do — Grouping subject bindings and the function-capability matrix.
  works_with:
    - IdentityGroup — groups this identity belongs to.
    - Grouping — bindings that grant this identity access to resources.
    - CredentialRef — the credential that authenticates it.
    - DirectoryService — the directory that authenticates it.
spec_examples:
  - handle: platform/identities/ci-runner
    display_name: CI runner
    actor_type: service_account
    authenticated_by: platform/directory/example
    credential_ref: platform/credentials/ci-runner-token
    status: active
