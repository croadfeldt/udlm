$id: https://udlm.dev/registry/udlm/0.1/class/Identity/1.3.0
conforms_to: udlm/0.1
uuid: db886a00-0e24-4ff7-992a-c6d546a34eb6
record_type: class
class: base
resource_type: Identity
version: 1.3.0
family: Access
status: active
filed_under:
  - identity
metadata:
  authority: canonical
  display_name: Identity Base Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-08-04T00:00:00Z'
  description: 'An identity the control plane authenticates and authorizes: a person or a service account. A Base
    by the Base test (CLS-002): SCIM (RFC 7643) User abstracts over both, so a subject with a handle, an actor type,
    an authentication source and a credential reference is one deliverable every identity provider (a directory,
    an IdP, a cloud IAM) fills the same way. Person and ServiceAccount are its two forms (CLS-004); a group of identities
    is IdentityGroup.'
elements:
  - element: login
    scope: Identity
    optional: false
    state: canonical
    description: 'The login name the identity authenticates with, unique within the implementation; it may differ from
      the record''s handle (row 115).'
    schema:
      type: string
      pattern: ^\S{1,255}$
      description: The login name the identity authenticates with, unique within the implementation.
  - element: authenticated_by
    scope: Identity
    optional: true
    state: canonical
    description: The auth provider or DirectoryService that authenticates this identity; default is the built-in
      provider.
    schema:
      type: string
      description: The auth provider or DirectoryService that authenticates this identity; default is the built-in
        provider.
  - element: credential_ref
    scope: Identity
    optional: true
    state: canonical
    description: Reference to the CredentialRef that proves this identity; custody stays with the store.
    schema:
      description: Reference to the CredentialRef that proves this identity; custody stays with the store.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
  - element: status
    scope: Identity
    optional: true
    state: canonical
    description: '`active`, `suspended` or `disabled`.'
    schema:
      enum:
        - active
        - suspended
        - disabled
      description: '`active`, `suspended` or `disabled`.'
entity_type: Identity
adopts:
  - standard: SCIM
    version: RFC 7643
    standard_name: User
    role: identity/subject vocabulary (userName, displayName, active, userType; a person and a service account are
      both Users)
    source: https://www.rfc-editor.org/rfc/rfc7643
    license: IETF Trust (BCP 78)
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Declares a subject the control plane authenticates and authorizes — a person or a service account — with
    the login, authentication source and credential reference every identity provider serves.
  plain_description: 'Who can act. An identity has a `login`, where it is `authenticated_by`, an optional `credential_ref` to the secret that
    proves it, and a `status`. It is the subject side of the RBAC bridge: a Grouping''s subject bindings name identities,
    and the function-capability matrix says what those identities may do. Modelled on SCIM''s User so a directory,
    an IdP and a cloud IAM all fill it the same way.'
  use_when:
    - You need a person or a service account as a first-class subject that groupings can bind and audit records
      can name.
    - You need identities portable across directories and identity providers by the SCIM vocabulary.
  not_for:
    - A set of identities — IdentityGroup.
    - The secret itself — CredentialRef holds the reference; custody stays with the store.
    - What an identity may do — Grouping subject bindings and the function-capability matrix.
  works_with:
    - IdentityGroup — groups this identity belongs to.
    - Grouping — bindings that grant this identity access to resources.
    - CredentialRef — the credential that authenticates it.
    - DirectoryService — the directory that authenticates it.
spec_examples:
  - login: ci-runner
    authenticated_by: platform/directory/example
    credential_ref: platform/credentials/ci-runner-token
    status: active
