metadata:
  display_name: Service Account
  description: 'A non-human identity, one of the two forms of Identity: automation, an agent, a provider integration,
    an API-key holder. Holds no secret material; credentials are referenced. Accountable to an owning identity.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
elements:
  - element: actor_type
    scope: Identity.ServiceAccount
    optional: false
    state: canonical
    description: Always `service_account`.
    schema:
      type: string
      enum:
        - service_account
      description: Always `service_account`.
  - element: owner_ref
    scope: Identity.ServiceAccount
    optional: true
    state: canonical
    description: Reference to the Identity.Person or IdentityGroup accountable for this account.
    schema:
      description: Reference to the Identity.Person or IdentityGroup accountable for this account.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
spec_examples:
  - handle: backup-agent
    display_name: Backup Agent
    actor_type: service_account
    owner_ref: platform-admins
    authenticated_by: corp-directory
    credential_ref: backup-agent-token
    status: active
outputs:
  actor_uuid:
    type: string
    description: The stable actor id referenced by role-assignments and grouping (access_grouping) membership.
relationships:
  - edge_type: contained_by
    target: IdentityGroup
    cardinality: 0..n
    description: Member of an access grouping / IdentityGroup; membership drives role binding.
  - edge_type: references
    target: CredentialRef
    cardinality: 0..n
    description: Credentials — referenced, never inline.
context:
  purpose: Models a non-human account — automation, an agent, a provider integration — as an authenticated, auditable
    actor.
  plain_description: 'An account for something that is not a person: a pipeline, an agent, an integration holding
    an API key. Like a person it has a required `handle` and `actor_type` (always `service_account`), an authenticator,
    and referenced-only credentials; unlike a person it declares an `owner_ref` — the person or group accountable
    for it. Its stable actor id is what role assignments and audit records bind to.'
  use_when:
    - You need automation to authenticate with its own identity instead of borrowing a person's.
    - You need every non-human credential holder to have a named accountable owner.
  not_for:
    - A human account — Identity.Person.
    - The API key or token itself — CredentialRef, referenced not stored.
  works_with:
    - Identity.Person — the accountable owner.
    - CredentialRef — the account's key/token, by reference.
    - IdentityGroup — memberships that grant it roles.
entity_type: Identity
