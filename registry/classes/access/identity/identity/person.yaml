metadata:
  display_name: Person
  description: A human identity, one of the two forms of Identity. Holds no secret material; credentials are referenced.
    When federated, it references the external IdP subject.
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
elements:
  - element: email
    scope: Identity.Person
    optional: true
    state: canonical
    description: Contact address.
    schema:
      type: string
      description: Contact address.
  - element: actor_type
    scope: Identity.Person
    optional: false
    state: canonical
    description: Always `human`.
    schema:
      type: string
      enum:
        - human
      description: Always `human`.
  - element: external_subject
    scope: Identity.Person
    optional: true
    state: canonical
    description: The external IdP subject id when federated; a reference, resolved not stored.
    schema:
      type: string
      description: The external IdP subject id when federated; a reference, resolved not stored.
spec_examples:
  - handle: adoe
    display_name: Alex Doe
    email: adoe@cexample.com
    actor_type: human
    authenticated_by: corp-directory
    external_subject: uid=adoe,ou=people,dc=cexample,dc=com
    status: active
outputs:
  actor_uuid:
    type: string
    description: The stable actor id referenced by role-assignments and by grouping (access_grouping) membership.
relationships:
  - edge_type: contained_by
    target: IdentityGroup
    cardinality: 0..n
    description: Member of an access grouping (access_grouping) or IdentityGroup; membership drives role binding
      (the RBAC bridge — `Grouping` subject_bindings plus the function-capability matrix).
  - edge_type: references
    target: CredentialRef
    cardinality: 0..n
    description: Credentials — referenced, never inline.
context:
  purpose: Models a human account — the actor that gets authenticated, authorized, and audited.
  plain_description: 'One human''s identity: its `handle` (the login name) and its `actor_type` — always `human`,
    and required alongside the handle — plus display name, email, status, and how they authenticate (the built-in
    provider by default, or a directory/IdP when federated). It carries no secret material — a password or key is
    referenced through a CredentialRef, never stored. Every audited action and role assignment points back at this
    record''s stable actor id.'
  use_when:
    - You need human accounts as records that role assignments and audit trails reference.
    - You need a federated user tied to their external IdP subject without copying the IdP's data.
  not_for:
    - Automation, agents, or API-key holders — Identity.ServiceAccount.
    - The credential itself — CredentialRef; a person references credentials, never contains them.
    - The directory server — DirectoryService is the server; this is one identity in it.
  works_with:
    - IdentityGroup — memberships that drive role binding.
    - CredentialRef — the person's credentials, by reference.
    - DirectoryService — the external authenticator when federated.
entity_type: Identity
