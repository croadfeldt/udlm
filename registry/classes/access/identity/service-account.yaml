context:
  purpose: Models a non-human account — automation, an agent, a provider integration — as an authenticated,
    auditable actor.
  plain_description: 'An account for something that is not a person: a pipeline, an agent, an integration
    holding an API key. Like a person it has a required `handle` and `actor_type` (always `service_account`),
    an authenticator, and referenced-only credentials; unlike a person it declares an `owner_ref` — the
    person or group accountable for it. Its stable actor id is what role assignments and audit records
    bind to.'
  use_when:
  - You need automation to authenticate with its own identity instead of borrowing a person's.
  - You need every non-human credential holder to have a named accountable owner.
  not_for:
  - A human account — Identity.Person.
  - The API key or token itself — Security.CredentialRef, referenced not stored.
  works_with:
  - Identity.Person — the accountable owner.
  - Security.CredentialRef — the account's key/token, by reference.
  - Identity.Group — memberships that grant it roles.
entity_type: Identity
