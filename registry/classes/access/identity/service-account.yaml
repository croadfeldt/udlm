metadata:
  display_name: Service Account
  description: A non-human identity/account — an ACTOR (automation, an agent, a provider integration,
    an API-key holder) that DCM authenticates and authorizes (ADR-RBAC-001). actor_type `service_account`.
    Holds no secret material — credentials referenced (Security.CredentialRef). Backs the built-in provider's
    static_api_key/service accounts.
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
