metadata:
  display_name: Person
  description: A human identity/account — an ACTOR that DCM authenticates and authorizes (the RBAC bridge
    — `Grouping` subject_bindings plus the function-capability matrix). Fills the named-but-unbuilt
    Identity.* slot (naming-conventions §2; resource-type-hierarchy §Identity). Holds NO secret material
    — credentials are referenced (Security.CredentialRef). Backs the built-in auth provider's local users
    and, when federated, references the external IdP subject (PIP). Its actor_type is `human`, from the
    one closed actor-type vocabulary (universal-audit).
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
elements:
- element: handle
  scope: Identity.Person
  optional: false
  state: canonical
  description: Login handle / username, unique within the implementation.
  schema:
    type: string
    description: Login handle / username, unique within the implementation.
- element: display_name
  scope: Identity.Person
  optional: true
  state: canonical
  description: Converted verbatim from the flat Identity.Person spec.
  schema:
    type: string
- element: email
  scope: Identity.Person
  optional: true
  state: canonical
  description: Converted verbatim from the flat Identity.Person spec.
  schema:
    type: string
- element: actor_type
  scope: Identity.Person
  optional: false
  state: canonical
  description: From the closed actor-type vocabulary (universal-audit); a Person is always `human`.
  schema:
    const: human
    description: From the closed actor-type vocabulary (universal-audit); a Person is always `human`.
- element: authenticated_by
  scope: Identity.Person
  optional: true
  state: canonical
  description: 'handle/uuid of the Auth Provider (auth capability) or Security.DirectoryService that authenticates
    this person. Default: the built-in provider (no external IdP required).'
  schema:
    type: string
    description: 'handle/uuid of the Auth Provider (auth capability) or Security.DirectoryService that
      authenticates this person. Default: the built-in provider (no external IdP required).'
- element: credential_ref
  scope: Identity.Person
  optional: true
  state: canonical
  description: Reference to Security.CredentialRef — the credential record for this person. Common-elements
    Reference shape (handle string or {uuid, handle} object); resolvable and policy-walkable, never an
    opaque string.
  schema:
    description: Reference to Security.CredentialRef — the credential record for this person. Common-elements
      Reference shape (handle string or {uuid, handle} object); resolvable and policy-walkable, never
      an opaque string.
    $ref: ../../../common-elements.schema.json#/$defs/Reference
- element: external_subject
  scope: Identity.Person
  optional: true
  state: canonical
  description: The external IdP subject id when federated (a PIP reference, resolved not stored).
  schema:
    type: string
    description: The external IdP subject id when federated (a PIP reference, resolved not stored).
- element: status
  scope: Identity.Person
  optional: true
  state: canonical
  description: Converted verbatim from the flat Identity.Person spec.
  schema:
    enum:
    - active
    - suspended
    - disabled
spec_examples:
- handle: adoe
  display_name: Alex Doe
  email: adoe@cexample.com
  actor_type: human
  authenticated_by: corp-directory
  external_subject: uid=adoe,ou=people,dc=cexample,dc=com
  status: active
outputs:
  actor_uuid:
    type: string
    description: The stable actor id referenced by role-assignments and by grouping (access_grouping)
      membership.
relationships:
- edge_type: contained_by
  target: Identity.Group
  cardinality: 0..n
  description: Member of an access grouping (access_grouping) or Identity.Group; membership drives role
    binding (the RBAC bridge — `Grouping` subject_bindings plus the function-capability matrix).
- edge_type: references
  target: Security.CredentialRef
  cardinality: 0..n
  description: Credentials — referenced, never inline.
context:
  purpose: Models a human account — the actor that gets authenticated, authorized, and audited.
  plain_description: 'One human''s identity: its `handle` (the login name) and its `actor_type` — always
    `human`, and required alongside the handle — plus display name, email, status, and how they authenticate
    (the built-in provider by default, or a directory/IdP when federated). It carries no secret material
    — a password or key is referenced through a Security.CredentialRef, never stored. Every audited action
    and role assignment points back at this record''s stable actor id.'
  use_when:
  - You need human accounts as records that role assignments and audit trails reference.
  - You need a federated user tied to their external IdP subject without copying the IdP's data.
  not_for:
  - Automation, agents, or API-key holders — Identity.ServiceAccount.
  - The credential itself — Security.CredentialRef; a person references credentials, never contains them.
  - The directory server — Security.DirectoryService is the server; this is one identity in it.
  works_with:
  - Identity.Group — memberships that drive role binding.
  - Security.CredentialRef — the person's credentials, by reference.
  - Security.DirectoryService — the external authenticator when federated.
entity_type: Identity
