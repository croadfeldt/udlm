# Grouping.Tenant — the ownership border.
#
# Why a class and not a setting: six non-overridable structural invariants (GRP-INV-001..006) and the
# cross-tenant rule family are all written as "for tenant groups, X". Those rules are applicable only
# if the data says which groupings are tenants, and `resource_type` is that answer.
#
# Rejected: marking it with a boolean or an enum on the base class. Either would be a second answer to
# a question the type name already settles, and two answers can disagree.
$id: https://udlm.dev/registry/udlm/0.1/class/Grouping.Tenant/0.1.0
uuid: 6b2f0a71-7d3e-4c58-9a14-2e8b5c03f4d7
record_type: class
resource_type: Grouping.Tenant
class: type
parent: Grouping
family: Access
entity_type: Grouping
version: 0.1.0
conforms_to: udlm/0.1
status: active

context:
  purpose: >-
    The ownership and isolation border. Every record in the model carries a tenant_uuid pointing at
    one of these, and it is the referent that ownership, cost attribution, audit scope, drift
    accountability, and policy scope all resolve against.
  plain_description: >-
    A tenant. A thing belongs to exactly one at a time, and that is a structural lock rather than a
    convention — crossing the border is a deliberate, recorded act, not a default. Tenants may nest:
    a child keeps its own resources and its own isolation, while the parent gets governance overlay,
    cost rollup, and audit aggregation across its children.
  use_when:
    - Something must have exactly one owner, and moving it between owners must be visible
    - You need a boundary that cost, audit, drift, and policy all agree on
    - You are modelling a business unit, a customer, or a team that owns infrastructure
  not_for:
    - Grouping without isolation — a cost centre, a project, a label. That is a plain Grouping,
      where a member may belong to many and enforcement is advisory
    - Deciding who may act — external RBAC owns that (ADR-008); this decides what belongs to whom
    - Permitting one tenant to use another's resources — that is Grouping.Authorization
  works_with:
    - Grouping.Authorization — the recorded exception that lets a relationship cross this border
    - Every estate record — tenant_uuid resolves here (TEN-001/003, [D3])
    - The governance matrix — isolation obligations are enforced over the derived member set

elements:
  - element: parent_group_uuid
    scope: Grouping.Tenant
    optional: true
    state: proposed
    description: >-
      The parent tenant this one nests inside (§4). A child tenant keeps complete isolation — its
      resources belong to it and never to the parent (GRP-INV-004) — while the parent holds
      governance overlay, cost rollup, and audit aggregation. Absent means a root tenant. Destroying
      a parent requires explicit resolution of every child first; there is no silent cascade
      (GRP-INV-003).
    schema:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$

  - element: obligations
    scope: Grouping.Tenant
    optional: false
    state: proposed
    description: >-
      REQUIRED here, where the base leaves it optional. A tenant IS an isolation border, so how
      strongly it isolates is not something to leave unsaid: `none` is a deliberate declaration, not
      an omission. The mechanism that delivers a level (row-level
      security, separate stores, separate hardware) is the implementation's choice and is not
      modelled here.
    schema:
      type: object
      additionalProperties: false
      required: [isolation]
      properties:
        isolation:
          type: string
          enum: [none, logical, physical]

metadata:
  display_name: Tenant
  description: >-
    The ownership and isolation border. Every record carries a tenant_uuid resolving to one of these,
    and it is the referent ownership, cost attribution, audit scope, drift accountability, and policy
    scope all agree on. A member belongs to exactly one at a time — a structural lock, not a
    convention — and tenants may nest, the child keeping its resources and its isolation while the
    parent holds governance overlay and rollup.
  maintainer: UDLM project
  origination_timestamp: '2026-08-08T00:00:00Z'

spec_examples:
  - membership_criterion: estate?tenant_uuid=={self}
    obligations:
      isolation: physical
    subject_bindings:
      - provider_ref: estate/providers/directory
        expression: cn=payments,cn=groups,dc=cexample,dc=example
