$id: https://udlm.dev/registry/udlm/0.1/class/CredentialRef/0.8.1
conforms_to: udlm/0.1
uuid: 942b6cc9-a0d5-4f91-8c5c-ade4ecdf5b50
record_type: class
class: base
resource_type: CredentialRef
version: 0.8.1
family: Resource
status: active
filed_under:
  - security
metadata:
  display_name: Credential Reference
  description: 'A named reference to a credential a credential-issuing provider holds: which kind, held where, at
    what assurance floor — never the value. A Base by the Base test (CLS-002): every secret store (Vault, a Kubernetes
    Secret, an external-secrets provider) resolves a reference by issuer, path and version the same way, so a reference
    is one deliverable any of them serves. The provider resolves it at realization and the value flows directly
    to the authorized consumer; secret material never appears in the model, the audit, source control or logs.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-15T00:00:00Z'
elements:
  - element: credential_type
    scope: CredentialRef
    optional: false
    state: canonical
    description: 'Which kind of credential: `api_key`, `jwt`, `x509_certificate`, `ssh_key`, `secret`, `signing_key`,
      `encryption_key`, `service_account_token`, `database_password`, `kubeconfig`, `hsm_backed_key`.'
    schema:
      type: string
      enum:
        - api_key
        - jwt
        - x509_certificate
        - ssh_key
        - secret
        - signing_key
        - encryption_key
        - service_account_token
        - database_password
        - kubeconfig
        - hsm_backed_key
      description: 'Which kind of credential: `api_key`, `jwt`, `x509_certificate`, `ssh_key`, `secret`, `signing_key`,
        `encryption_key`, `service_account_token`, `database_password`, `kubeconfig`, `hsm_backed_key`.'
  - element: issuer_ref
    scope: CredentialRef
    optional: true
    state: canonical
    description: Reference to the issuing provider or CA.
    schema:
      description: Reference to the issuing provider or CA.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
  - element: secret_path
    scope: CredentialRef
    optional: true
    state: canonical
    description: The provider-side path the issuer resolves the value at. Only the path is recorded.
    schema:
      type: string
      description: The provider-side path the issuer resolves the value at. Only the path is recorded.
  - element: version
    scope: CredentialRef
    optional: true
    state: canonical
    description: Advisory version pin (`latest` or a version); the issuer records the concrete version in outputs.
    schema:
      type: string
      description: Advisory version pin (`latest` or a version); the issuer records the concrete version in outputs.
  - element: scope
    scope: CredentialRef
    optional: true
    state: canonical
    description: What the credential is scoped to (least privilege); the provider enforces it.
    schema:
      type: object
      description: What the credential is scoped to (least privilege); the provider enforces it.
      additionalProperties: false
      properties:
        entity_uuid:
          type: string
          description: Scoped to a specific entity, when applicable.
        operations:
          type: array
          items:
            type: string
          description: The operations this credential may perform (credentials.md operation vocabulary).
  - element: required_assurance
    scope: CredentialRef
    optional: true
    state: canonical
    description: 'The minimum assurance the consumer requires (NIST 800-63B AAL: aal1, aal2, aal3). A provider that
      cannot reach it is filtered out before binding.'
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/assurance_level
      description: 'The minimum assurance the consumer requires (NIST 800-63B AAL: aal1, aal2, aal3). A provider
        that cannot reach it is filtered out before binding.'
spec_examples:
  - credential_type: service_account_token
    issuer_ref: kubevirt-service-account-issuer
    secret_path: providers/kubevirt/service-accounts/log-forwarder
    version: latest
    scope:
      entity_uuid: 3f8b2c1d-4e6a-4b2f-9c7d-1a2b3c4d5e6f
      operations:
        - read
        - list
    required_assurance: aal2
outputs:
  resolved:
    type: boolean
    description: Whether the reference has been bound to a concrete credential at the issuer (Realized). NEVER the
      value.
  resolved_version:
    type: string
    description: The concrete credential version the issuer bound (audit record; provider-filled). Not the value.
  first_retrieval_at:
    type: string
    description: When the credential was first retrieved by the authorized consumer (credentials.md audits first
      retrieval — AUD hook). Never the value.
immutable:
  - credential_type
relationships:
  - edge_type: references
    name: authenticates
    target: Identity.ServiceAccount
    cardinality: 0..1
    description: The workload/service-account identity this credential authenticates, when it is a service-account
      token or workload credential.
  - edge_type: references
    name: authenticates
    target: Identity.Person
    cardinality: 0..1
    description: Or the person identity, for a human-held credential.
context:
  purpose: Points at a credential held by an issuing provider — which credential, held where, at what assurance
    — without the value ever entering the model.
  plain_description: 'A reference to a secret, never the secret. It names the kind of credential (the required `credential_type`),
    the issuer that holds it (`issuer_ref`), the provider-side path it resolves at (`secret_path`), its `scope`
    — an object saying what it may operate on — and the minimum assurance the consumer requires (`required_assurance`).
    At realization the issuer resolves it and delivers the value directly to the authorized consumer — the value
    never passes through the model, audit, source control, or logs. What IS recorded: that it resolved, which version,
    and when it was first retrieved.'
  use_when:
    - You need any resource (a container, a service, a BMC, a bind account) to consume a secret without the secret
      appearing in data.
    - You need audit facts about credential resolution and first retrieval, without exposure.
    - You need consumers to demand a minimum assurance level and have weaker issuers filtered out before binding.
  not_for:
    - The identity that authenticates with the credential — Identity.Person / Identity.ServiceAccount; an identity
      references its credentials, this is the credential side.
    - Storing an actual password, key, or token anywhere — no type is for that; the value lives only with the issuer.
  works_with:
    - Identity.Person / Identity.ServiceAccount — whose credential this is.
    - Container / Workload / FileShare — consumers that reference it from env, mounts, or config.
