uuid: 6d2f8c1a-3b47-4e9d-a5c0-8f1e2b7d4a63
record_type: class
class: type
resource_type: Machine.LPAR
parent: Machine
version: 0.1.0
family: Resource
status: active
# OWN-007 — a type-level invariant, not settable per entity.
ownership_model: whole_allocation
metadata:
  display_name: Logical Partition
  description: 'A logical partition — the third form a Machine takes, beside a VM and a bare-metal host
    (ADR-068, ADR-069). An LPAR is an OS-bearing slice of a partitioned system (IBM Power via PowerVM and
    the HMC; IBM Z via PR/SM) that boots an image onto entitled processor capacity, memory and virtual
    I/O. It honors every Machine Base element: `cpu.count` is the virtual-processor count, `memory` the
    partition memory, `guest_os` the image, `storage` and `storage_tier` the disk requirement. What it
    adds is the partitioning vocabulary no VM or bare-metal host has — fractional processor entitlement,
    capped or uncapped sharing, a shared processor pool, and VIOS-backed virtual adapters. Those are
    Type-tier elements (conditional, class-tiers §7): Redfish has no partition profile beyond
    `SystemType`, so the names follow the HMC vocabulary. Dialects (PowerVM, PR/SM) and offerings land
    at the Provider tier.'
  maintainer: udlm-registry
  origination_timestamp: '2026-09-10T00:00:00Z'
elements:
- element: processor
  scope: Machine.LPAR
  optional: true
  state: proposed
  description: 'Processor entitlement for the partition — the HMC partition-profile processor settings. A
    request states how much physical capacity the partition is entitled to and how it shares; `cpu.count`
    (inherited) is the number of virtual processors the OS sees.'
  schema:
    type: object
    additionalProperties: false
    properties:
      entitled_capacity:
        type: number
        minimum: 0.05
        description: Entitled processing units (fractions of a physical core; PowerVM minimum 0.05 per virtual processor).
      sharing_mode:
        enum:
        - dedicated
        - capped
        - uncapped
        description: Dedicated cores, or shared capacity that is capped at the entitlement or may exceed it when the pool has headroom.
      uncapped_weight:
        type: integer
        minimum: 0
        maximum: 255
        description: Priority for excess pool capacity; meaningful only with sharing_mode uncapped.
      shared_pool:
        type: string
        description: The shared processor pool the partition draws from, as the provider names it.
- element: virtual_io
  scope: Machine.LPAR
  optional: true
  state: proposed
  description: 'Virtual I/O the partition is served through — VIOS-backed virtual SCSI, NPIV fibre channel,
    or virtual/SR-IOV network adapters. A requirement descriptor the provider satisfies from its VIOS
    pair; never a reference to a registered device.'
  schema:
    type: object
    additionalProperties: false
    properties:
      vios_backed:
        type: boolean
        description: Storage and network are served through Virtual I/O Servers rather than dedicated adapters.
      adapters:
        type: array
        items:
          type: object
          required:
          - kind
          properties:
            kind:
              enum:
              - vscsi
              - npiv
              - vnic
              - sriov
              - virtual_ethernet
            count:
              type: integer
              minimum: 1
- element: run_state
  scope: Machine.LPAR
  optional: true
  state: proposed
  description: Desired partition run state the provider drives to (HMC activate / shut down). Distinct from the four-state lifecycle_state.
  schema:
    type: object
    properties:
      desired_state:
        enum:
        - running
        - stopped
spec_examples:
- cpu:
    count: 4
  memory:
    size: 64Gi
  guest_os:
    type: linux-server-9
    version: '9.6'
  processor:
    entitled_capacity: 2.0
    sharing_mode: uncapped
    uncapped_weight: 128
    shared_pool: DefaultPool
  virtual_io:
    vios_backed: true
    adapters:
    - kind: npiv
      count: 2
    - kind: virtual_ethernet
      count: 1
  run_state:
    desired_state: running
outputs:
  partition_id:
    type: integer
    description: The partition identifier the managing system assigned.
  provider_handle:
    type: string
    description: The provider-native partition name (opaque; correlation only).
  observed_run_state:
    type: string
    description: Observed partition state as the provider reports it.
relationships:
- edge_type: contained_by
  target: Machine.BareMetalHost
  cardinality: 1..1
  description: The partitioned system (the frame or CEC) the partition runs on — a managed bare-metal host.
- edge_type: references
  target: Facility.Location
  cardinality: 0..1
  description: Placement, as for any Machine.
adopts:
- standard: Redfish
  version: '2024.4'
  standard_name: ComputerSystem
  role: 'Vendor-neutral compute-system representation; an LPAR is a ComputerSystem whose SystemType is
    PhysicallyPartitioned (PR/SM) or VirtuallyPartitioned (PowerVM). Partition-profile settings have no
    Redfish profile and are named from the HMC vocabulary at this Type.'
  source: https://www.dmtf.org/standards/redfish
  license: DMTF
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: Declares a logical partition on a partitioned system as one provisionable Machine.
  plain_description: 'The request for a slice of a big partitioned server: how much processor capacity it
    is entitled to and whether it may borrow more, how much memory, which image, and how its disks and
    network are served. The provider (an HMC-managed Power system, a PR/SM-managed mainframe) activates
    the partition and reports its identifier and state.'
  use_when:
  - You need an OS instance on a partitioned system and want to state entitlement rather than pick a frame.
  - You are rebuilding an estate whose workloads run on Power or Z and need those hosts in the same graph as VMs and bare metal.
  not_for:
  - A VM on a hypervisor — that is Machine.VM.
  - The partitioned system itself — that is Machine.BareMetalHost; the partition is contained_by it.
  works_with:
  - Machine.BareMetalHost — the frame that hosts the partition.
  - Storage.Volume — the disks served through virtual I/O.
  - Network.VirtualNetwork — the network a virtual adapter attaches to.
