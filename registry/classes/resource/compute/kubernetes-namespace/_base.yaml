metadata:
  display_name: Namespace
  description: 'A Kubernetes namespace ordered as one deliverable: the isolation and scheduling boundary workloads
    are placed into and tenancy binds to. A Base by the Base test (CLS-002): its contract is the Kubernetes API
    Namespace object, which every conformant distribution honours; an OpenShift Project is a dialect Type beneath
    it. It has its own lifecycle and cannot outlive its cluster.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-17T00:00:00Z'
elements:
  - element: name
    scope: KubernetesNamespace
    optional: false
    state: canonical
    description: The namespace name, unique within the cluster.
    schema:
      type: string
      description: The namespace name, unique within the cluster.
  - element: cluster_ref
    scope: KubernetesNamespace
    optional: true
    state: canonical
    description: Reference to the KubernetesCluster this namespace lives in.
    schema:
      description: Reference to the KubernetesCluster this namespace lives in.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
  - element: tenant_uuid
    scope: KubernetesNamespace
    optional: true
    state: canonical
    description: The tenant this namespace is bound to; resources placed into it inherit the binding.
    schema:
      type: string
      description: The tenant this namespace is bound to; resources placed into it inherit the binding.
  - element: labels
    scope: KubernetesNamespace
    optional: true
    state: canonical
    description: Labels (Kubernetes label semantics).
    schema:
      type: object
      additionalProperties:
        type: string
      description: Labels (Kubernetes label semantics).
  - element: annotations
    scope: KubernetesNamespace
    optional: true
    state: canonical
    description: Annotations (Kubernetes annotation semantics).
    schema:
      type: object
      additionalProperties:
        type: string
      description: Annotations (Kubernetes annotation semantics).
  - element: hard
    scope: KubernetesNamespace
    optional: true
    state: canonical
    description: Hard aggregate limits on what the namespace may consume (a Kubernetes ResourceQuota). A quota never
      exists apart from its namespace, so it is an element here, not a class (row 071). Any key is a Kubernetes
      resource name.
    schema:
      type: object
      description: Hard aggregate limits on what the namespace may consume (a Kubernetes ResourceQuota). A quota
        never exists apart from its namespace, so it is an element here, not a class (row 071). Any key is a Kubernetes
        resource name.
      properties:
        cpu:
          type: string
          description: Aggregate CPU limit (e.g., '32', '16000m').
        memory:
          type: string
          description: Aggregate memory limit (e.g., '64Gi').
        pods:
          type: integer
          description: Maximum number of pods.
        requests.storage:
          type: string
          description: Aggregate storage request limit.
        persistentvolumeclaims:
          type: integer
          description: Maximum number of PVCs.
      additionalProperties:
        type: string
spec_examples:
  - name: team-alpha-prod
    cluster_ref: primary-platform-cluster
    tenant_uuid: b3f1c2d4-5e6a-4b7c-8d9e-0a1b2c3d4e5f
    labels:
      team: alpha
      environment: production
    annotations:
      owner: platform-team
    hard:
      cpu: '32'
      memory: 64Gi
      pods: 200
outputs:
  name:
    type: string
    description: The realized namespace name — the string value provider-specific namespace references resolve to
      (Provider-Class `SharedDataElement` references, ADR-038).
  uid:
    type: string
    description: The platform-native UID of the namespace (e.g., Kubernetes metadata.uid).
relationships:
  - edge_type: contained_by
    target: KubernetesCluster
    cardinality: 1..1
    name: cluster
    description: The cluster this namespace exists within. A namespace cannot outlive its cluster.
adopts:
  - standard: Kubernetes
    version: core/v1
    standard_name: Namespace
    role: cluster-scoped isolation boundary for workloads and resource quotas
    source: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
    license: CC-BY-4.0
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: Kubernetes
    version: core/v1
    standard_name: ResourceQuota
    role: namespace-scoped aggregate resource limits and usage tracking
    source: https://kubernetes.io/docs/concepts/policy/resource-quotas/
    license: CC-BY-4.0
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Declares the isolation boundary inside a cluster that workloads are placed into and tenancy binds to.
  plain_description: 'What Kubernetes calls a Namespace (and some distributions overlay as a project): a named partition
    of a cluster that workloads live in. Its `name` is required and authored as intent — the same name is published
    back at realization alongside the platform UID. It binds a tenant (`tenant_uuid`), references its cluster (`cluster_ref`),
    carries `labels` and `annotations`, and cannot outlive its cluster. Providers and placement policies use it
    to answer which namespace a request lands in.'
  use_when:
    - You need workloads partitioned per tenant, team, or environment inside a shared cluster.
    - You need quota and placement policy to operate on a governed namespace record, not an ad-hoc string.
  not_for:
    - The cluster itself — KubernetesCluster.
  works_with:
    - KubernetesCluster — the cluster the namespace exists within.
    - Container / Workload — workloads placed into it.
