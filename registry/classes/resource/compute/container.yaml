  description: 'A container workload — image, resources, environment, mounts, and exposed ports — realized
    and managed by a *resource* provider (a Kubernetes cluster, podman) under the four-state lifecycle
    (DCM ADR-023). Models the service/workload layer of the estate: MCP servers, the media stack, mail,
    etc. Secret material is never inline — env/mounts reference a Security.CredentialRef.'
  maintainer: udlm-registry
  origination_timestamp: '2026-06-17T18:31:11Z'
elements:
- element: image
  scope: Compute.Container
  optional: false
  state: canonical
  description: The container image — either the inline OCI reference (first branch) OR a data_reference
    to a governed container_image reference-data layer. The reference form lets the control plane compute the change-impact
    blast radius when a base image or embedded library is bumped (UDLM DCM ADR-012; DCM ADR-024) — an inline
    OCI string cannot be cascaded.
  schema:
    description: The container image — either the inline OCI reference (first branch) OR a data_reference
      to a governed container_image reference-data layer. The reference form lets the control plane compute the change-impact
      blast radius when a base image or embedded library is bumped (UDLM DCM ADR-012; DCM ADR-024) — an inline
      OCI string cannot be cascaded.
    oneOf:
    - type: object
      required:
      - reference
      additionalProperties: false
      properties:
        reference:
          type: string
          description: OCI image reference, e.g. registry.example.com/org/app:1.0
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
          description: OCI content-addressable digest, pinned at Realized/Discovered for provenance.
