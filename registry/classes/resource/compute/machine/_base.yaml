metadata:
  authority: canonical
  display_name: Machine Base Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-07-27T21:00:00Z'
  title: Machine Base Class
  description: 'An OS-bearing machine ordered as one deliverable: an image booted onto cpu, memory, disk and network.
    A Base by the Base test (CLS-002): OpenStack Nova with Ironic, Cluster API''s Machine and TOSCA''s Compute node
    already treat a VM, a bare-metal host and a logical partition as one thing, so an order placed here is fillable
    by any provider offering one of the three forms. Every element here is honoured by every form. A container or
    a Kubernetes cluster is not a machine (rows 068, 069).'
  prompt_version: class-p0-keystone-2026-07-27
elements:
  - element: instance_size
    scope: Machine
    optional: true
    state: proposed
    description: Provider-neutral size class (small | medium | large, ordered and comparable; common-elements §2.2).
      Sizes the machine in place of explicit cpu and memory; the provider maps the class to concrete resources at
      realization. A machine may be declared by size class alone.
    schema:
      type: string
      description: Provider-neutral size class (small | medium | large, ordered and comparable; common-elements
        §2.2). Sizes the machine in place of explicit cpu and memory; the provider maps the class to concrete resources
        at realization. A machine may be declared by size class alone.
  - element: cpu
    scope: Machine
    state: canonical
    description: 'CPU requirement: `count` is the virtual CPUs the OS sees; sockets and cores per socket are optional
      topology hints. The provider maps it to its native model (hypervisor sockets×cores, cloud vCPUs).'
    schema:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          description: Total virtual CPUs. The provider naturalizes this to its native cpu model (a KubeVirt domain
            cpu, a hypervisor platform's sockets*cores, a public cloud's vCPUs) at realization (DCM ADR-023).
        sockets:
          type: integer
          minimum: 1
          description: 'Optional topology hint: sockets. Provider-support-dependent; ignored where not applicable.'
        cores_per_socket:
          type: integer
          minimum: 1
          description: 'Optional topology hint: cores per socket. Provider-support-dependent.'
      description: 'CPU requirement: `count` is the virtual CPUs the OS sees; sockets and cores per socket are optional
        topology hints. The provider maps it to its native model (hypervisor sockets×cores, cloud vCPUs).'
    optional: true
  - element: memory
    scope: Machine
    state: canonical
    description: 'Memory requirement: `size` as a quantity (16Gi); `hugepages` optional.'
    schema:
      type: object
      properties:
        size:
          $ref: ../../../../common-elements.schema.json#/$defs/quantity
          description: Memory allocation, e.g. 16GB or 16Gi (class-aligned quantity pattern — Machine Base Class
            `memory.size`).
        hugepages:
          type: object
          description: Optional huge-page backing (provider-support-dependent; validated against provider capability).
          properties:
            enabled:
              type: boolean
            page_size:
              type: string
              description: e.g. 2Mi, 1Gi.
      description: 'Memory requirement: `size` as a quantity (16Gi); `hugepages` optional.'
    optional: true
  - element: storage
    scope: Machine
    optional: true
    state: canonical
    description: Numeric storage requirements the realizing storage must meet — IOPS, throughput, replication, encryption.
      The performance class is the governed `storage_tier` element, not a value here.
    schema:
      type: object
      description: Numeric storage requirements the realizing storage must meet — IOPS, throughput, replication,
        encryption. The performance class is the governed `storage_tier` element, not a value here.
      properties:
        min_iops:
          type: integer
          minimum: 0
        min_throughput_mbps:
          type: integer
          minimum: 0
        min_replication:
          type: integer
          minimum: 1
        encryption:
          type: boolean
  - element: storage_tier
    scope: Machine
    optional: true
    state: canonical
    description: 'The requested storage performance class — a governed `storage_tier` term (standard | performance
      | archive), each denoting a requirements floor. Name-selectable but requirements-authoritative (ADR-036):
      a tier name resolves to its floor, explicit `storage` requirements win where both are given, and any provider
      class that clears the floor qualifies. The provider records the native class it chose as a realized output.
      Profile decides whether a bare term or a data_reference is required.'
    schema:
      type: string
      description: 'The requested storage performance class — a governed `storage_tier` term (standard | performance
        | archive), each denoting a requirements floor. Name-selectable but requirements-authoritative (ADR-036):
        a tier name resolves to its floor, explicit `storage` requirements win where both are given, and any provider
        class that clears the floor qualifies. The provider records the native class it chose as a realized output.
        Profile decides whether a bare term or a data_reference is required.'
    values:
      reference_data_type: storage_tier
  - element: disks
    scope: Machine
    optional: true
    state: canonical
    description: 'The machine''s disks as portable intent, in order: each a stable `name`, a `size`, and optionally a
      governed `storage_tier` and a `role` (`boot` for the disk that carries the OS, `data`, `log`). The name is the
      join key a realized Volume binds to through its `disk_entry`, surviving reorder and resize. Embedded here, not
      a record of its own: every platform declares a machine''s disk list on the machine and keeps the volumes
      separate (row 112; formerly StorageLayout). The entry shape is the shared `disk` (common-elements §2.6).'
    schema:
      type: array
      minItems: 1
      description: 'The machine''s disks as portable intent, in order; each entry''s `name` is the join key a realized
        Volume binds to through its `disk_entry`.'
      items:
        $ref: ../../../../common-elements.schema.json#/$defs/disk
  - element: boot_order
    scope: Machine
    optional: true
    state: canonical
    description: 'Which devices the firmware tries, in order: a `disks[].name`, or the device class `network` or
      `cdrom`. One list for every form of Machine (row 112): libvirt, KubeVirt, VMware and Redfish each take an
      ordered device list, and the provider translates; a cloud that has no boot order ignores it. Absent means the
      provider default.'
    schema:
      type: array
      items:
        type: string
      description: 'Ordered boot devices: a `disks[].name`, or the device class `network` or `cdrom`.'
  - element: guest_os
    scope: Machine
    optional: true
    state: proposed
    description: 'The requested operating system. Portable form: a data_reference to an `os_image` term the provider
      advertises. Inline `{type, version}` is the portability-breaking escape. Optional: a machine may be declared
      by sizing alone; a profile may require it.'
    schema:
      description: 'The requested operating system. Portable form: a data_reference to an `os_image` term the provider
        advertises. Inline `{type, version}` is the portability-breaking escape. Optional: a machine may be declared
        by sizing alone; a profile may require it.'
      oneOf:
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              description: 'Inline OS identifier (e.g. linux-server-9). portability_breaking: a value with no os_image
                vocabulary entry — a review finding.'
            version:
              type: string
              description: Inline OS version (e.g. 9.4).
        - allOf:
            - $ref: ../../../../data-reference.schema.json#/$defs/data_reference
            - required:
                - reference_data_type
              properties:
                reference_data_type:
                  const: os_image
  - element: run_state
    scope: Machine
    optional: true
    state: canonical
    description: 'The run state the consumer wants the provider to drive the machine to: `running`, `stopped` or
      `suspended`. One element for every form of Machine (row 111): a VM, a bare-metal host and an LPAR all have
      one, and the provider translates it to its native spec (Metal3 `online`, a KubeVirt run strategy, an HMC
      activate or shut down). A provider that cannot honour a value refuses the request; an LPAR never takes
      `suspended`. Distinct from the four-state lifecycle, which says where the order is, not whether the machine
      is on. Observed counterpart: `outputs.observed_run_state`.'
    schema:
      type: object
      properties:
        desired_state:
          type: string
          enum:
            - running
            - stopped
            - suspended
          description: Target run state.
      description: 'The run state the consumer wants the provider to drive the machine to (`running`, `stopped`,
        `suspended`); the provider translates it to its native spec. Observed counterpart: `outputs.observed_run_state`.'
coverage:
  use_cases:
    - scoped-class/author-scoped-class
    - scoped-class/compile-type-to-flat-spec
    - scoped-class/portability-derived-from-scope
  flows:
    - docs/flows/scoped-class-lifecycle.md
outputs:
  realized_volumes:
    type: array
    description: 'DERIVED: per-disk realization map, items {entry, volume, storage_backing}. For each `disks[].name`,
      the Volume realizing it (by the volume''s `realizes_disk` edge and `disk_entry` join key) and the native storage
      class the provider chose, the ADR-036 realized fact behind the entry''s `storage_tier`. Computed from the Volume
      records, never stored (compute-never-store); the lineage surface from declared disk to realized volume.'
  observed_run_state:
    type: string
    description: 'The run state the provider last observed, normalized to the same vocabulary as `run_state`
      (Redfish PowerState On and Off, a KubeVirt phase, an HMC partition state all land here; PoweringOn and
      PoweringOff are `transitioning`). Drives shutdown and startup ordering for the dependency graph. One output
      for every form of Machine (row 111).'
  provider_handle:
    type: string
    description: 'The provider-native identifier of the realized machine (opaque; correlation and operations only
      — never a portable reference). Promoted from Machine.VM: every form has one.'
  primary_ip:
    type: string
    description: 'The primary or management address of the booted machine — the single address most bindings want.
      Promoted from Machine.VM: a bare-metal host and an LPAR have one once booted.'
  hostname:
    type: string
    description: Realized hostname (FQDN where the realm provides one). Promoted from Machine.VM.
context:
  purpose: Declares an OS-bearing machine — an image booted onto cpu, memory, disk and network — without saying
    whether it is a VM, a bare-metal host or a logical partition.
  plain_description: 'The most portable way to ask for a machine: how big, what image, which disks, what storage tier. Placement
    decides the form (VM, bare metal, LPAR) and the provider; policy fills what the form needs. A producer bound
    at any of the three forms must accept this order (class-tiers CLS-002 (c)).'
  use_when:
    - You need a host and do not care whether it is virtual or physical.
    - A rebuild after loss where the original form is not worth preserving.
  not_for:
    - A container (Container) or a Kubernetes cluster (KubernetesCluster) — neither can honor `guest_os`.
    - When the form matters — order Machine.VM, Machine.BareMetalHost or Machine.LPAR.
  works_with:
    - Machine.VM, Machine.BareMetalHost, Machine.LPAR — the forms an order here resolves to.
    - Volume and VirtualNetwork — what the realized machine attaches to.
spec_examples:
  - cpu:
      count: 4
    memory:
      size: 16Gi
    guest_os:
      type: linux-server-9
      version: '9.6'
    storage_tier: performance
    disks:
      - name: root
        size: 100Gi
        role: boot
adopts:
  - standard: Redfish
    version: '2024.4'
    standard_name: ComputerSystem
    role: 'Vendor-neutral compute-system representation spanning physical, virtual and partitioned (Redfish ComputerSystem
      SystemType: Physical | Virtual | Composed | PhysicallyPartitioned | VirtuallyPartitioned) — the one representative
      standard for the Machine family, shared by Machine.VM, Machine.BareMetalHost and Machine.LPAR and declared
      once here. Nova with Ironic, Cluster API''s Machine and TOSCA''s Compute are the industry abstractions that
      treat the three forms as one thing (CLS-002 (a)); Redfish is the wire representation adopted. Provider-native
      realizations are declared on the provider support matrix, not on the substrate type.'
    source: https://www.dmtf.org/standards/redfish
    license: DMTF
    license_compatibility: compatible-reference
    disposition: tier1_value
