metadata:
  authority: canonical
  display_name: Machine Base Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-07-27T21:00:00Z'
  title: Machine Base Class
  description: 'An OS-bearing machine ordered as one deliverable: an image booted onto cpu, memory, disk and network.
    A Base by the Base test (CLS-002): OpenStack Nova with Ironic, Cluster API''s Machine and TOSCA''s Compute node
    already treat a VM, a bare-metal host and a logical partition as one thing, so an order placed here is fillable
    by any provider offering one of the three forms. Every element here is honoured by every form. A container or
    a Kubernetes cluster is not a machine (rows 068, 069).'
  prompt_version: class-p0-keystone-2026-07-27
elements:
  - element: instance_size
    scope: Machine
    optional: true
    state: proposed
    description: Provider-neutral size class (small | medium | large, ordered and comparable; common-elements §2.2).
      Sizes the machine in place of explicit cpu and memory; the provider maps the class to concrete resources at
      realization. A machine may be declared by size class alone.
    schema:
      type: string
      description: Provider-neutral size class (small | medium | large, ordered and comparable; common-elements
        §2.2). Sizes the machine in place of explicit cpu and memory; the provider maps the class to concrete resources
        at realization. A machine may be declared by size class alone.
  - element: cpu
    scope: Machine
    state: canonical
    description: 'CPU requirement: `count` is the virtual CPUs the OS sees; sockets and cores per socket are optional
      topology hints. The provider maps it to its native model (hypervisor sockets×cores, cloud vCPUs).'
    schema:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          description: Total virtual CPUs. The provider naturalizes this to its native cpu model (a KubeVirt domain
            cpu, a hypervisor platform's sockets*cores, a public cloud's vCPUs) at realization (DCM ADR-023).
        sockets:
          type: integer
          minimum: 1
          description: 'Optional topology hint: sockets. Provider-support-dependent; ignored where not applicable.'
        cores_per_socket:
          type: integer
          minimum: 1
          description: 'Optional topology hint: cores per socket. Provider-support-dependent.'
      description: 'CPU requirement: `count` is the virtual CPUs the OS sees; sockets and cores per socket are optional
        topology hints. The provider maps it to its native model (hypervisor sockets×cores, cloud vCPUs).'
    optional: true
  - element: memory
    scope: Machine
    state: canonical
    description: 'Memory requirement: `size` as a quantity (16Gi); `hugepages` optional.'
    schema:
      type: object
      properties:
        size:
          type: string
          pattern: ^[0-9]+(Mi|Gi|MB|GB|TB|MiB|GiB|TiB)$
          description: Memory allocation, e.g. 16GB or 16Gi (class-aligned quantity pattern — Machine Base Class
            `memory.size`).
        hugepages:
          type: object
          description: Optional huge-page backing (provider-support-dependent; validated against provider capability).
          properties:
            enabled:
              type: boolean
            page_size:
              type: string
              description: e.g. 2Mi, 1Gi.
      description: 'Memory requirement: `size` as a quantity (16Gi); `hugepages` optional.'
    optional: true
  - element: storage
    scope: Machine
    optional: true
    state: canonical
    description: Numeric storage requirements the realizing storage must meet — IOPS, throughput, replication, encryption.
      The performance class is the governed `storage_tier` element, not a value here.
    schema:
      type: object
      description: Numeric storage requirements the realizing storage must meet — IOPS, throughput, replication,
        encryption. The performance class is the governed `storage_tier` element, not a value here.
      properties:
        min_iops:
          type: integer
          minimum: 0
        min_throughput_mbps:
          type: integer
          minimum: 0
        min_replication:
          type: integer
          minimum: 1
        encryption:
          type: boolean
  - element: storage_tier
    scope: Machine
    optional: true
    state: canonical
    description: 'The requested storage performance class — a governed `storage_tier` term (standard | performance
      | archive), each denoting a requirements floor. Name-selectable but requirements-authoritative (ADR-036):
      a tier name resolves to its floor, explicit `storage` requirements win where both are given, and any provider
      class that clears the floor qualifies. The provider records the native class it chose as a realized output.
      Profile decides whether a bare term or a data_reference is required.'
    schema:
      type: string
      description: 'The requested storage performance class — a governed `storage_tier` term (standard | performance
        | archive), each denoting a requirements floor. Name-selectable but requirements-authoritative (ADR-036):
        a tier name resolves to its floor, explicit `storage` requirements win where both are given, and any provider
        class that clears the floor qualifies. The provider records the native class it chose as a realized output.
        Profile decides whether a bare term or a data_reference is required.'
    values:
      reference_data_type: storage_tier
  - element: guest_os
    scope: Machine
    optional: true
    state: proposed
    description: 'The requested operating system. Portable form: a data_reference to an `os_image` term the provider
      advertises. Inline `{type, version}` is the portability-breaking escape. Optional: a machine may be declared
      by sizing alone; a profile may require it.'
    schema:
      description: 'The requested operating system. Portable form: a data_reference to an `os_image` term the provider
        advertises. Inline `{type, version}` is the portability-breaking escape. Optional: a machine may be declared
        by sizing alone; a profile may require it.'
      oneOf:
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              description: 'Inline OS identifier (e.g. linux-server-9). portability_breaking: a value with no os_image
                vocabulary entry — a review finding.'
            version:
              type: string
              description: Inline OS version (e.g. 9.4).
        - allOf:
            - $ref: ../../../../data-reference.schema.json#/$defs/data_reference
            - required:
                - reference_data_type
              properties:
                reference_data_type:
                  const: os_image
coverage:
  use_cases:
    - scoped-class/author-scoped-class
    - scoped-class/compile-type-to-flat-spec
