family: Resource
status: active
metadata:
  display_name: Bare Metal Host
  description: A physical machine as a managed asset — the box itself, one of the three forms of Machine (CLS-004,
    by form). It may sit unallocated in inventory, carries its aggregate capacity (cpu, memory, storage) as host
    attributes, and is what VMs, containers and storage daemons ultimately run on. Allocating a host to a consumer
    is the ownership model, not a separate type; its components (NICs, drives, GPUs, BMC) are their own records
    contained by it. Grounded in Redfish ComputerSystem for inventory and Metal3 BareMetalHost for provisioning.
  maintainer: udlm-registry
  origination_timestamp: '2026-06-27T00:31:44Z'
elements:
  - element: lifecycle_state
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: 'Allocation state: `available` = inventoried and unallocated; `allocated` = adopted into the managed
      lifecycle (Metal3 provisioning state).'
    schema:
      type: string
      enum:
        - available
        - allocated
        - retired
      description: 'Allocation state: `available` = inventoried and unallocated; `allocated` = adopted into the
        managed lifecycle (Metal3 provisioning state).'
  - element: composition_visibility
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: Whether the host's components are modeled as their own records or only as rollups on the host (`opaque`).
      CPU, memory and local storage stay rollups either way.
    schema:
      type: string
      enum:
        - opaque
        - transparent
        - selective
      description: Whether the host's components are modeled as their own records or only as rollups on the host
        (`opaque`). CPU, memory and local storage stay rollups either way.
  - element: identity
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: 'Chassis and system identity: serial, model, asset tag.'
    schema:
      type: object
      description: 'Chassis and system identity: serial, model, asset tag.'
      properties:
        serial_number:
          type: string
          description: System serial (Redfish ComputerSystem.SerialNumber).
        asset_tag:
          type: string
          description: Org asset tag (Redfish AssetTag).
        manufacturer:
          type: string
          description: Redfish Manufacturer.
        model:
          type: string
          description: Redfish Model.
        sku:
          type: string
          description: Redfish SKU.
  - element: cpu
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: Aggregate host CPU (Redfish ProcessorSummary).
    schema:
      type: object
      description: Aggregate host CPU (Redfish ProcessorSummary).
      properties:
        sockets:
          type: integer
          minimum: 1
          description: Populated sockets (Redfish ProcessorSummary.Count).
        cores:
          type: integer
          minimum: 1
          description: Total physical cores (Redfish ProcessorSummary.CoreCount).
        threads:
          type: integer
          minimum: 1
          description: Total logical processors (Redfish ProcessorSummary.LogicalProcessorCount).
  - element: memory
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: Aggregate host memory (Redfish MemorySummary).
    schema:
      type: object
      description: Aggregate host memory (Redfish MemorySummary).
      properties:
        size:
          type: string
          pattern: ^[0-9]+(MB|GB|TB|MiB|GiB|TiB)$
          description: Total system memory, e.g. 64GB (Redfish MemorySummary.TotalSystemMemoryGiB).
  - element: storage
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: Aggregate host local storage.
    schema:
      type: object
      description: Aggregate host local storage.
      properties:
        capacity:
          type: string
          pattern: ^[0-9]+(MB|GB|TB|PB|MiB|GiB|TiB|PiB)$
          description: Total raw local capacity.
  - element: architecture
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: System instruction-set architecture.
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/isa
      description: System instruction-set architecture.
  - element: bios_version
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: Firmware/BIOS version (Redfish BiosVersion).
    schema:
      type: string
      description: Firmware/BIOS version (Redfish BiosVersion).
  - element: image
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: The provisioning image written to the root device at provision time (Metal3 image). A host rebuilt
      from intent re-provisions from exactly this.
    schema:
      type: object
      additionalProperties: false
      required:
        - url
        - checksum
      description: The provisioning image written to the root device at provision time (Metal3 image). A host rebuilt
        from intent re-provisions from exactly this.
      properties:
        url:
          type: string
          description: Image URL (artifact location, not a resource reference).
        checksum:
          type: string
          description: Image checksum value.
        checksum_type:
          enum:
            - md5
            - sha256
            - sha512
          description: Checksum algorithm (Metal3 checksumType).
        format:
          enum:
            - raw
            - qcow2
            - vmdk
            - live-iso
          description: Image format (Metal3 DiskFormat).
  - element: root_device_hints
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: Which disk receives the image (Metal3 rootDeviceHints), matched at provision time.
    schema:
      type: object
      additionalProperties: false
      description: Which disk receives the image (Metal3 rootDeviceHints), matched at provision time.
      properties:
        device_name:
          type: string
          description: Device path hint (e.g. /dev/sda).
        serial_number:
          type: string
          description: Disk serial hint — the stable choice across reboots.
        wwn:
          type: string
          description: WWN hint.
        min_size_gigabytes:
          type: integer
          description: Smallest acceptable root device.
  - element: boot_mac_address
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: The NIC MAC the host network-boots from (Metal3 bootMACAddress); pairs with that NIC's NetworkInterface
      record.
    schema:
      type: string
      pattern: ^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$
      description: The NIC MAC the host network-boots from (Metal3 bootMACAddress); pairs with that NIC's NetworkInterface
        record.
  - element: online
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: 'Desired power target (Metal3 online): true = powered on and kept on. Observed counterpart: `outputs.power_state`.'
    schema:
      type: boolean
      description: 'Desired power target (Metal3 online): true = powered on and kept on. Observed counterpart: `outputs.power_state`.'
  - element: firmware
    scope: Machine.BareMetalHost
    optional: true
    state: canonical
    description: 'Host firmware: `type` is `legacy` or `uefi` (the Redfish spelling Machine.VM shares) plus UEFI
      Secure Boot. No vTPM here: a physical TPM is a hardware fact. Not on Machine because an LPAR cannot honour
      it.'
    schema:
      type: object
      additionalProperties: false
      description: 'Host firmware: `type` is `legacy` or `uefi` (the Redfish spelling Machine.VM shares) plus UEFI
        Secure Boot. No vTPM here: a physical TPM is a hardware fact. Not on Machine because an LPAR cannot honour
        it.'
      properties:
        type:
          enum:
            - legacy
            - uefi
          description: Firmware interface the host boots with (Redfish spelling; `legacy` is BIOS).
        secure_boot:
          type: boolean
          description: 'UEFI Secure Boot. Only valid with type: uefi (policy-validated).'
spec_examples:
  - lifecycle_state: allocated
    composition_visibility: selective
    identity:
      serial_number: SN-EXAMPLE-0001
      asset_tag: ASSET-0042
      manufacturer: ExampleCorp
      model: ExampleServer R1
      sku: EX-R1-2U
    cpu:
      sockets: 2
      cores: 64
      threads: 128
    memory:
      size: 512GB
    storage:
      capacity: 8TB
    architecture: x86_64
    bios_version: 2.10.1
    image:
      url: https://images.example.com/rhcos-9.qcow2
      checksum: 3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f3f
      checksum_type: sha256
      format: qcow2
    root_device_hints:
      device_name: /dev/sda
      serial_number: DISK-EX-0001
      min_size_gigabytes: 480
    boot_mac_address: 00:11:22:33:44:55
    online: true
    firmware:
      type: uefi
outputs:
  power_state:
    type: string
    description: Observed power state — On | Off | PoweringOn | PoweringOff (Redfish ComputerSystem.PowerState).
      Drives shutdown/startup ordering for the dependency graph.
  management_address:
    type: string
    description: Reachable management endpoint (BMC/Redfish or host management IP) once Realized. When a BMC record
      exists for this host, the BMC record is authoritative; this output is the convenience copy.
  provisioning_state:
    type: string
    description: 'Metal3''s headline status (available | provisioning | provisioned | deprovisioning | error) —
      the signal cluster bring-up binds on: a Cluster/NodePool consumer waits for provisioned.'
  os_image_digest:
    type: string
    description: 'Content digest of the OS image the host actually runs — the Realized twin of spec.image.checksum.
      Answers ''which hosts run which image, and which have never converged?'' from declared outputs: season-pin
      != os_image_digest is the derivable never-converged / stale-image fact, without restating the image record.'
  effective_config_digest:
    type: string
    description: 'Digest of the resolved effective configuration this host last converged to — the Realized twin
      of the assembled request. The comparable fact only: per-field values and their winning layers are reconstructable
      from the layer chain + provenance (LAY-008), never restated here. Pairs with os_image_digest to make requested-vs-realized
      configuration a first-class, bindable comparison per host.'
immutable:
  - identity.serial_number
relationships:
  - edge_type: depends_on
    target: PowerFeed
    cardinality: 0..n
    description: Power source(s) the host draws from; the host stops before the feed in a reverse-topo shutdown.
adopts:
  - standard: Redfish
    version: '2024.4'
    standard_name: ComputerSystem
    role: physical system inventory + power vocabulary (identity, processor/memory summary, PowerState)
    source: https://www.dmtf.org/standards/redfish
    license: DMTF
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: Metal3
    version: 1.x
    standard_name: BareMetalHost
    role: bare-metal provisioning lifecycle + available/provisioned state
    source: https://book.metal3.io/
    license: Apache-2.0
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Models a physical machine as a managed asset — the box itself, whether or not anything is running on
    it yet.
  plain_description: 'One physical server: its identity (serial, model, asset tag), its aggregate capacity (CPU
    sockets and cores, memory, local storage), and its lifecycle state. It can sit unallocated in inventory before
    anything is deployed on it. Components like NICs can be modeled as their own records attached to the host; CPU,
    memory, and disk normally stay as rollup numbers on the host itself. Everything that runs — VMs, containers,
    storage daemons — ultimately sits on one of these, which makes it a central node in shutdown and startup ordering.'
  use_when:
    - You need an inventory of physical servers, including ones not yet assigned to any workload.
    - You need the dependency chain workload → host → power feed, so an outage or maintenance walk knows what stops
      when.
    - You need per-host aggregate capacity (cores, memory, storage) for allocation decisions.
    - you need host provisioning to be replayable intent — image, root device, boot MAC, power target — so a lost
      host rebuilds from the estate (the bare-metal leg of rehydration)
  not_for:
    - A virtual machine — that is Machine.VM; a host is hardware you can touch.
    - The host's out-of-band management controller — that is BMC, its own record with its own address and power-control
      surface.
    - Individual NICs, GPUs, or drives inside the host — those are NetworkInterface / GPU / StorageDevice records
      contained by the host.
  works_with:
    - PowerFeed — the power source the host draws from; roots the shutdown ordering.
    - The host's own `firmware` element — the portable BIOS settings it converges to; vendor attribute sets are
      Provider Class data.
    - NetworkInterface, StorageDevice, GPU, BMC — the host's components, as contained records.
    - Machine.VM — the guests the host runs.
