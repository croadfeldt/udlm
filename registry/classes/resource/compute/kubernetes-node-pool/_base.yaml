conforms_to: udlm/0.1
uuid: ff7f0b01-d451-4aed-89da-83117923820f
record_type: class
class: base
resource_type: KubernetesNodePool
short_name: K8sNodePool
version: 1.1.2
family: Resource
status: active
filed_under:
  - compute
metadata:
  display_name: Node Pool
  description: 'A homogeneous slice of a cluster''s node capacity — shared hardware traits, labels and taints —
    ordered, scaled and upgraded on its own (a cloud node pool, a MachineSet, a Cluster API MachineDeployment).
    A Base by the Base test (CLS-002): every conformant distribution exposes nodes with labels and taints that placement
    matches workloads against. Every pool, including the first, is one of these records contained by its cluster
    (row 072); distribution-specific pool shapes are the Type tier.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-17T00:00:00Z'
elements:
  - element: name
    scope: KubernetesNodePool
    optional: false
    state: canonical
    description: The pool name, unique within the cluster.
    schema:
      type: string
      description: The pool name, unique within the cluster.
  - element: cluster_ref
    scope: KubernetesNodePool
    optional: true
    state: canonical
    description: Reference to the KubernetesCluster this pool belongs to.
    schema:
      description: Reference to the KubernetesCluster this pool belongs to.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
  - element: node_count
    scope: KubernetesNodePool
    optional: true
    state: canonical
    description: Target number of nodes.
    schema:
      type: integer
      minimum: 0
      description: Target number of nodes.
  - element: node_resources
    scope: KubernetesNodePool
    optional: true
    state: canonical
    description: 'Per-node sizing in the shared compute shape (common-elements §2.2): a size class, or explicit
      cpu and memory. The provider maps it to a concrete node shape at realization.'
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/ComputeResources
      description: 'Per-node sizing in the shared compute shape (common-elements §2.2): a size class, or explicit
        cpu and memory. The provider maps it to a concrete node shape at realization.'
  - element: capabilities
    scope: KubernetesNodePool
    optional: true
    state: canonical
    description: 'Capability advertisements placement selects pools by: architecture, memory tier, GPU (available,
      models, count per node) — structured objects, not booleans.'
    schema:
      type: object
      description: 'Capability advertisements placement selects pools by: architecture, memory tier, GPU (available,
        models, count per node) — structured objects, not booleans.'
      properties:
        gpu:
          type: object
          properties:
            available:
              type: boolean
            models:
              type: array
              items:
                type: string
              description: GPU model names — the observed accelerator model strings (e.g. '<gpu-model>').
            count_per_node:
              type: integer
        architecture:
          type: string
          description: CPU architecture (e.g., x86_64, aarch64).
        memory_tier:
          type: string
          description: Memory class (e.g., standard, high-memory).
  - element: labels
    scope: KubernetesNodePool
    optional: true
    state: canonical
    description: Labels applied to every node in the pool.
    schema:
      type: object
      additionalProperties:
        type: string
      description: Labels applied to every node in the pool.
  - element: taints
    scope: KubernetesNodePool
    optional: true
    state: canonical
    description: Taints applied to every node; a workload must tolerate them to land here.
    schema:
      type: array
      items:
        type: object
        required:
          - key
          - effect
        properties:
          key:
            type: string
          value:
            type: string
          effect:
            type: string
            enum:
              - NoSchedule
              - PreferNoSchedule
              - NoExecute
      description: Taints applied to every node; a workload must tolerate them to land here.
spec_examples:
  - name: gpu-large
    cluster_ref: primary-platform-cluster
    node_count: 4
    node_resources:
      instance_size: large
      cpu:
        count: 16
      memory:
        size: 64Gi
    capabilities:
      gpu:
        available: true
        models:
          - accelerator-a100
          - accelerator-h100
        count_per_node: 8
      architecture: x86_64
      memory_tier: high-memory
    labels:
      workload: gpu
    taints:
      - key: dedicated
        value: gpu
        effect: NoSchedule
outputs:
  pool_name:
    type: string
    description: The realized pool name.
  available_capacity:
    type: object
    description: Current available capacity (discovered state).
relationships:
  - edge_type: contained_by
    target: KubernetesCluster
    cardinality: 1..1
    name: cluster
    description: The cluster this node pool belongs to.
context:
  purpose: Declares a homogeneous slice of a cluster's node capacity — shared hardware traits, labels, taints —
    that placement matches workloads against.
  plain_description: 'A named group of like nodes in a cluster — its `name` is required: how many (`node_count`),
    what they offer — `capabilities`, where advertisements are structured objects, not booleans (`gpu` carries available/models/count_per_node,
    beside `architecture` and `memory_tier`) — what `labels` they carry, and what `taints` a workload must tolerate
    to land there. Placement reads the capability advertisements to match a workload''s requirements to a pool.
    Cloud platforms call this a node pool or machine set.'
  use_when:
    - You need GPU or otherwise-special nodes grouped so only workloads that need (and tolerate) them land there.
    - You need placement to select capacity by declared capability (architecture, memory tier) rather than by node
      names.
  not_for:
    - The cluster — KubernetesCluster; it carries no pools of its own (ruling 072).
    - One physical machine — Machine.BareMetalHost; a pool is a cluster-level grouping, not a host record.
  works_with:
    - KubernetesCluster — the cluster the pool belongs to.
    - KubernetesNamespace — namespaces whose workloads schedule onto pools.
