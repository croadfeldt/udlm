adopts:
- standard: RFC 7364 / RFC 8926
  version: RFC 7364 (NVO3 framework), RFC 8926 (Geneve)
  standard_name: Network virtualization overlay segment (VNI)
  role: >-
    The overlay realization of the same segment identity 802.1Q gives on-prem — a VNI under VXLAN or
    Geneve. Adopted so `encapsulation` is honest about what this class actually is: a SEGMENT, of
    which a VLAN is one encapsulation.
  source: https://www.rfc-editor.org/rfc/rfc8926.html
  license: IETF-Trust
  license_compatibility: compatible-reference
  disposition: tier1_value
- standard: Public-cloud VPC subnet
  version: 'AWS VPC / Azure VNet / GCP VPC (convergent de-facto model)'
  standard_name: VPC subnet
  role: >-
    The public-cloud realization of segment identity. A cloud exposes no VLAN, so "which logical
    network" there is a subnet within a VPC, and `Network.Subnet` is where that lands. Adopted by
    reference (T5): the three clouds converged on the subnet shape independently, and re-expressing
    it would invent a fourth.
    THE VPC ITSELF HAS NO CLASS, stated rather than implied. VirtualNetwork is an ATTACHMENT POINT —
    its own description reads "the network a VM's or pod's NIC attaches to: a libvirt network, a
    NetworkAttachmentDefinition, an OVN logical switch". A VPC is a tenant-scoped CONTAINER with its
    own address space, holding many subnets, route tables and gateways. Treating one as the other
    would make a container and an attachment point the same thing, and a subnet is useful without
    its container — so the container half is left open rather than guessed at.
  source: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
  license: vendor-documentation
  license_compatibility: reference-only
  disposition: tier1_value
- standard: IEEE 802.1Q
  version: '2022'
  standard_name: VLAN tagging
  role: segment id + tagging vocabulary
  source: https://standards.ieee.org/ieee/802.1Q/
  license: IEEE
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: Names a network segment — an 802.1Q VLAN or an overlay VNI — once, as the shared object everything
    that rides it references.
  plain_description: 'The segment itself: its `encapsulation` — spelled `vlan` for an 802.1Q tag, `vxlan`
    or `geneve` for an overlay VNI, `flat` for untagged — and its id, `segment_id`. It exists so a segment
    id appears in exactly one record — switch ports, host sub-interfaces, gateway segments, and virtual
    networks all reference the VLAN record rather than each retyping the tag. It is a root resource: dependents
    select an existing VLAN, they do not invent one inline.'
  use_when:
  - You need one authoritative record per segment that ports, virtual networks, and gateway segments all
    reference.
  - You need overlay segments (VXLAN/Geneve VNIs) modeled with the same shape as 802.1Q VLANs.
  not_for:
  - The workload attachment point — Network.VirtualNetwork rides a VLAN; guests attach to the VirtualNetwork,
    not to the VLAN.
  - A port's tagging configuration — that is vlan_memberships on Hardware.NetworkInterface, referencing
    this record.
  works_with:
  - Hardware.NetworkInterface — ports and sub-interfaces declare membership by reference.
  - Network.VirtualNetwork — virtual networks ride a referenced segment.
  - Network.Switch — the fabric carrying the segment.
  - Network.Gateway — edge segments each ride a referenced VLAN.
