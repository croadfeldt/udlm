# OWN-007 — the canonical `shareable` case (ownership-sharing-allocation §2.3): one VLAN entity exists,
# consumers hold STAKES, and no consumer owns any portion of it (OWN-003). This is the declaration that
# makes "a composite may take a stake in it, never ownership" checkable rather than prose.
ownership_model: shareable
metadata:
  display_name: VLAN / Network Segment ID
  description: 'A foundational network segment identifier — a VLAN (IEEE 802.1Q) or an overlay VNI (VXLAN/Geneve)
    — owned and advertised by a network/fabric provider and/or defined in a platform data layer, and SELECTED
    by reference from the resources that ride it (a Network.VirtualNetwork, a Hardware.NetworkInterface).
    A root resource (docs/guides/foundational-resources.md): dependents reference an existing VLAN, they do not
    invent one. The concrete encapsulation is provider data; a provider may offer a variant (e.g. Network.Port)
    that the org ratifies.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-13T00:00:00Z'
elements:
- element: encapsulation
  scope: Network.VLAN
  optional: false
  state: canonical
  description: Segmentation type. vlan = 802.1Q; vxlan/geneve = overlay VNI; flat = untagged.
  schema:
    type: string
    enum:
    - vlan
    - vxlan
    - geneve
    - flat
    description: Segmentation type. vlan = 802.1Q; vxlan/geneve = overlay VNI; flat = untagged.
- element: segment_id
  scope: Network.VLAN
  optional: true
  state: canonical
  description: The VLAN id (1-4094 for 802.1Q) or VNI (0-16777215 for VXLAN/Geneve). Omitted for flat.
  schema:
    type: integer
    minimum: 0
    maximum: 16777215
    description: The VLAN id (1-4094 for 802.1Q) or VNI (0-16777215 for VXLAN/Geneve). Omitted for flat.
- element: name
  scope: Network.VLAN
  optional: true
  state: canonical
  description: Human name for the segment, e.g. dmz.
  schema:
    type: string
    description: Human name for the segment, e.g. dmz.
