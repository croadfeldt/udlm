conforms_to: udlm/0.1
uuid: c71a7ad9-23ea-40fe-a07d-ee088a20cf42
record_type: class
class: base
resource_type: DHCPScope
version: 0.9.1
family: Resource
status: active
filed_under:
  - network
metadata:
  display_name: DHCP Scope
  description: 'A DHCP scope: a subnet''s dynamic pools, options and lease time. A Base by the Base test (CLS-002):
    RFC 2131 defines a scope the same way for every DHCP server, so any of them serves one. It is served data, distinct
    from the AddressService that serves it; the concrete pool and lease model is provider configuration projected
    from this record. UDLM does not prescribe DHCP as the way to assign addresses: an address''s origin is `allocation`
    on its IPAddress record.'
  maintainer: udlm-registry
  origination_timestamp: '2026-06-27T00:38:59Z'
elements:
  - element: zone
    scope: DHCPScope
    optional: true
    state: proposed
    description: What kind of network this is — a governed network-zone term, for placement only (common-elements.schema.json
      `network_zone_ref`).
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/network_zone_ref
  - element: tier
    scope: DHCPScope
    optional: true
    state: proposed
    description: How good this network is — a governed network_tier floor the provider reports (common-elements.schema.json
      `network_tier_ref`).
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/network_tier_ref
  - element: subnet
    scope: DHCPScope
    optional: false
    state: canonical
    description: The scope's subnet in CIDR.
    schema:
      type: string
      description: The scope's subnet in CIDR.
  - element: ip_family
    scope: DHCPScope
    optional: true
    state: canonical
    description: Address family.
    schema:
      type: string
      enum:
        - ipv4
        - ipv6
      description: Address family.
  - element: pools
    scope: DHCPScope
    optional: true
    state: canonical
    description: Dynamic allocation ranges within the subnet.
    schema:
      type: array
      description: Dynamic allocation ranges within the subnet.
      items:
        type: object
        required:
          - start
          - end
        properties:
          start:
            type: string
            description: First address of the range.
          end:
            type: string
            description: Last address of the range.
  - element: options
    scope: DHCPScope
    optional: true
    state: canonical
    description: 'DHCP options (RFC 2132): routers, DNS servers, domain.'
    schema:
      type: object
      description: 'DHCP options (RFC 2132): routers, DNS servers, domain.'
      properties:
        router:
          type: string
          description: Default gateway (option 3).
        dns_servers:
          type: array
          items:
            type: string
          description: DNS servers (option 6).
        domain_name:
          type: string
          description: Domain name (option 15).
  - element: lease_time
    scope: DHCPScope
    optional: true
    state: canonical
    description: Default lease time in seconds.
    schema:
      type: integer
      minimum: 1
      description: Default lease time in seconds.
spec_examples:
  - subnet: 192.0.2.0/24
    ip_family: ipv4
    pools:
      - start: 192.0.2.100
        end: 192.0.2.200
    options:
      router: 192.0.2.1
      dns_servers:
        - 192.0.2.53
        - 198.51.100.53
      domain_name: example.com
    lease_time: 86400
outputs:
  reservations:
    type: array
    description: 'DERIVED — not authored here. A projection of every IPAddress(allocation: static) bound to a NetworkInterface
      (its MAC) contained by a host (its hostname), within this scope. The reservation truth lives on the IPAddress
      records (DCM ADR-023); a DHCP provider renders its reservations/leases from this set.'
relationships:
  - edge_type: depends_on
    target: Machine.BareMetalHost
    cardinality: 0..n
    name: dhcp_server_host
    description: Host(s) running the DHCP server(s) serving this scope (e.g. an HA pair).
  - edge_type: depends_on
    target: Machine.VM
    cardinality: 0..n
    name: dhcp_server_vm
    description: DHCP server(s) hosted on VMs.
adopts:
  - standard: RFC-2131
    version: '2131'
    standard_name: subnet
    role: DHCPv4 scope / pool / lease vocabulary
    source: https://www.rfc-editor.org/rfc/rfc2131
    license: IETF-Trust
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: ISC-Kea
    version: 2.x
    standard_name: subnet4
    role: reference implementation — one DHCP provider's subnet/pool/reservation model (MPL-2.0, referenced by name
      only, not the type's grounding)
    source: https://kea.readthedocs.io/
    license: MPL-2.0
    license_compatibility: reference-only
    disposition: tier1_value
context:
  purpose: Declares a subnet's DHCP configuration — dynamic pools, options, lease time — as the neutral surface
    any DHCP provider serves.
  plain_description: 'One subnet''s DHCP setup: the required `subnet` CIDR, the dynamic ranges leased from — `pools`
    here (start/end pairs; the allocation-side IPAddressPool calls its ranges `ranges`) — common `options` (router,
    dns_servers, domain_name), and `lease_time`. Reservations are not authored here — they are derived: every statically-allocated
    address record bound to an interface projects into this scope''s reservation list, so the fact that an address
    belongs to a MAC lives in exactly one place. The DHCP server software is a provider; this record is what it
    renders its config from.'
  use_when:
    - You need a subnet's dynamic ranges and options declared portably, independent of which DHCP server serves
      them.
    - You need static reservations to fall out of address records automatically instead of being maintained twice.
  not_for:
    - Allocation-side accounting of a range (who holds which address, is it exhausted) — IPAddressPool; the scope
      is service-side config. The two overlap on ranges by design, and both document it.
    - One address or reservation — IPAddress with static allocation; it projects into the scope.
  works_with:
    - IPAddress — the address records whose static allocations project into reservations.
    - AddressService — the operated service serving this scope.
    - Machine.BareMetalHost / Machine.VM — the servers the scope is served from.
