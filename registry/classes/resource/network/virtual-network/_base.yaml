metadata:
  display_name: Virtual Network
  description: 'A host- or cluster-scoped virtual network that workloads (VMs, pods) attach to — the attachment
    POINT between guest vNICs and the host L2 stack. Realized by e.g. a libvirt network (forward mode=bridge/nat/routed/isolated),
    a Kubernetes NetworkAttachmentDefinition (Multus/CNI), or an OVN logical switch — the vendor mechanism is the
    provider, never the type. Completes graph traversal guest → VirtualNetwork → (references) underlying bridge/uplink
    NetworkInterface → bond → NIC → switch. Consumers declare attachment by binds_to on the consumer side (a VM
    binds_to its VirtualNetwork), which implies depends_on: the network exists before the guest starts; guests stop
    before it tears down. A Base by the Base test (CLS-002): a Kubernetes NetworkAttachmentDefinition and a libvirt
    network are one forwarding contract — how guests reach a segment — so a virtual network is fillable by any host
    or cluster provider; host and overlay dialects (OVN, libvirt, bridge) are Types when they carry elements of
    their own. A VLAN is not a Type here: it is a fabric segment, a Base of its own.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-05T02:10:32Z'
elements:
  - element: zone
    scope: VirtualNetwork
    optional: true
    state: proposed
    description: What kind of network this is — a governed network-zone term, for placement only (common-elements.schema.json
      `network_zone_ref`).
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/network_zone_ref
  - element: tier
    scope: VirtualNetwork
    optional: true
    state: proposed
    description: How good this network is — a governed network_tier floor the provider reports (common-elements.schema.json
      `network_tier_ref`).
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/network_tier_ref
  - element: forward_mode
    scope: VirtualNetwork
    optional: true
    state: canonical
    description: How traffic leaves the virtual network (libvirt forward-mode vocabulary). bridge = transparent
      onto an underlying host bridge; nat/routed = via the host stack; isolated = no egress.
    schema:
      type: string
      enum:
        - bridge
        - nat
        - routed
        - isolated
      x-extensible-enum: true
      description: How traffic leaves the virtual network (libvirt forward-mode vocabulary). bridge = transparent
        onto an underlying host bridge; nat/routed = via the host stack; isolated = no egress.
  - element: autostart
    scope: VirtualNetwork
    optional: true
    state: canonical
    description: Network is activated with the host.
    schema:
      type: boolean
      description: Network is activated with the host.
  - element: identity
    scope: VirtualNetwork
    optional: true
    state: canonical
    description: Instance discriminators (SPEC-DESIGN-REQUIREMENTS §27).
    schema:
      type: object
      description: Instance discriminators (SPEC-DESIGN-REQUIREMENTS §27).
      properties:
        location:
          type: string
          description: The network's name on its host/cluster (e.g. 'host-bridge', 'default') — unique within the
            containing scope.
        role:
          type: string
          description: Semantic usage, e.g. workload | mgmt | test.
spec_examples:
  - forward_mode: bridge
    autostart: true
    identity:
      location: workload-br0
      role: workload
