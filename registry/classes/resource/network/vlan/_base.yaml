metadata:
  display_name: VLAN / Network Segment ID
  description: 'A fabric segment identifier: an IEEE 802.1Q VLAN or an overlay VNI (VXLAN, Geneve). A Base by the
    Base test (CLS-002): 802.1Q and the overlay encapsulations abstract over every fabric segment, so a segment
    of a given id and encapsulation is one deliverable any fabric provider realizes. A root resource: it is owned
    and advertised by a fabric provider or a platform data layer, and the resources that ride it (a VirtualNetwork,
    a NetworkInterface) select it by reference and never invent one.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-13T00:00:00Z'
elements:
  - element: zone
    scope: VLAN
    optional: true
    state: proposed
    description: What kind of network this is — a governed network-zone term, for placement only (common-elements.schema.json
      `network_zone_ref`).
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/network_zone_ref
  - element: tier
    scope: VLAN
    optional: true
    state: proposed
    description: How good this network is — a governed network_tier floor the provider reports (common-elements.schema.json
      `network_tier_ref`).
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/network_tier_ref
  - element: encapsulation
    scope: VLAN
    optional: false
    state: canonical
    description: 'Segmentation type: `vlan` (802.1Q), `vxlan` or `geneve` (overlay VNI), `flat` (untagged).'
    schema:
      type: string
      enum:
        - vlan
        - vxlan
        - geneve
        - flat
      description: 'Segmentation type: `vlan` (802.1Q), `vxlan` or `geneve` (overlay VNI), `flat` (untagged).'
  - element: segment_id
    scope: VLAN
    optional: true
    state: canonical
    description: The VLAN id (1–4094) or VNI (0–16777215). Omitted for flat.
    schema:
      type: integer
      minimum: 0
      maximum: 16777215
      description: The VLAN id (1–4094) or VNI (0–16777215). Omitted for flat.
  - element: name
    scope: VLAN
    optional: true
    state: canonical
    description: Human name for the segment (dmz).
    schema:
      type: string
      description: Human name for the segment (dmz).
