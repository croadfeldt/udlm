record_type: class
class: base
resource_type: Network
version: 1.1.0
family: Resource
status: active
metadata:
  authority: canonical
  display_name: Network Base Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-08-04T00:00:00Z'
  description: >-
    The Network category base. Carries what every network type shares and every network provider must
    be able to report — the first ADR-039 factoring wave for this family (#349).

elements:
- element: zone
  scope: Network
  optional: true
  state: proposed
  description: >-
    WHAT KIND OF NETWORK THIS IS — DMZ, management, internal, storage — as a governed TAXONOMY term
    (Knowledge.TaxonomyTerm), not a property bundle and not a floor.
    A CLASSIFICATION, NOT A REQUIREMENT, and the distinction is why this is a taxonomy where `tier`
    is reference data: a floor is something a second provider can MEET, a category is something a
    thing IS. Taxonomy is also the only one of the two that carries `normalization_rules`, which is
    what this needs — providers report `dmz-2`, `DMZ_RESTRICTED` and `dmz restricted`, and all three
    have to land on one canonical term before any policy can match on it.
    FOR PLACEMENT ONLY (maintainer ruling 2026-08-10). Nothing critical hangs off a zone directly:
    it is not an authorization, not a control, and not a boundary. ANYTHING REQUIRED BECAUSE OF A
    ZONE IS ENFORCED BY POLICY READING IT — the model carries the classification, policy acts on it,
    which is the same split that governs everything else here.
    That also keeps the model on the right side of zero-trust architecture, which derives no trust
    from network location (NIST SP 800-207); UDLM already ships a `zero_trust.posture` setting that a
    location-as-trust reading would contradict.
    ON THE BASE though it does not apply to every network type (maintainer ruling 2026-08-10): enough
    of the family carries a category that the base is the right home, and an element that some types
    leave unpopulated is what `optional` is for. Scope IS portability (ADR-038 §3) — a category two
    providers can both report is portable by definition.
    Provider-reported, like `tier`.
  schema:
    allOf:
    - $ref: ../../../data-reference.schema.json#/$defs/data_reference
    - required:
      - reference_data_type
      properties:
        reference_data_type:
          const: network_zone

- element: tier
  scope: Network
  optional: true
  state: proposed
  description: >-
    HOW GOOD THIS NETWORK IS — a reference to a governed `network_tier`, exactly parallel to
    `storage_tier`. Each term DENOTES A FLOOR (bandwidth, latency), so asking for a tier is asking
    for the floor and any network meeting it qualifies: one provider's "10G" and another's
    "high-throughput" are interchangeable iff both clear it. That is what keeps the intent portable —
    the match is against the floor, never the string.
    NAME-SELECTABLE BUT REQUIREMENTS-AUTHORITATIVE (ADR-036, ruled 2026-07-27): a consumer may select
    by tier name, explicit requirements win where both are given, and the provider records its native
    class as a realized output rather than something the consumer had to know.
    ON THE BASE, NOT A TYPE, because performance is expected to be consumable by ALL network class
    providers and portable (maintainer ruling 2026-08-10). Scope IS portability (ADR-038 §3), so the
    category base is where a fact every provider must report belongs.
    Provider-reported at registration or discovery — the party that knows is the one that says.
  schema:
    allOf:
    - $ref: ../../../data-reference.schema.json#/$defs/data_reference
    - required:
      - reference_data_type
      properties:
        reference_data_type:
          const: network_tier
