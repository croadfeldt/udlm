  license: IEEE
  license_compatibility: reference-only
  disposition: tier1_value
- standard: RFC 8345
  version: '8345'
  standard_name: ietf-network (node)
  role: topology vocabulary — a switch is a node whose termination points (ports) anchor links
  source: https://www.rfc-editor.org/rfc/rfc8345
  license: IETF-Trust-TLP
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: Models a physical network switch as a managed asset — the fabric peer of a bare-metal host,
    with its ports as contained interface records.
  plain_description: 'One physical L2/L3 switch: chassis identity keyed by its LLDP chassis id (normally
    the chassis MAC — stable and discoverable), a port rollup — the `ports` object (count, predominant
    speed) — and its management VLAN by reference (`management_vlan_ref`; the switch record carries no
    management address of its own — addresses live on its interface records). Identity facts — the `chassis_id`,
    serial, model, manufacturer, system name — nest under the `identity` block, not at the top level.
    Its individual ports are not a separate type — they are Hardware.NetworkInterface records contained
    by the switch, the same type host NICs use, which is what lets a cable be a single edge between two
    interface records. A switch can enter the model as discovered (via LLDP) before being formally adopted;
    vendor specifics stay with the provider.'
  use_when:
  - You need the switching fabric in the dependency graph so connectivity-outlives-compute is derivable
    in shutdown ordering.
  - You need per-port records (VLAN membership, host adjacency) on real switch hardware.
  - You need brownfield discovery — switches found via LLDP, then adopted.
  not_for:
  - A software bridge on a host — Hardware.NetworkInterface with device_class bridge.
  - The routed/NAT edge — Network.Gateway.
  - The VLAN segments themselves — Network.VLAN; the switch carries segments, it doesn't define them.
  works_with:
  - Hardware.NetworkInterface — its ports, and the host NICs those ports connect to.
  - Facility.PowerFeed — the power the switch draws; UPS-backed fabric stops last.
  - Network.VLAN — segments carried on the fabric, including the referenced management VLAN.
