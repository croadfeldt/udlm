metadata:
  display_name: Network Switch
  description: 'A physical L2/L3 network switch as a managed ASSET — the network-fabric peer of Compute.BareMetalHost.
    Its ports are Hardware.NetworkInterface components contained_by it (the same type serves host NICs
    and switch ports; §27 Identity distinguishes instances), with the §26 rollup on `ports`. Host NIC
    ↔ switch port physical links are the NetworkInterface `connects_to` adjacency (renamed from connected_to,
    common-elements §9; LLDP-discovered), which is what makes the estate graph traversable host → NIC
    → port → switch → power. Can exist unallocated (lifecycle_state: available, §28) and enter as Discovered
    via LLDP (brownfield ingest-then-adopt). Vendor specifics are the provider/extension, never the type.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-04T20:12:42Z'
  converted_from: flat spec Network.Switch@0.4.4 (bulk mechanical conversion 2026-08-04; factoring later
    via scope promotion)
elements:
- element: lifecycle_state
  scope: Network.Switch
  optional: true
  state: canonical
  description: Allocation state (common-elements §6, §28). available = inventoried/unallocated; allocated
    = adopted into the managed lifecycle.
  schema:
    type: string
    enum:
    - available
    - allocated
    - retired
    description: Allocation state (common-elements §6, §28). available = inventoried/unallocated; allocated
      = adopted into the managed lifecycle.
- element: composition_visibility
  scope: Network.Switch
  optional: true
  state: canonical
  description: Whether ports are modeled as first-class Hardware.NetworkInterface entities (§26). opaque
    = the `ports` rollup only; transparent/selective = ports addressable individually (required for connects_to
    link records).
  schema:
    type: string
    enum:
    - opaque
    - transparent
    - selective
    description: Whether ports are modeled as first-class Hardware.NetworkInterface entities (§26). opaque
      = the `ports` rollup only; transparent/selective = ports addressable individually (required for
      connects_to link records).
- element: identity
  scope: Network.Switch
  optional: true
  state: canonical
  description: Chassis identity (SPEC-DESIGN-REQUIREMENTS §27).
  schema:
    type: object
    description: Chassis identity (SPEC-DESIGN-REQUIREMENTS §27).
    properties:
      chassis_id:
        type: string
        description: LLDP chassis identifier — normally the chassis MAC (IEEE 802.1AB Chassis ID TLV).
          Primary discovered-identity key; stable across renames/re-IPs.
      serial_number:
        type: string
        description: Vendor serial.
      asset_tag:
        type: string
      manufacturer:
        type: string
      model:
        type: string
      system_name:
        type: string
        description: Configured system name (LLDP System Name TLV) — mutable, secondary to chassis_id.
- element: ports
  scope: Network.Switch
  optional: true
  state: canonical
  description: Reconciled port rollup (§26) — aggregate of contained Hardware.NetworkInterface when modeled.
  schema:
    type: object
    description: Reconciled port rollup (§26) — aggregate of contained Hardware.NetworkInterface when
      modeled.
    properties:
      count:
        type: integer
        minimum: 1
        description: Physical port count.
      speed:
        type: string
        pattern: ^[0-9]+(Mbps|Gbps|Tbps)$
        description: Predominant port speed, e.g. 1Gbps.
- element: management_vlan_ref
  scope: Network.Switch
  optional: true
  state: canonical
  description: Reference to Network.VLAN — the switch's management VLAN. Common-elements Reference shape
    (handle string or {uuid, handle} object); resolvable and policy-walkable, never an opaque string.
  schema:
    description: Reference to Network.VLAN — the switch's management VLAN. Common-elements Reference shape
      (handle string or {uuid, handle} object); resolvable and policy-walkable, never an opaque string.
    $ref: ../../common-elements.schema.json#/$defs/Reference
