metadata:
  display_name: Log Shipper
  description: 'An outcome: one resource''s logs reach a log store, filtered and tagged with the resource''s identity.
    A Base by the Base test (CLS-002): RFC 9742 (the IETF syslog management model), Redfish EventDestination and
    the OpenTelemetry Collector each treat "send this system''s logs to a collector, filtered" as one deliverable,
    and a host agent, a BMC, a switch or a cluster forwarder can all fill it. The wire protocol is the Type tier
    (LogShipper.Syslog, LogShipper.OTLP). The mechanism (a configuration-management role, a device setting, a
    cluster forwarder) is the provider''s; swapping it never touches this contract. What is shipped is chosen by
    a criterion over the log record''s fields, the same kind a LogStore uses to decide how long to keep it.'
  maintainer: udlm-registry
  origination_timestamp: '2026-06-18T13:14:58Z'
elements:
  - element: source
    scope: LogShipper
    optional: true
    state: canonical
    description: 'Which logs: the systemd journal (default), on-disk files, the device''s own log (`native`, for
      appliances, BMCs and switches that send their own syslog), container logs, or audit logs.'
    schema:
      type: string
      enum:
        - journal
        - files
        - native
        - containers
        - audit
      x-extensible-enum: true
      description: 'Which logs: the systemd journal (default), on-disk files, the device''s own log (`native`, for
        appliances, BMCs and switches that send their own syslog), container logs, or audit logs.'
  - element: filter
    scope: LogShipper
    optional: true
    state: canonical
    description: 'Which lines to ship, as two criteria over the log record (identifier-scheme §9.7): `include`
      (absent: every line) and `exclude` (absent: none). A line ships when it matches `include` and not `exclude`.
      The outcome is what is promised: lines outside the filter never reach the store. A provider whose sender
      cannot evaluate a criterion (a BMC filters by facility and severity only) filters before the store or refuses
      at placement; it never stores more than was asked for.'
    schema:
      type: object
      additionalProperties: false
      properties:
        include:
          $ref: ../../../../common-elements.schema.json#/$defs/LogRecordCriterion
        exclude:
          $ref: ../../../../common-elements.schema.json#/$defs/LogRecordCriterion
      description: 'Which lines to ship, as two criteria over the log record (identifier-scheme §9.7): `include`
        (absent: every line) and `exclude` (absent: none). A line ships when it matches `include` and not `exclude`.
        The outcome is what is promised: lines outside the filter never reach the store. A provider whose sender
        cannot evaluate a criterion (a BMC filters by facility and severity only) filters before the store or
        refuses at placement; it never stores more than was asked for.'
  - element: labels
    scope: LogShipper
    optional: true
    state: canonical
    description: 'Extra resource attributes stamped on every message, named per the OpenTelemetry semantic
      conventions (`deployment.environment`, `service.name`). The provider always stamps the target''s `host.name`
      and `udlm.handle` itself, so a log line can be followed back to its record.'
    schema:
      type: object
      additionalProperties:
        type: string
      description: 'Extra resource attributes stamped on every message, named per the OpenTelemetry semantic
        conventions (`deployment.environment`, `service.name`). The provider always stamps the target''s
        `host.name` and `udlm.handle` itself, so a log line can be followed back to its record.'
spec_examples:
  - source: journal
    filter:
      include: severity_number=ge=9
      exclude: resource.service.name==systemd-logind
    labels:
      deployment.environment: production
outputs:
  last_shipped_at:
    type: string
    description: OBSERVED — a provider-watched liveness fact, not derivable from model records (no shipment-instance
      records exist; this is heartbeat, not history). Timestamp of the most recent message the store received
      from this target (RFC 3339) — drives staleness detection.
relationships:
  - edge_type: binds_to
    name: sink
    target: LogStore
    cardinality: 1..1
    description: The log store the logs go to. The shipper binds the store's published `intake_endpoints` output
      that matches its protocol, so moving the store's receiver changes one record, not every shipper.
  - edge_type: contained_by
    name: host
    target: Machine
    cardinality: 0..1
    description: The machine whose logs are shipped (a VM or a bare-metal host). Exactly one of host, bmc, switch,
      gateway or cluster is set.
  - edge_type: contained_by
    name: bmc
    target: BMC
    cardinality: 0..1
    description: The baseboard management controller whose own log is shipped (`source` native).
  - edge_type: contained_by
    name: switch
    target: NetworkSwitch
    cardinality: 0..1
    description: The switch whose own log is shipped (`source` native).
  - edge_type: contained_by
    name: gateway
    target: NetworkGateway
    cardinality: 0..1
    description: The gateway whose own log is shipped (`source` native).
  - edge_type: contained_by
    name: cluster
    target: KubernetesCluster
    cardinality: 0..1
    description: The cluster whose container, node or audit logs are shipped by a cluster-level forwarder.
adopts:
  - standard: OpenTelemetry
    version: '>=1.0'
    standard_name: Semantic conventions (resource attributes) and Logs Data Model
    role: the attribute names in `labels`, the identity the provider stamps (`host.name`), and the log record
      fields a `filter` criterion addresses
    source: https://opentelemetry.io/docs/specs/semconv/
    license: Apache-2.0
    license_compatibility: compatible_reference
    disposition: tier1_value
coverage:
  use_cases:
    - observability/deploy-log-shipper
    - observability/log-shipper-sink-unreachable-refused
    - observability/estate-logs-reach-one-store
  flows:
