context:
  purpose: Declares the outcome that a resource's logs reach a log store, without saying anything about how.
  plain_description: 'A statement of outcome: logs from one resource (a machine, a BMC, a switch, a gateway or a
    cluster, named by a `contained_by` edge) reach a log store (the `sink` edge), filtered by `source` and a
    `filter` criterion, and tagged with the resource''s identity. The protocol is chosen by the Type: Syslog or OTLP.
    The consumer never sees the mechanism; whether a provider satisfies it with an automation-managed agent, a
    device setting or a cluster forwarder is the provider''s business, and swapping mechanisms changes nothing in
    this record. Realized state reports whether shipping is healthy and when the store last heard from the
    target, which drives staleness detection.'
  use_when:
    - You need logs-from-resource-X-land-in-the-store as a declared, checkable fact per resource.
    - You need shipping health and last-delivery time surfaced for drift and staleness detection.
  not_for:
    - The log store itself — that is LogStore; this class binds to it.
    - Metrics or trace collection — not covered; this class is logs.
  works_with:
    - Machine / BMC / NetworkSwitch / NetworkGateway / KubernetesCluster — the resource whose logs are shipped.
    - LogStore — where the logs go; its published intake is what the shipper binds.
