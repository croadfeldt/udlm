metadata:
  display_name: Log Shipper
  description: 'An outcome: one resource''s logs reach a log store, filtered and tagged with the resource''s identity.
    A Base by the Base test (CLS-002): RFC 9742 (the IETF syslog management model), Redfish EventDestination and
    the OpenTelemetry Collector each treat "send this system''s logs to a collector, filtered" as one deliverable,
    and a host agent, a BMC, a switch or a cluster forwarder can all fill it. The wire protocol is the Type tier
    (LogShipper.Syslog, LogShipper.OTLP). The mechanism (a configuration-management role, a device setting, a
    cluster forwarder) is the provider''s; swapping it never touches this contract.'
  maintainer: udlm-registry
  origination_timestamp: '2026-06-18T13:14:58Z'
elements:
  - element: source
    scope: LogShipper
    optional: true
    state: canonical
    description: 'Which logs: the systemd journal (default), on-disk files, the device''s own log (`native`, for
      appliances, BMCs and switches that send their own syslog), container logs, or audit logs.'
    schema:
      type: string
      enum:
        - journal
        - files
        - native
        - containers
        - audit
      description: 'Which logs: the systemd journal (default), on-disk files, the device''s own log (`native`, for
        appliances, BMCs and switches that send their own syslog), container logs, or audit logs.'
  - element: min_severity
    scope: LogShipper
    optional: true
    state: canonical
    description: 'Ship messages at this severity and above, named as in RFC 5424 and compared as in RFC 9742
      ("equals-or-higher"). OpenTelemetry maps the same names onto its severity numbers, so the filter means the
      same thing on either protocol. Absent ships everything.'
    schema:
      type: string
      enum:
        - emergency
        - alert
        - critical
        - error
        - warning
        - notice
        - informational
        - debug
      description: 'Ship messages at this severity and above, named as in RFC 5424 and compared as in RFC 9742
        ("equals-or-higher"). OpenTelemetry maps the same names onto its severity numbers, so the filter means
        the same thing on either protocol. Absent ships everything.'
  - element: labels
    scope: LogShipper
    optional: true
    state: canonical
    description: 'Extra resource attributes stamped on every message, named per the OpenTelemetry semantic
      conventions (`deployment.environment`, `service.name`). The provider always stamps the target''s `host.name`
      and `udlm.handle` itself, so a log line can be followed back to its record.'
    schema:
      type: object
      additionalProperties:
        type: string
      description: 'Extra resource attributes stamped on every message, named per the OpenTelemetry semantic
        conventions (`deployment.environment`, `service.name`). The provider always stamps the target''s
        `host.name` and `udlm.handle` itself, so a log line can be followed back to its record.'
spec_examples:
  - source: journal
    min_severity: informational
    labels:
      deployment.environment: production
outputs:
  status:
    type: string
    description: Realized health of the shipper (e.g. running / degraded), as reported by discovery.
  shipping_to:
    type: string
    description: The intake endpoint the shipper is delivering to, resolved from the store's published intake
      (echo of realized config).
  last_shipped_at:
    type: string
    description: OBSERVED — a provider-watched liveness fact, not derivable from model records (no shipment-instance
      records exist; this is heartbeat, not history). Timestamp of the most recent message the store received
      from this target (RFC 3339) — drives staleness detection.
relationships:
  - edge_type: binds_to
    name: sink
    target: LogStore
    cardinality: 1..1
    description: The log store the logs go to. The shipper binds the store's published `intake_endpoints` output
      that matches its protocol, so moving the store's receiver changes one record, not every shipper.
  - edge_type: contained_by
    name: host
    target: Machine
    cardinality: 0..1
    description: The machine whose logs are shipped (a VM or a bare-metal host). Exactly one of host, bmc, switch,
      gateway or cluster is set.
  - edge_type: contained_by
    name: bmc
    target: BMC
    cardinality: 0..1
    description: The baseboard management controller whose own log is shipped (`source` native).
  - edge_type: contained_by
    name: switch
    target: NetworkSwitch
    cardinality: 0..1
    description: The switch whose own log is shipped (`source` native).
  - edge_type: contained_by
    name: gateway
    target: NetworkGateway
    cardinality: 0..1
    description: The gateway whose own log is shipped (`source` native).
  - edge_type: contained_by
    name: cluster
    target: KubernetesCluster
    cardinality: 0..1
    description: The cluster whose container, node or audit logs are shipped by a cluster-level forwarder.
adopts:
  - standard: RFC-5424
    version: '2009'
    standard_name: Syslog severity
    role: the severity names `min_severity` uses
    source: https://www.rfc-editor.org/rfc/rfc5424
    license: IETF Trust
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: RFC-9742
    version: '2025'
    standard_name: ietf-syslog severity filter
    role: the equals-or-higher comparison `min_severity` applies
    source: https://www.rfc-editor.org/rfc/rfc9742
    license: IETF Trust
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: OpenTelemetry
    version: '>=1.0'
    standard_name: Semantic conventions (resource attributes) and Logs Data Model
    role: the attribute names in `labels` and the identity the provider stamps (`host.name`)
    source: https://opentelemetry.io/docs/specs/semconv/
    license: Apache-2.0
    license_compatibility: compatible-reference
    disposition: tier1_value
coverage:
  use_cases:
    - observability/deploy-log-shipper
    - observability/log-shipper-sink-unreachable-refused
    - observability/estate-logs-reach-one-store
  flows:
    - docs/flows/log-shipping-lifecycle.md
context:
  purpose: Declares the outcome that a resource's logs reach a log store, without saying anything about how.
  plain_description: 'A statement of outcome: logs from one resource (a machine, a BMC, a switch, a gateway or a
    cluster, named by a `contained_by` edge) reach a log store (the `sink` edge), filtered by `source` and
    `min_severity`, and tagged with the resource''s identity. The protocol is chosen by the Type: Syslog or OTLP.
    The consumer never sees the mechanism; whether a provider satisfies it with an automation-managed agent, a
    device setting or a cluster forwarder is the provider''s business, and swapping mechanisms changes nothing in
    this record. Realized state reports whether shipping is healthy and when the store last heard from the
    target, which drives staleness detection.'
  use_when:
    - You need logs-from-resource-X-land-in-the-store as a declared, checkable fact per resource.
    - You need shipping health and last-delivery time surfaced for drift and staleness detection.
  not_for:
    - The log store itself — that is LogStore; this class binds to it.
    - Metrics or trace collection — not covered; this class is logs.
  works_with:
    - Machine / BMC / NetworkSwitch / NetworkGateway / KubernetesCluster — the resource whose logs are shipped.
    - LogStore — where the logs go; its published intake is what the shipper binds.
