metadata:
  display_name: Workload
  description: 'A running service composed of containers and/or systemd units, with replicas and endpoints, that
    a provider realizes and manages. A Base by the Base test (CLS-002): the Open Application Model workload, TOSCA''s
    node and Kubernetes workload resources abstract over a running set of constituents, so an order placed here
    is fillable by a Kubernetes provider, a podman host or a systemd host alike. Named for the thing a provider
    yields, not the act it renders (a Service is the act). Secrets are never inline; env and mounts reference a
    CredentialRef.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-12T00:00:00Z'
elements:
  - element: service_kind
    scope: Workload
    optional: false
    state: canonical
    description: 'Coarse classification for grouping and ordering: `application`, `infrastructure-daemon` (shuts
      down after applications), `database`, `gateway`, `registry`, `monitoring`, `fleet-manager` (the multi-cluster
      management plane; shuts down after the clusters it manages), `other`.'
    schema:
      type: string
      enum:
        - application
        - infrastructure-daemon
        - database
        - gateway
        - registry
        - monitoring
        - fleet-manager
        - other
      description: 'Coarse classification for grouping and ordering: `application`, `infrastructure-daemon` (shuts
        down after applications), `database`, `gateway`, `registry`, `monitoring`, `fleet-manager` (the multi-cluster
        management plane; shuts down after the clusters it manages), `other`.'
  - element: constituents
    scope: Workload
    optional: true
    state: canonical
    description: 'The workloads that make up the service: a Container by reference, or a host plus its systemd units.'
    schema:
      type: array
      description: 'The workloads that make up the service: a Container by reference, or a host plus its systemd
        units.'
      items:
        type: object
        additionalProperties: false
        properties:
          form:
            type: string
            enum:
              - container
              - systemd
          container_ref:
            description: Reference to Container — the container realizing this constituent. Common-elements Reference
              shape (handle string or {uuid, handle} object); resolvable and policy-walkable, never an opaque string.
            $ref: ../../../../common-elements.schema.json#/$defs/Reference
          host:
            type: string
            description: handle of the host/VM the systemd units run on (form=systemd).
          units:
            type: array
            items:
              type: string
            description: systemd unit names (form=systemd).
        required:
          - form
  - element: endpoints
    scope: Workload
    optional: true
    state: canonical
    description: How the service is reached (a route, URL or host:port), as the provider reports it.
    schema:
      type: array
      description: How the service is reached (a route, URL or host:port), as the provider reports it.
      items:
        type: object
        additionalProperties: false
        properties:
          name:
            type: string
          url:
            type: string
          port:
            type: integer
  - element: replicas
    scope: Workload
    optional: true
    state: canonical
    description: Desired instance count; 0 means intentionally scaled down.
    schema:
      type: integer
      description: Desired instance count; 0 means intentionally scaled down.
spec_examples:
  - service_kind: application
    constituents:
      - form: container
        container_ref: estate/storefront-web?resource_type==Container
    endpoints:
      - name: https
        url: https://storefront.svc.internal
        port: 443
    replicas: 3
outputs:
  ready:
    type: boolean
    description: Whether the service's constituents are up and serving (Realized/Discovered).
relationships:
  - edge_type: references
    name: runs_on
    target: KubernetesCluster
    cardinality: 0..1
    description: Runs on a cluster (its container constituents are scheduled there). TOSCA HostedOn.
  - edge_type: references
    name: runs_on
    target: Machine.BareMetalHost
    cardinality: 0..1
    description: Or runs directly on a host (native systemd units / rootless containers).
  - edge_type: references
    name: runs_on
    target: Machine.VM
    cardinality: 0..1
    description: Or runs inside a VM.
  - edge_type: references
    name: uses_storage
    target: Volume
    cardinality: 0..n
    description: External storage the service uses (also StorageCluster / FileShare). TOSCA DependsOn.
  - edge_type: depends_on
    name: requires
    target: Workload
    cardinality: 0..n
    description: Service-to-service dependency (strength hard|soft) — e.g. an app requiring an auth service.
  - edge_type: depends_on
    name: requires
    target: DirectoryService
    cardinality: 0..n
    description: Requires a directory/identity service — strength hard|soft.
  - edge_type: depends_on
    name: requires
    target: AddressService
    cardinality: 0..n
    description: Requires a DNS/DHCP address service — strength hard|soft.
  - edge_type: binds_to
    target: Database
    cardinality: 0..n
    description: Binds to a database's connection outputs. TOSCA BindsTo.
  - edge_type: references
    target: CredentialRef
    cardinality: 0..n
    description: Secrets consumed by the service's constituents — no secret material inline (DCM ADR-023).
adopts:
  - standard: OASIS TOSCA
    version: '1.3'
    standard_name: ServiceTemplate / node composition + HostedOn·DependsOn·BindsTo
    role: service-as-composed-nodes shape and the typed relationship vocabulary for runs_on / requires / binds_to
    source: https://docs.oasis-open.org/tosca/TOSCA-Simple-Profile-YAML/v1.3/
    license: OASIS
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: Open Application Model
    version: '>=0.3'
    standard_name: Application (set of Components)
    role: grounds `constituents[]` — an application is a set of component workloads, one level up from Container
    source: https://oam.dev/
    license: MIT
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: Kubernetes
    version: '>=1.29'
    standard_name: Workload objects (Deployment/StatefulSet/DaemonSet, KServe InferenceService)
    role: realization vocabulary for Kubernetes-hosted services — naturalized by the provider, not restated
    source: https://kubernetes.io/docs/concepts/workloads/
    license: CC-BY-4.0
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Models a logical running service — one or more containers and/or systemd units acting as one thing —
    so application-level dependencies carry order.
  plain_description: 'The application layer: the mail service, the registry, model serving — a named service, classified
    by its required `service_kind` (application, infrastructure-daemon, database, and kin), composed of `constituents`
    that each declare their `form`: a `container` constituent references its container record via `container_ref`;
    a `systemd` constituent names its `host` and `units`. It declares what the service needs — a database, a directory,
    name service, storage, another service, each dependency hard or soft — which is what makes infrastructure-daemons-stop-after-applications
    derivable. Endpoints and a ready signal surface how it is reached and whether it is serving.'
  use_when:
    - You need an application composed of several workloads treated as one node with one dependency surface.
    - You need service-to-service and service-to-infrastructure dependencies (with hard/soft strength) to drive
      shutdown/startup order.
    - You need host services (systemd units) and containerized services modeled uniformly.
  not_for:
    - A single container's runtime spec — Container; the service references containers as constituents.
    - A bounded-runtime task — Job.
    - The database a service uses — Database, referenced as a dependency.
  works_with:
    - Container — containerized constituents, by reference.
    - KubernetesCluster / Machine.BareMetalHost / Machine.VM — where the constituents run.
    - Database / DirectoryService / AddressService — what the service requires.
    - CredentialRef — the service's secrets, by reference.
