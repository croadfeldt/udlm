metadata:
  display_name: Template — the orderable composition
  maintainer: UDLM project
  origination_timestamp: '2026-08-10T00:00:00Z'
  description: 'An orderable composition: a unit assembled from other classes and references, declared once and
    realized many times. The Base carries only the composition mechanism — the sovereignty floor the whole must
    hold and the non-isolating groupings its parts join — and declares no constituents, because a Base says what
    a composition is, not what one contains. outputs-exempt: a Template is a definition realized many times; the
    composite it realizes carries the outputs.'
elements:
  - element: sovereignty_floor
    scope: Template
    optional: true
    state: proposed
    description: The sovereignty requirement the whole composition must hold, realized onto each constituent's `sovereignty`
      block at placement. A joint constraint is evaluable only once every placement is known, so a cohesion failure
      re-places rather than corrects after the fact.
    schema:
      type: object
      additionalProperties: false
      properties:
        zone:
          type: string
          format: udlm-ref-url
          description: 'The SovereigntyZone this composition must be placed within — a reference to a `Knowledge/SovereigntyZone`
            record, which declares what the coined zone name means in ISO 3166 terms so the residency-subsumption
            match is computable rather than assumed. Never a bare coined string: a name without a declared meaning
            gives an auditor no answer.'
        classification:
          type: string
          description: 'The data-classification floor the placement must satisfy. The vocabulary is a free string
            today and should be a governed one — the same hole `zone` had before its class existed, tracked at #472
            — so a peer reading `restricted` learns only the word.'
        cohesion:
          type: string
          enum:
            - same_zone
            - per_constituent
          description: 'same_zone = every constituent must land in ONE zone satisfying the floor, a JOINT constraint
            over the placement set. per_constituent = each satisfies the floor independently. No default: which
            one applies is the composition author''s decision and UDLM ships no defaults (NDF-001).'
      description: The sovereignty requirement the whole composition must hold, realized onto each constituent's
        `sovereignty` block at placement. A joint constraint is evaluable only once every placement is known, so
        a cohesion failure re-places rather than corrects after the fact.
  - element: groupings
    scope: Template
    optional: true
    state: proposed
    description: Additional non-isolating groupings the realized constituents join (cost center, project, business
      unit). Never the composite's own grouping, which derives from its uuid, and never a tenant, which is an isolation
      border carried on the realized entity.
    schema:
      type: array
      items:
        type: string
        format: udlm-ref-url
      description: Additional non-isolating groupings the realized constituents join (cost center, project, business
        unit). Never the composite's own grouping, which derives from its uuid, and never a tenant, which is an
        isolation border carried on the realized entity.
coverage:
  use_cases:
    - software/composite-app-service-with-database
    - architecture/solution-architecture-decomposition
  flows:
    - docs/flows/application-tier-provisioning.md
context:
  purpose: Declares a consumable composition — the mechanism by which an orderable unit is assembled from other
    classes and references, declared once and realized many times.
  plain_description: 'The thing on a menu that is made of other things. The Base carries only the composition mechanism:
    the sovereignty floor every realization must sit within, and the groupings a realization joins. What it composes
    is on the Type (Template.Application and kin).'
  use_when:
    - You need the composition floor without saying what kind of thing is composed.
  not_for:
    - An application stack — that is Template.Application.
    - A single resource — order its class directly.
  works_with:
    - Template.Application — the Type that says what is composed.
    - SovereigntyZone — what the floor names.
spec_examples:
  - sovereignty_floor:
      zone: eu-west
    groupings:
      - org/resource-group/example-orders-deployment
