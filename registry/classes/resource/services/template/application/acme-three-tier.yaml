$id: https://udlm.dev/registry/udlm/0.1/class/Template.Application.AcmeThreeTier/0.2.3
conforms_to: udlm/0.1
uuid: f2cdec7e-b363-43be-b020-aefc9f3d8e10
record_type: class
class: provider
resource_type: Template.Application.AcmeThreeTier
parent: Template.Application
version: 0.2.3
family: Resource
status: active
metadata:
  display_name: Acme three-tier web application
  maintainer: cexample platform engineering
  origination_timestamp: '2026-08-10T00:00:00Z'
  description: 'A web tier, an application tier and a database, provisioned and reconciled as one unit. The shape
    is fixed and the sizing is the consumer''s to choose: the worked answer to "you cannot order a three-tier application".'
composition_visibility: transparent
promoted_from: udlm://composition/cexample/compositions/three-tier-web-app
constituents:
  - component_id: db
    resource_type: Database
    provided_by: external
    failure_effect: required
    edge_type: contained_by
    spec_defaults:
      engine: postgresql
  - component_id: app
    resource_type: Container
    provided_by: external
    failure_effect: required
    edge_type: contained_by
    depends_on:
      - db
    bindings:
      - from_component: db
        output: connection_string
        to_field: env.DATABASE_URL
  - component_id: web
    resource_type: Container
    provided_by: external
    failure_effect: required
    edge_type: contained_by
    depends_on:
      - app
elements:
  - element: tier_size
    scope: Template.Application.AcmeThreeTier
    optional: false
    state: proposed
    description: 'Sizing for the application and web tiers, as named shapes rather than a numeric range: a capacity
      plan stands behind each.'
    schema:
      type: string
      enum:
        - small
        - medium
        - large
      description: 'Sizing for the application and web tiers, as named shapes rather than a numeric range: a capacity
        plan stands behind each.'
    supports:
      - values:
          - small
          - medium
          - large
  - element: database_capacity
    scope: Template.Application.AcmeThreeTier
    optional: false
    state: proposed
    description: 'Storage for the database tier, offered per `tier_size`: a value can be individually supported
      and still be an invalid combination.'
    schema:
      type: string
      pattern: ^[0-9]+(Gi|Ti)$
      description: 'Storage for the database tier, offered per `tier_size`: a value can be individually supported
        and still be an invalid combination.'
    supports:
      - values:
          - 10Gi
          - 50Gi
        when:
          tier_size: small
      - values:
          - 50Gi
          - 100Gi
          - 500Gi
        when:
          tier_size: medium
      - values:
          - 500Gi
          - 1Ti
          - 4Ti
        when:
          tier_size: large
  - element: exposure
    scope: Template.Application.AcmeThreeTier
    optional: false
    state: proposed
    description: Acme offers internal and private-network exposure; public is not offered.
    schema:
      type: string
      enum:
        - internal
        - private_network
      description: Acme offers internal and private-network exposure; public is not offered.
    supports:
      - values:
          - internal
          - private_network
  - element: transport_security
    scope: Template.Application.AcmeThreeTier
    optional: true
    state: proposed
    description: Acme requires TLS on private-network exposure and offers it on internal.
    schema:
      type: boolean
      default: true
      description: Acme requires TLS on private-network exposure and offers it on internal.
    supports:
      - values:
          - true
        when:
          exposure: private_network
      - values:
          - true
          - false
        when:
          exposure: internal
coverage:
  use_cases:
    - software/composite-app-service-with-database
    - architecture/solution-architecture-decomposition
  flows:
    - docs/flows/application-tier-provisioning.md
