status: active
metadata:
  display_name: Application Template
  maintainer: UDLM project
  origination_timestamp: '2026-08-10T00:00:00Z'
  description: 'The application kind of composition: a service a consumer uses, assembled from compute, data and
    network parts provisioned and maintained together. It yields a maintained thing that keeps running and reconciles,
    which separates it from a composition whose outcome is a run that completes.'
context:
  purpose: Let a consumer order an application as ONE thing — the whole shape, wired, placed and reconciled together
    — instead of ordering the parts and re-deriving how they connect every time.
  plain_description: A ready-made application shape. Somebody who knows how the pieces fit wrote it down once; you
    order it, choose the few things that are yours to choose, and get a running application.
  use_when:
    - An application is ordered repeatedly and its shape should not be re-derived per order
    - The parts must be placed, reconciled and decommissioned as a unit rather than individually
    - A sovereignty or grouping requirement applies to the WHOLE rather than to each part
  not_for:
    - A single resource with no parts — order the resource class directly
    - Work whose outcome is a run that completes rather than a thing that keeps running; that is a terminal-yield
      category, which must declare a bounded execution time and this one cannot
    - Recording a composition nobody is offering — an ingested diagram or a consumer's own bundle is a composition
      record, which never mints a class into the shared vocabulary
  works_with:
    - the provider tier beneath this class, which carries the actual constituents and the `supports` ranges a consumer
      picks from
    - a realized System, whose `tenant_uuid`, sovereignty and edges are written at placement
elements:
  - element: high_availability
    scope: Template.Application
    optional: true
    state: proposed
    description: 'Whether the application is composed to survive the loss of one fault domain: a property of the
      whole, not a rollup of its parts, since a constituent may be redundant while the application still fails as
      a unit. Constrains placement and the constituents a provider may offer; never asserts the requirement was
      met.'
    schema:
      type: boolean
      description: 'Whether the application is composed to survive the loss of one fault domain: a property of the
        whole, not a rollup of its parts, since a constituent may be redundant while the application still fails
        as a unit. Constrains placement and the constituents a provider may offer; never asserts the requirement
        was met.'
  - element: exposure
    scope: Template.Application
    optional: false
    state: proposed
    description: 'How the application is reachable, as portable intent: `internal`, `private`, `public`. Never a
      hostname, a load balancer or an ingress class.'
    schema:
      type: string
      enum:
        - internal
        - private_network
        - public
      description: 'How the application is reachable, as portable intent: `internal`, `private`, `public`. Never
        a hostname, a load balancer or an ingress class.'
  - element: release_channel
    scope: Template.Application
    optional: true
    state: proposed
    description: 'The release stream the application tracks: a governed vocabulary, since channels change without
      a spec edit.'
    values:
      reference_data_type: release_channel
    schema:
      type: string
      description: 'The release stream the application tracks: a governed vocabulary, since channels change without
        a spec edit.'
  - element: transport_security
    scope: Template.Application
    optional: true
    state: proposed
    description: Whether transport encryption is required of the realized exposure. A requirement, not a certificate;
      the certificate is a CredentialRef constituent.
    schema:
      type: boolean
      description: Whether transport encryption is required of the realized exposure. A requirement, not a certificate;
        the certificate is a CredentialRef constituent.
spec_examples:
  - high_availability: true
    exposure: private_network
    transport_security: true
    sovereignty_floor:
      zone: udlm://knowledge/sovereignty-zone/eu-west
      classification: restricted
      cohesion: same_zone
    groupings:
      - udlm://access/grouping/cost-center-retail
outputs:
  endpoint:
    type: string
    description: 'Where the realized application is reached — the address a consumer or a downstream binding uses.
      Published by the composition rather than by any constituent: which part terminates traffic is an internal
      arrangement the consumer must not have to know, and it may change between provider projections of the same
      application without the endpoint changing.'
coverage:
  use_cases:
    - software/composite-app-service-with-database
    - architecture/solution-architecture-decomposition
  flows:
    - docs/flows/application-tier-provisioning.md
