metadata:
  display_name: BIOS Profile
  description: 'A reusable desired firmware/BIOS configuration a fleet of hosts converge to ("synced across
    systems"). ADOPTS DMTF Redfish (Bios Attributes + BiosAttributeRegistry) by reference: UDLM carries
    identity, the version-pinned registry pointer (binding), and the apply method; the attribute schema,
    value types, and apply-time semantics are Redfish''s and are never restated here. Desired settings
    are an opaque passthrough interpreted via `attribute_registry`. Applied out-of-band (Redfish SetBiosAttributes,
    or a board vendor''s own settings utility where a board''s Redfish Bios.Attributes is empty).'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-12T00:00:00Z'
  converted_from: flat spec Hardware.BiosProfile@0.4.1 (bulk mechanical conversion 2026-08-04; factoring
    later via scope promotion)
elements:
- element: attribute_registry
  scope: Hardware.BiosProfile
  optional: false
  state: canonical
  description: Version-pinned identity of the Redfish BiosAttributeRegistry the attribute names conform
    to (board + firmware). The binding pointer (§2) — makes the vendor names interpretable WITHOUT UDLM
    restating them.
  schema:
    type: string
    description: Version-pinned identity of the Redfish BiosAttributeRegistry the attribute names conform
      to (board + firmware). The binding pointer (§2) — makes the vendor names interpretable WITHOUT UDLM
      restating them.
- element: management_interface
  scope: Hardware.BiosProfile
  optional: true
  state: canonical
  description: How DCM applies the profile out-of-band (UDLM's realization concern, not Redfish schema).
    `sum` = a board vendor's out-of-band settings utility (a supported board's Redfish Bios.Attributes
    is empty, so the vendor utility is the path).
  schema:
    type: string
    enum:
    - redfish
    - sum
    - ipmi
    - manual
    description: How DCM applies the profile out-of-band (UDLM's realization concern, not Redfish schema).
      `sum` = a board vendor's out-of-band settings utility (a supported board's Redfish Bios.Attributes
      is empty, so the vendor utility is the path).
- element: attributes
  scope: Hardware.BiosProfile
  optional: false
  state: canonical
  description: Desired settings as Redfish Bios `Attributes` (name->value). OPAQUE passthrough — UDLM
    does not model or type these; they are the adopted standard's data, interpreted via `attribute_registry`
    and naturalized by the provider. Vendor/firmware-specific; lives only in the instance (the estate
    repo).
  schema:
    type: object
    description: Desired settings as Redfish Bios `Attributes` (name->value). OPAQUE passthrough — UDLM
      does not model or type these; they are the adopted standard's data, interpreted via `attribute_registry`
      and naturalized by the provider. Vendor/firmware-specific; lives only in the instance (the estate
      repo).
spec_examples:
- attribute_registry: BiosAttributeRegistry.v1_0_0
  management_interface: redfish
  attributes:
    BootMode: Uefi
    SriovGlobalEnable: Enabled
    ProcTurboMode: Enabled
    NumaNodesPerSocket: 4
outputs:
  applied_generation:
    type: integer
    description: The profile generation the host's Realized BIOS reflects (drift = live != profile).
relationships:
- edge_type: references
  target: Hardware.BiosProfile
  cardinality: 0..1
  description: An optional base profile this one derives from (attribute inheritance). Hosts that converge
    to this profile declare the edge host-side (Compute.BareMetalHost references Hardware.BiosProfile).
adopts:
- standard: Redfish
  version: '>=2023.1'
  standard_name: Bios (Attributes) + BiosAttributeRegistry
  role: BIOS-settings shape + attribute-registry metadata — the schema/value-types/apply-time UDLM references,
    never copies
  identity_join:
    local_field: attribute_registry
    standard_column: AttributeRegistry
  source: https://www.dmtf.org/standards/redfish
  license: DMTF
  license_compatibility: compatible-reference
  disposition: tier2_record
context:
  purpose: Captures a reusable desired BIOS/firmware configuration that a fleet of hosts converge to.
  plain_description: A named set of BIOS settings, written once and applied to many hosts. The attribute
    names and values are the vendor's own (Redfish BIOS attributes), carried as an opaque block and interpreted
    against a pinned attribute registry for the exact board and firmware — the profile does not re-describe
    what each setting means. Hosts reference the profile; the applied generation reported back is what
    drift detection compares against. A profile can derive from a base profile.
  use_when:
  - You need identical BIOS settings (e.g. SR-IOV enabled, boot order) enforced across a fleet of like
    hosts.
  - You need to detect a host whose live BIOS no longer matches its declared profile.
  not_for:
  - 'Host network interface configuration — that is Network.ConnectionProfile: the same opaque-body-plus-pinned-registry
    pattern, against NMstate instead of a BIOS attribute registry.'
  - The host record itself — Compute.BareMetalHost references the profile it converges to.
  works_with:
  - Compute.BareMetalHost — the hosts that declare convergence to this profile.
  - Hardware.BiosProfile — an optional base profile this one derives from.
  - Hardware.BMC — the out-of-band path the profile is applied through.
