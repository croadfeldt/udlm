metadata:
  display_name: Graphics Processor
  description: 'A GPU / accelerator component. device_class covers a physical GPU, a whole-GPU passthrough
    (VFIO) to a guest, or a vGPU/MIG partition carved from a physical GPU (parent_device references the
    physical Hardware.GraphicsProcessor). Mirrors Redfish Processor (ProcessorType=GPU) / PCIeDevice.
    outputs-exempt: opaque inventory component — its attributes are Discovered-state facts on the containing
    host; it publishes no realize-time binding surface (rule 36(b) documented exclusion).'
  maintainer: udlm-registry
  origination_timestamp: '2026-06-27T00:11:51Z'
  converted_from: flat spec Hardware.GraphicsProcessor@0.3.0 (bulk mechanical conversion 2026-08-04; factoring
    later via scope promotion)
elements:
- element: device_class
  scope: Hardware.GraphicsProcessor
  optional: true
  state: canonical
  description: Device realization (common-elements.md §7). passthrough = whole GPU to a guest; partition
    = vGPU/MIG slice (set parent_device + partition_mechanism).
  schema:
    type: string
    enum:
    - physical
    - virtual
    - passthrough
    - partition
    default: physical
    description: Device realization (common-elements.md §7). passthrough = whole GPU to a guest; partition
      = vGPU/MIG slice (set parent_device + partition_mechanism).
- element: partition_mechanism
  scope: Hardware.GraphicsProcessor
  optional: true
  state: canonical
  description: 'Only when device_class=partition: e.g. mediated (NVIDIA vGPU / Linux mdev), mig, sr-iov.'
  schema:
    type: string
    description: 'Only when device_class=partition: e.g. mediated (NVIDIA vGPU / Linux mdev), mig, sr-iov.'
- element: identity
  scope: Hardware.GraphicsProcessor
  optional: true
  state: canonical
  description: Instance discriminators (SPEC-DESIGN-REQUIREMENTS §27).
  schema:
    type: object
    description: Instance discriminators (SPEC-DESIGN-REQUIREMENTS §27).
    properties:
      location:
        type: string
        description: PCIe slot / BDF within the parent (Redfish PhysicalLocation). Primary discriminator;
          for a partition, the vGPU/MIG instance id.
      serial_number:
        type: string
        description: GPU serial (absent for virtual/partition).
      asset_tag:
        type: string
      model:
        type: string
        description: GPU model, e.g. AMD Radeon Pro W7900 (Redfish Model).
      manufacturer:
        type: string
      role:
        type: string
        description: Semantic usage, e.g. compute | display | inference.
- element: memory
  scope: Hardware.GraphicsProcessor
  optional: true
  state: canonical
  description: Converted verbatim from the flat Hardware.GraphicsProcessor spec.
  schema:
    type: object
    properties:
      size:
        type: string
        pattern: ^[0-9]+(MB|GB|TB|MiB|GiB|TiB)$
        description: Framebuffer / device memory, e.g. 48GB (for a vGPU, the profile's allocation).
- element: architecture
  scope: Hardware.GraphicsProcessor
  optional: true
  state: canonical
  description: GPU architecture / generation, e.g. RDNA4, Hopper.
  schema:
    type: string
    description: GPU architecture / generation, e.g. RDNA4, Hopper.
