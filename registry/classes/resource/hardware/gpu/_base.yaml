metadata:
  display_name: GPU
  description: 'A GPU or accelerator: a physical card, a whole-card passthrough to a guest, or a vGPU/MIG partition
    carved from a physical card. A Base of its own by the Base test (CLS-002), not a Type of Processor: nothing
    ports between a CPU and a GPU, so Redfish filing both as Processor is a catalogue, not a portability contract;
    Redfish Processor (ProcessorType GPU) and PCIeDevice abstract over the three forms. An inventory component:
    its attributes are discovered facts on the containing host and outputs-exempt: it publishes no realize-time
    binding surface (rule 36(b) documented exclusion).'
  maintainer: udlm-registry
  origination_timestamp: '2026-06-27T00:11:51Z'
elements:
  - element: device_class
    scope: GPU
    optional: true
    state: canonical
    description: 'Device realization (common-elements.md §7): `physical`, `passthrough` (whole card to a guest)
      or `partition` (a vGPU/MIG slice; set `parent_device` and `partition_mechanism`).'
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/device_class_unit
      description: 'Device realization (common-elements.md §7): `physical`, `passthrough` (whole card to a guest)
        or `partition` (a vGPU/MIG slice; set `parent_device` and `partition_mechanism`).'
  - element: partition_mechanism
    scope: GPU
    optional: true
    state: canonical
    description: 'How a partition is carved, when `device_class` is partition: `mediated` (vGPU/mdev), `mig`, `sr-iov`.'
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/partition_mechanism
      description: 'How a partition is carved, when `device_class` is partition: `mediated` (vGPU/mdev), `mig`,
        `sr-iov`.'
  - element: identity
    scope: GPU
    optional: true
    state: canonical
    description: 'Instance discriminators: vendor, model, serial, PCI address.'
    schema:
      type: object
      description: 'Instance discriminators: vendor, model, serial, PCI address.'
      properties:
        location:
          type: string
          description: PCIe slot / BDF within the parent (Redfish PhysicalLocation). Primary discriminator; for
            a partition, the vGPU/MIG instance id.
        serial_number:
          type: string
          description: GPU serial (absent for virtual/partition).
        asset_tag:
          type: string
        model:
          type: string
          description: GPU model, e.g. AMD Radeon Pro W7900 (Redfish Model).
        manufacturer:
          type: string
        role:
          type: string
          description: Semantic usage, e.g. compute | display | inference.
  - element: memory
    scope: GPU
    optional: true
    state: canonical
    description: Device memory as a quantity (24Gi).
    schema:
      type: object
      properties:
        size:
          type: string
          pattern: ^[0-9]+(MB|GB|TB|MiB|GiB|TiB)$
          description: Framebuffer / device memory, e.g. 48GB (for a vGPU, the profile's allocation).
      description: Device memory as a quantity (24Gi).
  - element: architecture
    scope: GPU
    optional: true
    state: canonical
    description: GPU generation as the vendor names it (rdna4, hopper).
    schema:
      $ref: ../../../../common-elements.schema.json#/$defs/gpu_architecture
      description: GPU generation as the vendor names it (rdna4, hopper).
