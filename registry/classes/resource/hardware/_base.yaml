  description: >-
    HOW A HARDWARE THING IS REALIZED (common-elements.md §7) — the full set every Hardware type
    draws from. Declared at the family base because the question is the same for a processor, a
    NIC and a drive; what differs is which answers are possible, and that is what a Type Class
    narrows.

    A child MAY narrow this to the subset it can actually be (ADR-038: refine, never contradict) —
    a socket cannot be an `aggregate`, so Hardware.Processor offers four of the six. It may not add
    a value, which is what makes the family set the ceiling rather than a suggestion, and what
    `check_class_liskov` enforces.
  schema:
    type: string
    enum:
    - physical
    - virtual
    - passthrough
    - partition
    - aggregate
    - bridge
