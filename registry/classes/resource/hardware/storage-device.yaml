outputs:
  device_path:
    type: string
    description: OS device path once Realized, e.g. /dev/disk/by-id/....
relationships:
- target: Compute.BareMetalHost
  cardinality: 0..1
  name: host
  description: The host this drive is installed in; parent carries the reconciled storage rollup (§26).
  edge_type: contained_by
- target: Compute.VM
  cardinality: 0..1
  name: guest
  description: For device_class=virtual/passthrough, the guest the disk is presented to.
  edge_type: contained_by
- target: Storage.Cluster
  target_field: block_storage_class
  cardinality: 0..1
  description: For a virtual disk, the backing storage resource (block storage class) it is provisioned
    from.
  edge_type: binds_to
- target: Hardware.StorageDevice
  cardinality: 0..1
  name: parent_device
  description: parent_device — the physical disk a passthrough/partition (e.g. NVMe namespace) is derived
    from (common-elements §7).
  edge_type: references
adopts:
- standard: Redfish
  version: '2024.4'
  standard_name: Drive
  role: drive component vocabulary (capacity, media, protocol, wwn, serial, bay)
  source: https://www.dmtf.org/standards/redfish
  license: DMTF
  license_compatibility: compatible-reference
- standard: SNIA-Swordfish
  version: '1.2'
  role: storage-device modeling alignment at the system level
  source: https://www.snia.org/forums/smi/swordfish
  license: SNIA
  license_compatibility: compatible-reference
context:
  purpose: Inventories a disk/SSD/NVMe — physical drive or virtual disk — with the identity (WWN, serial,
    bay) that ties failures and replacements to one device.
  plain_description: 'One storage device as a record: its required `capacity` — a whole-number quantity
    like 4TB; fractional sizes do not validate — its `media_type` and bus `protocol`, and where and what
    it is. Identity facts — bay or slot (`location`), model, serial, WWN, and the semantic `role` (boot,
    data, cache, a storage daemon''s member drive) — nest under the `identity` block, not at the top level.
    device_class separates a physical drive from a virtual disk presented to a guest; a virtual disk points
    at the storage that backs it. Once realized, the OS device path is published, tying the inventory
    record to what the host sees.'
  use_when:
  - You need drive-level inventory — which drive, in which bay, of which host — so a failing disk maps
    to a physical pull-and-replace.
  - You need pool or cluster membership grounded in real devices (a vdev's members, a storage daemon's
    backing drive).
  not_for:
  - The consumable volume a workload attaches — Storage.Volume; a device is hardware, a volume is provisioned
    capacity.
  - The aggregation layer over drives — Storage.Pool (host-local) or Storage.Cluster (distributed).
  works_with:
  - Compute.BareMetalHost — the host the drive is installed in.
  - Storage.Pool — pools whose vdevs group these drives.
  - Compute.VM — the guest a virtual disk is presented to.
