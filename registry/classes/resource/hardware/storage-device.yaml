record_type: class
class: type
resource_type: Hardware.StorageDevice
parent: Hardware
version: 0.5.1
family: Resource
status: active
metadata:
  display_name: Storage Device
  description: A storage device (disk / SSD / NVMe) component. device_class distinguishes a physical drive
    (wwn/serial/bay) from a virtual disk presented to a guest (which binds_to its backing Storage resource).
    Mirrors Redfish Drive (+ SNIA Swordfish at the system level).
  maintainer: udlm-registry
  origination_timestamp: '2026-06-27T00:11:51Z'
elements:
- element: device_class
  scope: Hardware.StorageDevice
  optional: true
  state: canonical
  description: Device realization (common-elements.md §7). virtual = a guest virtual disk (binds_to its
    backing volume); passthrough = whole physical disk to a guest.
  schema:
    type: string
    enum:
    - physical
    - virtual
    - passthrough
    - partition
    description: Device realization (common-elements.md §7). virtual = a guest virtual disk (binds_to
      its backing volume); passthrough = whole physical disk to a guest.
- element: partition_mechanism
  scope: Hardware.StorageDevice
  optional: true
  state: canonical
  description: 'Only when device_class=partition: e.g. namespace (NVMe) / lun carved from a parent.'
  schema:
    type: string
    description: 'Only when device_class=partition: e.g. namespace (NVMe) / lun carved from a parent.'
- element: identity
  scope: Hardware.StorageDevice
  optional: true
  state: canonical
  description: Instance discriminators (SPEC-DESIGN-REQUIREMENTS §27).
  schema:
    type: object
    description: Instance discriminators (SPEC-DESIGN-REQUIREMENTS §27).
    properties:
      location:
        type: string
        description: Drive bay / slot within the parent, e.g. Bay 7 (Redfish PhysicalLocation). Primary
          discriminator.
      serial_number:
        type: string
        description: Drive serial (Redfish SerialNumber).
      wwn:
        type: string
        description: World-Wide Name — globally unique block-device identity.
      asset_tag:
        type: string
      model:
        type: string
        description: Drive model (Redfish Model).
      manufacturer:
        type: string
      role:
        type: string
        description: Semantic usage, e.g. boot | data | ceph-osd | cache.
- element: capacity
  scope: Hardware.StorageDevice
  optional: false
  state: canonical
  description: Usable capacity, e.g. 1TB (Redfish CapacityBytes).
  schema:
    type: string
    pattern: ^[0-9]+(MB|GB|TB|PB|MiB|GiB|TiB|PiB)$
    description: Usable capacity, e.g. 1TB (Redfish CapacityBytes).
- element: media_type
  scope: Hardware.StorageDevice
  optional: true
  state: canonical
  description: Media, e.g. hdd, ssd, nvme (Redfish MediaType).
  schema:
    type: string
    description: Media, e.g. hdd, ssd, nvme (Redfish MediaType).
- element: protocol
  scope: Hardware.StorageDevice
  optional: true
  state: canonical
  description: Bus/transport, e.g. sas, sata, nvme (Redfish Protocol).
  schema:
    type: string
    description: Bus/transport, e.g. sas, sata, nvme (Redfish Protocol).
- element: rotation_speed_rpm
  scope: Hardware.StorageDevice
  optional: true
  state: canonical
  description: Spindle speed for rotational media; 0 / omitted for SSD/NVMe.
  schema:
    type: integer
    minimum: 0
    description: Spindle speed for rotational media; 0 / omitted for SSD/NVMe.
