metadata:
  display_name: Processor
  description: 'A CPU component. First-class entity form of the §26 component model — a parent carries
    the cpu rollup and MAY also contain Hardware.Processor entities. device_class distinguishes a physical
    socket from a virtual CPU presented to a guest. outputs-exempt: opaque inventory component — its attributes
    are Discovered-state facts on the containing host; it publishes no realize-time binding surface (rule
    36(b) documented exclusion).'
  maintainer: udlm-registry
  origination_timestamp: '2026-06-27T00:11:51Z'
  converted_from: flat spec Hardware.Processor@0.3.0 (bulk mechanical conversion 2026-08-04; factoring
    later via scope promotion)
elements:
- element: device_class
  scope: Hardware.Processor
  optional: true
  state: canonical
  description: Device realization (common-elements.md §7). physical = a socket/package; virtual = vCPU.
  schema:
    type: string
    enum:
    - physical
    - virtual
    - passthrough
    - partition
    default: physical
    description: Device realization (common-elements.md §7). physical = a socket/package; virtual = vCPU.
- element: partition_mechanism
  scope: Hardware.Processor
  optional: true
  state: canonical
  description: 'Only when device_class=partition: e.g. cpu-pinning / cpu-set carved from a parent.'
  schema:
    type: string
    description: 'Only when device_class=partition: e.g. cpu-pinning / cpu-set carved from a parent.'
- element: identity
  scope: Hardware.Processor
  optional: true
  state: canonical
  description: Instance discriminators (SPEC-DESIGN-REQUIREMENTS §27).
  schema:
