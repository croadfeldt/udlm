- standard: Redfish
  version: '2024.4'
  standard_name: Processor
  role: processor component vocabulary (cores, threads, architecture, speed, socket)
  source: https://www.dmtf.org/standards/redfish
  license: DMTF
  license_compatibility: compatible-reference
context:
  purpose: Inventories a CPU — a physical socket or a vCPU presented to a guest — as a first-class component
    when the host rollup is not enough.
  plain_description: 'One processor as its own record: `cores` (required), `threads`, `architecture`,
    and its clock as `max_speed_mhz`. Identity facts — model, location (the socket designation), serial
    — nest under the `identity` block, not at the top level. Most estates only need the aggregate CPU
    numbers already carried on the host; this type exists for when a socket must be individually addressable
    (asset tracking, heterogeneous sockets). device_class distinguishes the physical socket from a virtual
    CPU presented to a guest. Nothing binds to a processor at runtime, so it publishes no outputs — it
    is inventory.'
  use_when:
  - You need per-socket inventory (exact model, position, serial) beyond the host's aggregate core/thread
    rollup.
  - You need virtual CPUs presented to a guest tracked as components.
  not_for:
  - Ordinary capacity accounting — the cpu rollup on Compute.BareMetalHost covers that without per-socket
    records.
  - GPUs and accelerators — Hardware.GraphicsProcessor.
  works_with:
  - Compute.BareMetalHost — the host the socket is installed in, which carries the reconciled rollup.
  - Compute.VM — the guest a virtual CPU is presented to.
