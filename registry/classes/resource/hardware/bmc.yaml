metadata:
  display_name: BMC
  description: A host's baseboard management controller — its management address, protocol, and the power/reset
    control surface — modeled so power actions have a first-class target. Every board vendor ships its
    own BMC family; this record is vendor-neutral. Credentials are never inline (reference a Security.CredentialRef).
    `manages` points at the host it powers; power operations are Redfish (or a vendor tool like ipmitool
    where a board's Redfish is incomplete) — the mechanism is Policy (DCM), not data.
  maintainer: udlm-registry
  origination_timestamp: '2026-07-12T00:00:00Z'
  converted_from: flat spec Hardware.BMC@0.4.2 (bulk mechanical conversion 2026-08-04; factoring later
    via scope promotion)
elements:
- element: management_address
  scope: Hardware.BMC
  optional: false
  state: canonical
  description: BMC management IP (e.g. 192.0.2.10).
  schema:
    type: string
    description: BMC management IP (e.g. 192.0.2.10).
- element: protocol
  scope: Hardware.BMC
  optional: true
  state: canonical
  description: Out-of-band protocol(s) the BMC answers. redfish for power/reset; ipmi as legacy fallback.
  schema:
    type: string
    enum:
    - redfish
    - ipmi
    - redfish+ipmi
    description: Out-of-band protocol(s) the BMC answers. redfish for power/reset; ipmi as legacy fallback.
- element: vendor
  scope: Hardware.BMC
  optional: true
  state: canonical
  description: BMC/board vendor — the observed vendor string (e.g. `<vendor>`).
  schema:
    type: string
    description: BMC/board vendor — the observed vendor string (e.g. `<vendor>`).
- element: dns_name
  scope: Hardware.BMC
  optional: true
  state: canonical
  description: Management DNS name (e.g. ipmi-host01.example.com).
  schema:
    type: string
    description: Management DNS name (e.g. ipmi-host01.example.com).
spec_examples:
- management_address: 192.0.2.20
  protocol: redfish+ipmi
  vendor: ASPEED
  dns_name: bmc-node01.example.com
outputs:
  power_state:
    type: string
    description: Last-observed chassis power state (On/Off) from Redfish ComputerSystem.PowerState.
relationships:
- edge_type: contained_by
  target: Compute.BareMetalHost
  cardinality: 0..1
  description: The host this BMC is the out-of-band controller for — its power/reset surface. A BMC controls
    exactly one host when assigned.
adopts:
- standard: Redfish
  version: '>=2023.1'
  standard_name: Manager + ComputerSystem.Reset (power/reset actions)
  role: management-controller data model + the power-control action vocabulary UDLM references, never
    restates
  identity_join:
    local_field: management_address
    standard_column: Manager.EthernetInterfaces.IPv4Addresses
  source: https://www.dmtf.org/standards/redfish
  license: DMTF
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: Models a host's baseboard management controller so power and reset actions have a first-class,
    addressable target.
  plain_description: The always-on management controller inside a server that answers even when the host
    is off — each board vendor ships its own flavor. This record carries its `management_address`, the
    single `protocol` it answers — `redfish`, `ipmi`, or the combined `redfish+ipmi` — and its `vendor`,
    and points at the one host it controls. Credentials are never stored here — they are referenced. It
    exists so that power that host off resolves to a concrete address and mechanism instead of prose.
  use_when:
  - You need out-of-band power/reset control of a host to be addressable data, for shutdown ordering and
    recovery automation.
  - You need the management-network surface of the fleet inventoried separately from in-band host addresses.
  not_for:
  - The host itself — Compute.BareMetalHost; the BMC manages it, one-to-one.
  - The BMC login secret — Security.CredentialRef, referenced not stored.
  works_with:
  - Compute.BareMetalHost — the host this BMC is the power/reset surface for.
  - Security.CredentialRef — the BMC credential, by reference.
  - Hardware.BiosProfile — firmware profiles applied over the BMC's out-of-band path.
