metadata:
  display_name: Hub
  description: The multi-cluster management plane (an OCM-style hub / a hosted-control-planes management
    cluster / a standalone fleet manager / a hosted fleet-management service). Adopts Cluster API's management-cluster
    vocabulary and OCM's hub/ManagedCluster model; relationship semantics per ADR-043 (typed target carries
    meaning; self-managed hubs hold no ordering edge into their host chain).
  maintainer: udlm-registry
  origination_timestamp: '2026-07-24T20:00:00Z'
  converted_from: flat spec Platform.Hub@0.1.2 (bulk mechanical conversion 2026-08-04; factoring later
    via scope promotion)
elements:
- element: api_endpoint
  scope: Platform.Hub
  optional: true
  state: canonical
  description: The hub's management API endpoint (URL). The address spokes and operators talk to.
  schema:
    type: string
    description: The hub's management API endpoint (URL). The address spokes and operators talk to.
- element: hosted_control_planes
  scope: Platform.Hub
  optional: true
  state: canonical
  description: Whether this hub hosts spoke control planes inside itself (the hosted-control-planes pattern).
    Hosted spokes are contained_by this hub; imported spokes are depends_on (soft).
  schema:
    type: boolean
    description: Whether this hub hosts spoke control planes inside itself (the hosted-control-planes
      pattern). Hosted spokes are contained_by this hub; imported spokes are depends_on (soft).
spec_constraints:
  description: 'Portable hub surface. Thin: what a hub IS to the model (identity, reachability, fleet
    role) — hub-product specifics (a fleet manager''s policy sets, its project groupings, its control-plane
    sizing knobs) are Provider-Class SharedDataElements (ADR-038), documented exclusions per rule 36(a).
    Relationship semantics follow ADR-043: meaning lives in the typed target, ordering in edge_type; the
    self-managed hub holds no ordering edge into its own host chain (references only — the CYCLE gate
    enforces it).'
spec_examples:
- api_endpoint: https://fleet-manager.internal:6443
  hosted_control_planes: true
outputs:
  hub_ready:
    type: boolean
    description: The management plane is up and serving its API — the realize-time fact a spoke-provisioning
      request binds on.
  api_endpoint:
    type: string
    description: Realized management API endpoint (may differ from intent when the provider assigns it).
  managed_cluster_count:
    type: integer
    description: 'DERIVED — a reading of the graph: the clusters whose inbound contained_by/depends_on
      edge points at this hub, counted at last reconciliation and published for cheap binding (compute-never-store;
      the edges remain the source).'
relationships:
- edge_type: contained_by
  target: Compute.Cluster
  cardinality: 0..1
  description: 'The host cluster, when the hub runs on one (an OCM-style hub, a hosted-control-planes
    management cluster). Standalone hubs (a standalone fleet manager, a hosted fleet-management service)
    omit it. In the self-managed pattern the host is also a spoke: that reflexive management edge is expressed
    as references on the spoke side, never as an ordering edge back into this host chain (ADR-043; CYCLE-gate
    enforced).'
adopts:
- standard: Cluster API
  version: '>=1.6'
  standard_name: management cluster / workload cluster
  role: 'the industry vocabulary for exactly this split: the management cluster provisions and manages
    workload clusters; Platform.Hub is the management-cluster identity, Compute.Cluster edges are the
    workload side'
  source: https://cluster-api.sigs.k8s.io/
  license: Apache-2.0
  license_compatibility: compatible-reference
  disposition: tier1_value
- standard: Open Cluster Management
  version: '>=0.13'
  standard_name: hub / ManagedCluster
  role: 'OCM''s hub-spoke model: the hub cluster and its ManagedCluster resources — the imported-spoke
    (depends_on soft) semantics mirror OCM''s non-destructive import/detach'
  source: https://open-cluster-management.io/
  license: Apache-2.0
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: 'The multi-cluster management plane: the thing that provisions, imports, and lifecycle-manages
    a fleet of clusters.'
  plain_description: A Hub is whatever sits above your clusters and manages them as a fleet — an OCM-style
    hub, a hosted-control-planes management cluster, a standalone fleet manager, or a hosted fleet-management
    service. It may itself run on a cluster (including, in the self-managed pattern, the very cluster
    it manages) or be standalone software. Model the hub as its own entity; whether it lives on a cluster
    is just an edge.
  use_when:
  - you need to record which management plane provisioned or now manages a cluster
  - a cluster's lifecycle operations flow through a fleet manager and shutdown/startup order must respect
    it
  - you need the management plane's own sovereignty position (which jurisdiction governs the manager,
    distinct from its spokes)
  not_for:
  - the cluster a hub happens to run on — that host is a plain Compute.Cluster, and hub-ness on it is
    a derived role marker, never authored
  - single-cluster platform services (GitOps controllers, ingress operators) — those are Software.Service
    on the cluster
  - a peer DCM instance in federation — that is the federate capability on the provider contract, not
    a Hub
  works_with:
  - Compute.Cluster — spokes point at the hub (contained_by when hub-provisioned/hosted-control-plane;
    depends_on soft when imported), and a hosted hub points contained_by at its own host cluster
  - Facility.Location — where the hub's control plane runs, for the sovereignty question
  - Security.CredentialRef — the fleet-management credentials the hub holds are references, never inline
