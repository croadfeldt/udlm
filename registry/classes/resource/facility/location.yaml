family: Resource
status: active
metadata:
  display_name: Location
  description: 'A physical place resources are located in — a site, room, rack, or bench — nesting into
    a containment hierarchy. Resources declare where they sit; DCM uses it for physical organization and
    for location-scoped ambient dependencies (cooling, uplink) via the profile/scope mechanisms. Power
    is intentionally out of scope here: it is carried by each host''s own `depends_on Facility.PowerFeed`
    edge(s) (ADR-013), which may differ even within one rack.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-13T00:00:00Z'
  converted_from: flat spec Facility.Location@0.3.1 (bulk mechanical conversion 2026-08-04; factoring
    later via scope promotion)
elements:
- element: kind
  scope: Facility.Location
  optional: false
  state: canonical
  description: The granularity of this place.
  schema:
    type: string
    enum:
    - site
    - building
    - room
    - row
    - rack
    - shelf
    - bench
    - other
    description: The granularity of this place.
- element: label
  scope: Facility.Location
  optional: true
  state: canonical
  description: Human name (e.g. "server rack", "workbench").
  schema:
    type: string
    description: Human name (e.g. "server rack", "workbench").
- element: position
  scope: Facility.Location
  optional: true
  state: canonical
  description: Placement within the parent (e.g. rack units "U20-U21", a grid cell).
  schema:
    type: string
    description: Placement within the parent (e.g. rack units "U20-U21", a grid cell).
spec_examples:
- kind: rack
  label: Lab compute rack A
  position: Row 2, Grid C7
outputs:
  occupant_count:
    type: integer
    description: 'DERIVED — a count of the resources whose location edge resolves to this Location; the
      graph is the source (compute-never-store: a stored copy drifts the moment a resource moves). How
      many resources are currently located in this place.'
relationships:
- edge_type: contained_by
  target: Facility.Location
  cardinality: 0..1
  name: within
  description: The parent place this location nests inside (bench within room within site).
adopts:
- standard: Redfish
  version: '>=2023.1'
  standard_name: Location (PhysicalLocation / Placement)
  role: physical-placement vocabulary (site/rack/row/unit, coordinates) — referenced, not restated
  source: https://www.dmtf.org/standards/redfish
  license: DMTF
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: Names a physical place — site, room, rack, bench — that resources sit in, nesting into a containment
    hierarchy.
  plain_description: 'A physical place, at whatever granularity is useful: a site contains rooms, a room
    contains racks, a rack has positions. Resources declare where they physically sit by referencing a
    location; location-scoped concerns like cooling or a shared uplink attach at the right level of the
    hierarchy. Power is not carried here — each host declares its own power-feed edges, because two hosts
    in one rack can draw from different feeds.'
  use_when:
  - You need to record where equipment physically is, down to a rack position.
  - You need placement intent for a VM or workload to select among existing places.
  not_for:
  - 'Failure or locality domains for placement constraints (zone, power domain, rack-as-failure-domain)
    — that is Topology: put resources IN Locations, constrain placement AGAINST Topology.'
  - Power sources — Facility.PowerFeed, referenced per host, not per location.
  works_with:
  - Facility.Location — the parent place this one nests inside.
  - Compute.BareMetalHost — the equipment that declares its location.
  - Topology — the failure-domain view of the same physical reality.
