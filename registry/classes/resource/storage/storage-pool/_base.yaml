metadata:
  display_name: Storage Pool
  description: 'A host-local pool of physical drives aggregated into redundancy-protected capacity that volumes
    are carved from. A Base by the Base test (CLS-002): SNIA Swordfish StoragePool abstracts over every host-local
    redundancy group (a ZFS zpool, an md array, an LVM VG, a controller virtual disk), so an order for protected
    capacity of a given kind is fillable by any of them; the backend is `pool_kind`, never the type name. It owns
    the vdev topology, so ordering holds: a pool stops after the volumes it backs and before the drives it aggregates.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-13T00:00:00Z'
elements:
  - element: pool_kind
    scope: StoragePool
    optional: false
    state: canonical
    description: 'The pooling backend: `zfs`, `md`, `hardware_raid`, `lvm`, `btrfs` or `other` (a provider hint;
      the provider is authoritative). A hardware-RAID pool MAY be declared as intent contained by a bare-metal host;
      the provisioning provider derives the controller configuration from it, so the host carries no RAID fields.'
    schema:
      type: string
      enum:
        - zfs
        - md
        - hardware_raid
        - lvm
        - btrfs
        - other
      description: 'The pooling backend: `zfs`, `md`, `hardware_raid`, `lvm`, `btrfs` or `other` (a provider hint;
        the provider is authoritative). A hardware-RAID pool MAY be declared as intent contained by a bare-metal
        host; the provisioning provider derives the controller configuration from it, so the host carries no RAID
        fields.'
      x-extensible-enum: true
  - element: health
    scope: StoragePool
    optional: true
    state: canonical
    description: Pool health as the provider reports it (ZFS ONLINE/DEGRADED/FAULTED; Swordfish Status). The canonical
      rollup is the `redundancy_status` output.
    schema:
      type: string
      description: Pool health as the provider reports it (ZFS ONLINE/DEGRADED/FAULTED; Swordfish Status). The canonical
        rollup is the `redundancy_status` output.
  - element: capacity
    scope: StoragePool
    optional: true
    state: canonical
    description: 'Pool capacity: `size`, `allocated`, `free`, as quantities.'
    schema:
      type: object
      properties:
        size:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?(MB|GB|TB|PB|MiB|GiB|TiB|PiB|M|G|T|P)$
          description: Total pool size.
        allocated:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?(MB|GB|TB|PB|MiB|GiB|TiB|PiB|M|G|T|P)$
        free:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?(MB|GB|TB|PB|MiB|GiB|TiB|PiB|M|G|T|P)$
      description: 'Pool capacity: `size`, `allocated`, `free`, as quantities.'
  - element: vdevs
    scope: StoragePool
    optional: true
    state: canonical
    description: 'The redundancy topology as a tree: each top-level entry is a vdev whose `members` are drives (References
      to StorageDevice) or child vdevs, with the backend''s native protection `type` (mirror, raidz2, stripe, …)
      and the Swordfish `raid_type` it maps to. How the backend combines top-level vdevs is the backend''s semantic:
      zfs stripes across them, lvm allocates per VG policy, a hardware controller does not combine independent virtual
      disks (two VDs are two pools). A `spare` group at the top level is pool-wide; nested inside a vdev it is dedicated
      to it.'
    schema:
      type: array
      description: 'The redundancy topology as a tree: each top-level entry is a vdev whose `members` are drives
        (References to StorageDevice) or child vdevs, with the backend''s native protection `type` (mirror, raidz2,
        stripe, …) and the Swordfish `raid_type` it maps to. How the backend combines top-level vdevs is the backend''s
        semantic: zfs stripes across them, lvm allocates per VG policy, a hardware controller does not combine independent
        virtual disks (two VDs are two pools). A `spare` group at the top level is pool-wide; nested inside a vdev
        it is dedicated to it.'
      items:
        $ref: '#/$defs/vdev'
  - element: properties
    scope: StoragePool
    optional: true
    state: canonical
    description: Provider passthrough properties not lifted into typed fields (compression, recordsize, ashift).
    schema:
      type: object
      additionalProperties:
        type: string
      description: Provider passthrough properties not lifted into typed fields (compression, recordsize, ashift).
spec_constraints:
  $defs:
    vdev:
      type: object
      required:
        - type
      description: 'A redundancy group. RECURSIVE: members are device references OR child vdevs, so composed topologies
        model as trees — raid10 as an explicit stripe of mirrors {type: stripe, members: [mirror(a,b), mirror(c,d)]}
        or as a mirror of stripes; under zfs the same layout may be expressed as multiple top-level mirror vdevs
        because ZFS''s OWN aggregation semantic dynamic-stripes top-level vdevs (backend semantic, not a type rule).
        Fault tolerance composes through the tree (min across striped children; per-group survivability for mirrors/parity)
        SPARES: a {type: spare} group is scoped by TREE POSITION — at the pool''s top level it is pool-wide (ZFS
        spares, a controller''s global spare); nested inside a protected vdev it is dedicated to that vdev (mdadm
        per-array, controller dedicated). A device MAY appear in multiple pools'' spare groups simultaneously (controller
        global spares serve many virtual disks = many Pools): exclusivity applies to ACTIVE membership only, and
        standby claims resolve first-come.'
      properties:
        type:
          type: string
          enum:
            - stripe
            - mirror
            - raidz1
            - raidz2
            - raidz3
            - draid
            - raid0
            - raid1
            - raid5
            - raid6
            - raid10
            - jbod
            - cache
            - log
            - spare
          description: The NATIVE protection term for this vdev/group — authoritative, in the backend's own vocabulary
            (raidz2 is not RAID6 and is never renamed into it).
          x-extensible-enum: true
        raid_type:
          type: string
          enum:
            - RAID0
            - RAID1
            - RAID5
            - RAID6
            - RAID10
            - RAID50
            - RAID60
            - none
          description: The canonical SNIA Swordfish RAIDType this protection MAPS TO for cross-backend comparison
            (nearest-equivalent, declared not derived — raidz2 maps to RAID6-class tolerance while type stays raidz2).
            Optional; queries wanting "everything with >=2-disk tolerance" use this.
        members:
          type: array
          minItems: 1
          description: 'The members of this group: physical drives (References to StorageDevice) and/or CHILD VDEVS
            (nested groups) — mixing is legal where the backend allows it.'
          items:
            oneOf:
              - type: string
                description: 'A member drive of this vdev — a common-elements Reference to StorageDevice (handle
                  string or {uuid, handle} object). Members as references make disk-failure blast radius a graph
                  walk: a dead drive''s inbound edges ARE the affected pools.'
              - $ref: '#/$defs/vdev'
        distributed_spares:
          type: integer
          description: 'draid only: spare CAPACITY woven into the vdev (draid2:...:2s) — no physical spare device
            exists; rebuild is distributed. Mutually exclusive with member spare groups inside this vdev.'
spec_examples:
  - pool_kind: zfs
    health: ONLINE
    capacity:
      size: 32TiB
      allocated: 18.4TiB
      free: 13.6TiB
    vdevs:
      - type: raidz2
        raid_type: RAID6
        members:
          - storage-device/bay-01
          - storage-device/bay-02
          - storage-device/bay-03
          - storage-device/bay-04
          - storage-device/bay-05
          - storage-device/bay-06
      - type: spare
        members:
          - storage-device/bay-07
    properties:
      compression: lz4
      recordsize: 128K
      ashift: '12'
outputs:
  usable_capacity:
    type: string
    description: Usable capacity after redundancy overhead, once Realized.
  degraded:
    type: boolean
    description: Whether the pool is currently degraded (a member vdev is not fully redundant).
  redundancy_status:
    type: string
    description: healthy | degraded | failed — the pool-level protection state (rollup of vdev states); the binding-friendly
      form of the degraded flag.
  fault_tolerance_remaining:
    type: integer
    description: How many further member failures the pool survives right now — composed through the vdev TREE (min
      across striped children; per-group survivability for mirrors/parity). 0 on a degraded mirror = the next failure
      means the next member failure loses data.
  spares_available:
    type: integer
    description: Standby spare devices currently claimable by this pool (all spare groups in scope, minus claimed/failed).
      Not included in fault_tolerance_remaining — a spare restores tolerance after resilver; it does not add tolerance
      now.
relationships:
  - edge_type: contained_by
    target: Machine.BareMetalHost
    cardinality: 0..1
    name: host
    description: The host whose drives make up this pool (a pool is host-local).
adopts:
  - standard: OpenZFS
    version: 2.x
    standard_name: zpool / vdev
    role: pool-and-vdev topology vocabulary (raidz/mirror/stripe, members, health)
    source: https://openzfs.github.io/openzfs-docs/
    license: CDDL-1.0
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: SNIA-Swordfish
    version: '1.2'
    standard_name: StoragePool
    role: capacity + data-protection alignment (StoragePool; RAIDType is the canonical cross-backend protection
      vocabulary vdevs[].raid_type maps to)
    source: https://www.snia.org/forums/smi/swordfish
    license: SNIA
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Models a host-local aggregation of physical drives into redundancy-protected capacity that datasets are
    carved from.
  plain_description: 'The generic redundancy group — one shape for every backend, named by the required `pool_kind`
    (`zfs` for a zpool, `md` for an md array, `hardware_raid` for a controller virtual disk, `lvm` for a VG, `btrfs`):
    a set of drives on one host grouped into `vdevs`, each vdev carrying a protection scheme spelled `type` (mirror,
    raidz, stripe). The vdev topology is why the type exists — a flat dataset-on-host edge would lose which drives
    protect which data and how many failures the pool survives. It sits between the physical drives below and the
    datasets above, and orders accordingly: a pool stops after its datasets and before its drives.'
  use_when:
    - You need the drive → vdev → pool → dataset chain explicit so drive failures and maintenance map to affected
      data.
    - You need host-local capacity facts (usable after redundancy, degraded state) as data.
    - You have RAID anywhere — firmware, mdadm, zpool — and want one reusable model for it (declared hardware-RAID
      pools drive controller config at bare-metal provision time).
  not_for:
    - Distributed multi-node storage — StorageCluster.
    - The consumable unit workloads mount — Volume.ZFS, carved from the pool.
    - An allocatable range of IP addresses — IPAddressPool is the same pool pattern in the network domain.
    - RAID fields on the host type — a host never carries RAID; it contains pools (see Machine.BareMetalHost).
  works_with:
    - Machine.BareMetalHost — the host whose drives form the pool.
    - Volume.ZFS — the datasets carved from the pool.
    - StorageDevice — the physical member drives of the vdevs.
