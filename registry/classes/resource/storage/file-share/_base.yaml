class: base
resource_type: FileShare
version: 0.7.2
family: Resource
status: active
filed_under:
  - storage
metadata:
  display_name: File Share
  description: 'A file-sharing service and the shares it exports: which path is reachable over which protocol, and
    who may reach it. A Base by the Base test (CLS-002): SMB and NFS file services share one export vocabulary (share,
    path, access), so any file-service provider fills an order placed here. The shares are typed data the control
    plane owns; the provider serializes them (smb.conf). Who may connect lives in the referenced DirectoryService,
    never here; knobs the model does not type ride `options`.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
elements:
  - element: protocol
    scope: FileShare
    optional: false
    state: canonical
    description: 'File-sharing protocol: `smb` or `nfs`.'
    schema:
      enum:
        - smb
        - nfs
      description: 'File-sharing protocol: `smb` or `nfs`.'
  - element: workgroup
    scope: FileShare
    optional: true
    state: canonical
    description: SMB workgroup or domain scope.
    schema:
      type: string
      description: SMB workgroup or domain scope.
  - element: directory_service_ref
    scope: FileShare
    optional: true
    state: canonical
    description: Reference to the DirectoryService that authenticates the share principals.
    schema:
      description: Reference to the DirectoryService that authenticates the share principals.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
  - element: shares
    scope: FileShare
    optional: false
    state: canonical
    description: 'The exported shares: each a `name`, a `path`, read-only and browseable flags, the `valid_principals`
      resolved through the directory service, and provider passthrough `options`.'
    schema:
      type: array
      description: 'The exported shares: each a `name`, a `path`, read-only and browseable flags, the `valid_principals`
        resolved through the directory service, and provider passthrough `options`.'
      items:
        type: object
        required:
          - name
          - path
        properties:
          name:
            type: string
          path:
            type: string
            description: Exported filesystem path (typically a Volume mount).
          read_only:
            type: boolean
          browseable:
            type: boolean
          valid_principals:
            type: array
            items:
              type: string
            description: Users/groups permitted, resolved via the DirectoryService (membership held externally).
              e.g. "@examplecom", "maintainer".
          options:
            type: object
            additionalProperties:
              type: string
            description: 'Provider-passthrough share knobs NOT lifted into typed fields — the basic-scale text passthrough
              (DCM ADR-023 §6). e.g. {"fruit:time machine": "yes", "inherit acls": "yes"}.'
spec_examples:
  - protocol: smb
    workgroup: EXAMPLE
    directory_service_ref: directory/example-ad
    shares:
      - name: projects
        path: /export/projects
        read_only: false
        browseable: true
        valid_principals:
          - '@examplecom'
          - maintainer
        options:
          fruit:time machine: 'yes'
          inherit acls: 'yes'
      - name: archive
        path: /export/archive
        read_only: true
        browseable: false
        valid_principals:
          - '@examplecom-archivers'
outputs:
  mount_uri:
    type: string
    description: Reachable share URI once Realized, e.g. //fileserver.example.com/export.
relationships:
  - edge_type: contained_by
    target: Machine.BareMetalHost
    cardinality: 0..1
    description: Runs on a host as a native service — or (below) as a container / on a cluster.
  - edge_type: contained_by
    target: Container
    cardinality: 0..1
    description: Or runs as a containerized service.
  - edge_type: references
    target: DirectoryService
    cardinality: 0..1
    description: Authenticates principals against this directory (auth data external — PDP/PIP).
  - edge_type: references
    target: CredentialRef
    cardinality: 0..n
    description: Service credentials (e.g. the Samba keytab) — referenced, never inline.
  - edge_type: depends_on
    target: Volume
    cardinality: 0..n
    description: The underlying storage the shares expose.
adopts:
  - standard: SMB / CIFS
    version: 3.1.1 (MS-SMB2)
    standard_name: SMB File Service
    role: share + access vocabulary (share name, exported path, access, read-only)
    source: https://learn.microsoft.com/openspecs/windows_protocols/ms-smb2/
    license: Microsoft OSP
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Declares a file-sharing service and its exported shares — who may reach which path over which protocol.
  plain_description: 'A file server''s sharing surface: the protocol (SMB today, extensible to NFS), the exported
    shares with their paths and access rules, and the directory service that authenticates the principals named
    in them — membership stays in the directory, referenced not copied. Share-level knobs the model doesn''t type
    ride through a passthrough field the provider serializes (e.g. into smb.conf). Once realized, the reachable
    share URI is published.'
  use_when:
    - You need network file shares — their paths, access lists, read-only flags — governed as data rather than living
      only in a config file.
    - You need share authentication tied to the directory service that holds the principals.
  not_for:
    - The local storage behind the share path — Volume.ZFS / Volume; the share exposes storage, it isn't the storage.
    - The identity data of who may connect — DirectoryService holds it; shares reference principals.
  works_with:
    - DirectoryService — authenticates the share principals.
    - Volume — the underlying storage the shares expose.
    - Machine.BareMetalHost / Container — where the file service runs.
    - CredentialRef — service credentials (e.g. a keytab), by reference.
