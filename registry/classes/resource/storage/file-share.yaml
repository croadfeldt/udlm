metadata:
  display_name: File Share
  description: A file-sharing service (SMB/CIFS, extensible to NFS) exposing one or more shares over a
    network. The shares and their access are TYPED config — UDLM owns them and the control plane's interface manages
    them (DCM ADR-023 tier (i), the "full" scale). Provider-specific serialization (the smb.conf file,
    an identity suite's [global] block) is naturalized by the provider (DCM ADR-023 §1); share knobs not
    lifted into typed fields ride the `options` passthrough (basic scale, DCM ADR-023 §6). Authentication
    data lives in the referenced DirectoryService (PDP/PIP, provider-contract §1a.8) — referenced, not
    stored.
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
elements:
- element: protocol
  scope: Storage.FileShare
  optional: false
  state: canonical
  description: File-sharing protocol.
  schema:
    enum:
    - smb
    - nfs
    description: File-sharing protocol.
- element: workgroup
  scope: Storage.FileShare
  optional: true
  state: canonical
  description: SMB workgroup / domain scope.
  schema:
    type: string
    description: SMB workgroup / domain scope.
- element: directory_service_ref
  scope: Storage.FileShare
  optional: true
  state: canonical
  description: Reference to Security.DirectoryService — the directory service providing share authentication.
    Common-elements Reference shape (handle string or {uuid, handle} object); resolvable and policy-walkable,
    never an opaque string.
  schema:
    description: Reference to Security.DirectoryService — the directory service providing share authentication.
      Common-elements Reference shape (handle string or {uuid, handle} object); resolvable and policy-walkable,
      never an opaque string.
    $ref: ../../../common-elements.schema.json#/$defs/Reference
- element: shares
  scope: Storage.FileShare
  optional: false
  state: canonical
  description: The exported shares — TYPED config (tier i). The control plane owns these; the provider naturalizes them
    to smb.conf.
  schema:
    type: array
    description: The exported shares — TYPED config (tier i). The control plane owns these; the provider naturalizes
      them to smb.conf.
    items:
      type: object
      required:
      - name
      - path
      properties:
        name:
          type: string
        path:
          type: string
          description: Exported filesystem path (typically a Storage.Volume mount).
        read_only:
          type: boolean
        browseable:
          type: boolean
        valid_principals:
          type: array
          items:
            type: string
          description: Users/groups permitted, resolved via the DirectoryService (membership held externally).
            e.g. "@examplecom", "maintainer".
        options:
          type: object
          additionalProperties:
            type: string
          description: 'Provider-passthrough share knobs NOT lifted into typed fields — the basic-scale
            text passthrough (DCM ADR-023 §6). e.g. {"fruit:time machine": "yes", "inherit acls": "yes"}.'
spec_examples:
- protocol: smb
  workgroup: EXAMPLE
  directory_service_ref: directory/example-ad
  shares:
  - name: projects
    path: /export/projects
    read_only: false
    browseable: true
    valid_principals:
    - '@examplecom'
    - maintainer
    options:
      fruit:time machine: 'yes'
      inherit acls: 'yes'
  - name: archive
    path: /export/archive
    read_only: true
    browseable: false
    valid_principals:
    - '@examplecom-archivers'
outputs:
  mount_uri:
    type: string
    description: Reachable share URI once Realized, e.g. //fileserver.example.com/export.
relationships:
- edge_type: contained_by
  target: Compute.BareMetalHost
  cardinality: 0..1
  description: Runs on a host as a native service — or (below) as a container / on a cluster.
- edge_type: contained_by
  target: Compute.Container
  cardinality: 0..1
  description: Or runs as a containerized service.
- edge_type: references
  target: Security.DirectoryService
  cardinality: 0..1
  description: Authenticates principals against this directory (auth data external — PDP/PIP).
- edge_type: references
  target: Security.CredentialRef
  cardinality: 0..n
  description: Service credentials (e.g. the Samba keytab) — referenced, never inline.
- edge_type: depends_on
  target: Storage.Volume
  cardinality: 0..n
  description: The underlying storage the shares expose.
adopts:
- standard: SMB / CIFS
  version: 3.1.1 (MS-SMB2)
  standard_name: SMB File Service
  role: share + access vocabulary (share name, exported path, access, read-only)
  source: https://learn.microsoft.com/openspecs/windows_protocols/ms-smb2/
  license: Microsoft OSP
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: Declares a file-sharing service and its exported shares — who may reach which path over which
    protocol.
  plain_description: 'A file server''s sharing surface: the protocol (SMB today, extensible to NFS), the
    exported shares with their paths and access rules, and the directory service that authenticates the
    principals named in them — membership stays in the directory, referenced not copied. Share-level knobs
    the model doesn''t type ride through a passthrough field the provider serializes (e.g. into smb.conf).
    Once realized, the reachable share URI is published.'
  use_when:
  - You need network file shares — their paths, access lists, read-only flags — governed as data rather
    than living only in a config file.
  - You need share authentication tied to the directory service that holds the principals.
  not_for:
  - The local storage behind the share path — Storage.Dataset / Storage.Volume; the share exposes storage,
    it isn't the storage.
  - The identity data of who may connect — Security.DirectoryService holds it; shares reference principals.
  works_with:
  - Security.DirectoryService — authenticates the share principals.
  - Storage.Volume — the underlying storage the shares expose.
  - Compute.BareMetalHost / Compute.Container — where the file service runs.
  - Security.CredentialRef — service credentials (e.g. a keytab), by reference.
