version: 0.11.0
family: Resource
status: active
metadata:
  display_name: Storage Volume
  description: 'A CONSUMABLE persistent storage volume — the block or file volume a workload attaches,
    as distinct from the Storage.Cluster that PROVISIONS it (the platform) and the physical device that
    backs it. Vendor-neutral Tier-1: provisioners (Ceph RBD/CephFS, cloud CSI drivers, NFS) are the provider,
    never the type. Adopts Kubernetes PersistentVolumeClaim/CSI + SNIA Swordfish Volume.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-07T14:35:00Z'
  converted_from: flat spec Storage.Volume@0.8.0 (bulk mechanical conversion 2026-08-04; factoring later
    via scope promotion)
elements:
- element: capacity
  scope: Storage.Volume
  optional: false
  state: canonical
  description: Requested capacity, Kubernetes quantity form (e.g. 100Gi). SNIA Swordfish CapacityBytes
    maps here.
  schema:
    type: string
    pattern: ^[0-9]+(Ki|Mi|Gi|Ti|Pi|K|M|G|T|P)?B?$
    description: Requested capacity, Kubernetes quantity form (e.g. 100Gi). SNIA Swordfish CapacityBytes
      maps here.
- element: access_mode
  scope: Storage.Volume
  optional: false
  state: canonical
  description: 'Attachment concurrency (Kubernetes PVC accessModes: RWO/ROX/RWX/RWOP).'
  schema:
    type: string
    enum:
    - read_write_once
    - read_only_many
    - read_write_many
    - read_write_once_pod
    description: 'Attachment concurrency (Kubernetes PVC accessModes: RWO/ROX/RWX/RWOP).'
- element: volume_mode
  scope: Storage.Volume
  optional: true
  state: canonical
  description: Filesystem-mounted vs raw block device (Kubernetes PVC volumeMode).
  schema:
    type: string
    enum:
    - filesystem
    - block
    description: Filesystem-mounted vs raw block device (Kubernetes PVC volumeMode).
- element: storage_class
  scope: Storage.Volume
  optional: true
  state: canonical
  description: Resource reference to a Platform.StorageClass (common-elements §2.5, ADR-025). Authored
    by handle; deferred resolution supported (claim-before-define).
  schema:
    description: Resource reference to a Platform.StorageClass (common-elements §2.5, ADR-025). Authored
      by handle; deferred resolution supported (claim-before-define).
    $ref: ../../common-elements.schema.json#/$defs/Reference
- element: retain_on_release
  scope: Storage.Volume
  optional: true
  state: canonical
  description: 'Reclaim policy: true = Retain (keep data after the consumer releases it), false = Delete.'
  schema:
    type: boolean
    description: 'Reclaim policy: true = Retain (keep data after the consumer releases it), false = Delete.'
- element: layout_entry
  scope: Storage.Volume
  optional: true
  state: canonical
  description: 'The Storage.Layout entry name this volume realizes — the join key paired with the realizes_layout_entry
    edge. Instance edges carry no qualifier (realized-entity dependencies[] is a closed shape), so the
    entry binding lives HERE: set exactly when realizes_layout_entry is declared, matching an entry name
    in the referenced layout. Reconvergence joins on this value to populate the layout''s realized_volumes
    map.'
  schema:
    type: string
    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
    description: 'The Storage.Layout entry name this volume realizes — the join key paired with the realizes_layout_entry
      edge. Instance edges carry no qualifier (realized-entity dependencies[] is a closed shape), so the
      entry binding lives HERE: set exactly when realizes_layout_entry is declared, matching an entry
      name in the referenced layout. Reconvergence joins on this value to populate the layout''s realized_volumes
      map.'
spec_examples:
- capacity: 500Gi
  access_mode: read_write_once
  volume_mode: filesystem
  storage_class: ceph-rbd-ssd
  retain_on_release: true
outputs:
  volume_handle:
    type: string
    description: Provider volume handle/id once Realized (CSI volumeHandle / Swordfish Volume Id).
  attached:
    type: boolean
    description: Whether the volume is currently attached to a consumer.
relationships:
- edge_type: depends_on
  name: provisioned_by
  adopted_from: SNIA Swordfish (StoragePool/StorageService)
  target: Storage.Cluster
  cardinality: 0..1
  description: The Storage.Cluster that provisions this volume (binds its block_storage_class / file_storage_class
    output). A volume cannot outlive its provisioning cluster.
- edge_type: references
  name: attaches_to
  adopted_from: OASIS TOSCA AttachesTo
  target: Compute.VM
  cardinality: 0..n
  description: The consumer(s) this volume is attached to (RWX volumes attach to many). attaches_to is
    the same relation IPAddress uses for interface attachment — the consumable-resource-to-consumer edge.
- edge_type: references
  target: Storage.Layout
  name: realizes_layout_entry
  cardinality: 0..1
  description: 'Declared consumer-side (consumers declare what they consume — the layout never lists its
    consumers): this volume realizes one named entry of a Storage.Layout, joining on the entry''s stable
    name carried in spec.layout_entry (the edge itself carries no qualifier).'
adopts:
- standard: Kubernetes
  version: storage/v1
  standard_name: PersistentVolumeClaim / CSI
  role: consumable-volume request vocabulary (capacity, accessModes, volumeMode, storageClass, reclaimPolicy)
  source: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  license: Apache-2.0
  license_compatibility: compatible-reference
  disposition: tier1_value
- standard: SNIA-Swordfish
  version: '1.2'
  standard_name: Volume
  role: storage-volume-as-asset vocabulary (CapacityBytes, AccessCapabilities) — same family as Storage.Cluster
  source: https://www.snia.org/forums/smi/swordfish
  license: SNIA
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: Declares a consumable persistent volume — the block or file storage a workload attaches — independent
    of what provisions it.
  plain_description: 'The unit of storage a workload asks for and attaches: requested `capacity`, how
    concurrently it may be attached — `access_mode`, in the model''s snake_case spelling: `read_write_once`,
    `read_only_many`, `read_write_many`, `read_write_once_pod` (the Kubernetes camelCase forms do not
    validate) — `volume_mode` (filesystem versus raw block), and which `storage_class` provisions it.
    It is distinct from the platform that builds it and the devices that back it. Once realized, the provider''s
    volume handle comes back, tying the request to the actual volume.'
  use_when:
  - You need a workload's storage requested by capacity, access mode, and class, portable across provisioners.
  - 'You need volumes ordered in the graph: realized before their consumer, never outliving their provisioning
    cluster.'
  not_for:
  - The provisioning policy — Platform.StorageClass; the volume references a class by name.
  - The storage platform — Storage.Cluster provisions volumes.
  - Host-local ZFS/LVM storage a host service mounts — Storage.Dataset.
  - The physical drive — Hardware.StorageDevice.
  works_with:
  - Platform.StorageClass — the class declaring what kind of storage the volume gets.
  - Storage.Cluster — the platform provisioning it.
  - Compute.VM — the consumer(s) it attaches to.
  - Data.Database — databases whose data directory it backs.
