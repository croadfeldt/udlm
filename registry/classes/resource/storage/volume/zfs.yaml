context:
  purpose: Models a ZFS dataset or zvol carved from a host-local pool — the mounted filesystem or block device host
    workloads use.
  plain_description: 'A volume realized by ZFS on one host: its `volume_mode` says whether it is a mounted dataset
    (`filesystem`) or a zvol block device (`block`); its `capacity` is the quota or volsize; `mountpoint`, reported
    `used` and passthrough `properties` are the ZFS-native details. It is what a podman container or host service
    bind-mounts, so it is the storage node those workloads depend on. Volumes nest (parent chains) and cannot outlive
    the pool they are carved from. Snapshot and replication policy is orchestration, not stored here.'
  use_when:
    - You need host services and containers tied to the specific dataset they store on, so the dataset outlives
      them in shutdown order.
    - You need the pool → dataset → workload chain explicit for capacity and migration planning.
  not_for:
    - The pool it is carved from — StoragePool owns the drives and redundancy.
    - Cluster-provisioned volumes a platform attaches — order at Volume, or a Type of another provisioner; a ZFS
      volume is host-local.
    - A network share exported to other machines — FileShare exposes storage; this is the local storage itself.
  works_with:
    - StoragePool — the pool the volume is carved from.
    - Machine.BareMetalHost — the host the volume is local to.
    - Volume.ZFS — the parent dataset, when nested.
