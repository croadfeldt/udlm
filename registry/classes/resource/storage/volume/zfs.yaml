metadata:
  display_name: ZFS Volume
  description: 'A ZFS dataset or zvol, a dialect of Volume (CLS-004): the consumer orders a volume and ZFS is how
    one host-local provider realizes it — a mounted dataset when `volume_mode` is filesystem, a zvol when block.
    Inherits capacity (the quota or volsize), access mode and volume mode; adds the ZFS-native mountpoint, reported
    usage and passthrough properties. Carved from a StoragePool, it cannot outlive its pool; datasets nest. Snapshot
    and replication policy belongs to the control plane, not here.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-13T00:00:00Z'
elements:
  - element: mountpoint
    scope: Volume.ZFS
    optional: true
    state: canonical
    description: Filesystem mountpoint when `volume_mode` is filesystem (/export/gitlab); `none` or `-` if unmounted.
    schema:
      type: string
      description: Filesystem mountpoint when `volume_mode` is filesystem (/export/gitlab); `none` or `-` if unmounted.
  - element: used
    scope: Volume.ZFS
    optional: true
    state: canonical
    description: Space consumed, as the provider reports it.
    schema:
      type: string
      pattern: ^[0-9]+(\.[0-9]+)?(K|M|G|T|P|KB|MB|GB|TB|PB|KiB|MiB|GiB|TiB|PiB)$
      description: Space consumed, as the provider reports it.
  - element: properties
    scope: Volume.ZFS
    optional: true
    state: canonical
    description: Provider passthrough dataset properties (compression, recordsize, mountpoint inheritance).
    schema:
      type: object
      additionalProperties:
        type: string
      description: Provider passthrough dataset properties (compression, recordsize, mountpoint inheritance).
spec_examples:
  - capacity: 200Gi
    access_mode: read_write_once
    volume_mode: filesystem
    mountpoint: /export/gitlab
    used: 84.2G
    properties:
      compression: zstd
      recordsize: 128K
      atime: 'off'
