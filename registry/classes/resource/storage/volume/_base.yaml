conforms_to: udlm/0.1
uuid: aff9e319-cfb9-44da-8c35-fa47f3ea6270
record_type: class
class: base
resource_type: Volume
version: 0.12.3
family: Resource
status: active
filed_under:
  - storage
metadata:
  display_name: Storage Volume
  description: 'A consumable persistent volume: the block or file storage a workload attaches, as distinct from
    the StorageCluster that provisions it and the device that backs it. A Base by the Base test (CLS-002): Kubernetes
    PVC/CSI and SNIA Swordfish Volume abstract over every consumable volume, so an order for capacity with an access
    mode is fillable by any provisioner. The provisioner is the provider; a host-local ZFS dataset is a dialect
    Type beneath it (Volume.ZFS).'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-07T14:35:00Z'
elements:
  - element: capacity
    scope: Volume
    optional: false
    state: canonical
    description: Requested capacity as a quantity (100Gi).
    schema:
      type: string
      pattern: ^[0-9]+(Ki|Mi|Gi|Ti|Pi|K|M|G|T|P)?B?$
      description: Requested capacity as a quantity (100Gi).
  - element: access_mode
    scope: Volume
    optional: false
    state: canonical
    description: 'Attachment concurrency: `read_write_once`, `read_only_many`, `read_write_many`, `read_write_once_pod`
      (the Kubernetes PVC access modes, snake_case).'
    schema:
      type: string
      enum:
        - read_write_once
        - read_only_many
        - read_write_many
        - read_write_once_pod
      description: 'Attachment concurrency: `read_write_once`, `read_only_many`, `read_write_many`, `read_write_once_pod`
        (the Kubernetes PVC access modes, snake_case).'
  - element: volume_mode
    scope: Volume
    optional: true
    state: canonical
    description: '`filesystem` (mounted) or `block` (raw device).'
    schema:
      type: string
      enum:
        - filesystem
        - block
      description: '`filesystem` (mounted) or `block` (raw device).'
  - element: storage_class
    scope: Volume
    optional: true
    state: canonical
    description: Reference to the StorageClass that provisions it; authored by handle, resolved later if the class
      is not yet defined.
    schema:
      description: Reference to the StorageClass that provisions it; authored by handle, resolved later if the class
        is not yet defined.
      $ref: ../../../../common-elements.schema.json#/$defs/Reference
  - element: retain_on_release
    scope: Volume
    optional: true
    state: canonical
    description: true keeps the data after the consumer releases the volume (Retain); false deletes it.
    schema:
      type: boolean
      description: true keeps the data after the consumer releases the volume (Retain); false deletes it.
  - element: layout_entry
    scope: Volume
    optional: true
    state: canonical
    description: The StorageLayout entry name this volume realizes; set exactly when the `realizes_layout_entry`
      edge is declared, matching an entry in the referenced layout. Reconvergence joins on it to fill the layout's
      realized_volumes map.
    schema:
      type: string
      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
      description: The StorageLayout entry name this volume realizes; set exactly when the `realizes_layout_entry`
        edge is declared, matching an entry in the referenced layout. Reconvergence joins on it to fill the layout's
        realized_volumes map.
spec_examples:
  - capacity: 500Gi
    access_mode: read_write_once
    volume_mode: filesystem
    storage_class: ceph-rbd-ssd
    retain_on_release: true
outputs:
  volume_handle:
    type: string
    description: Provider volume handle/id once Realized (CSI volumeHandle / Swordfish Volume Id).
  attached:
    type: boolean
    description: Whether the volume is currently attached to a consumer.
relationships:
  - edge_type: depends_on
    name: provisioned_by
    adopted_from: SNIA Swordfish (StoragePool/StorageService)
    target: StorageCluster
    cardinality: 0..1
    description: The StorageCluster that provisions this volume (binds its block_storage_class / file_storage_class
      output). A volume cannot outlive its provisioning cluster.
  - edge_type: references
    name: attaches_to
    adopted_from: OASIS TOSCA AttachesTo
    target: Machine.VM
    cardinality: 0..n
    description: The consumer(s) this volume is attached to (RWX volumes attach to many). attaches_to is the same
      relation IPAddress uses for interface attachment — the consumable-resource-to-consumer edge.
  - edge_type: references
    target: StorageLayout
    name: realizes_layout_entry
    cardinality: 0..1
    description: 'Declared consumer-side (consumers declare what they consume — the layout never lists its consumers):
      this volume realizes one named entry of a StorageLayout, joining on the entry''s stable name carried in spec.layout_entry
      (the edge itself carries no qualifier).'
adopts:
  - standard: Kubernetes
    version: storage/v1
    standard_name: PersistentVolumeClaim / CSI
    role: consumable-volume request vocabulary (capacity, accessModes, volumeMode, storageClass, reclaimPolicy)
    source: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
    license: Apache-2.0
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: SNIA-Swordfish
    version: '1.2'
    standard_name: Volume
    role: storage-volume-as-asset vocabulary (CapacityBytes, AccessCapabilities) — same family as StorageCluster
    source: https://www.snia.org/forums/smi/swordfish
    license: SNIA
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Declares a consumable persistent volume — the block or file storage a workload attaches — independent
    of what provisions it.
  plain_description: 'The unit of storage a workload asks for and attaches: requested `capacity`, how concurrently
    it may be attached — `access_mode`, in the model''s snake_case spelling: `read_write_once`, `read_only_many`,
    `read_write_many`, `read_write_once_pod` (the Kubernetes camelCase forms do not validate) — `volume_mode` (filesystem
    versus raw block), and which `storage_class` provisions it. It is distinct from the platform that builds it
    and the devices that back it. Once realized, the provider''s volume handle comes back, tying the request to
    the actual volume.'
  use_when:
    - You need a workload's storage requested by capacity, access mode, and class, portable across provisioners.
    - 'You need volumes ordered in the graph: realized before their consumer, never outliving their provisioning
      cluster.'
  not_for:
    - The provisioning policy — StorageClass; the volume references a class by name.
    - The storage platform — StorageCluster provisions volumes.
    - Host-local ZFS/LVM storage a host service mounts — Volume.ZFS.
    - The physical drive — StorageDevice.
  works_with:
    - StorageClass — the class declaring what kind of storage the volume gets.
    - StorageCluster — the platform provisioning it.
    - Machine.VM — the consumer(s) it attaches to.
    - Database — databases whose data directory it backs.
