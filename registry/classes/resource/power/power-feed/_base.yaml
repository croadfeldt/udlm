record_type: class
class: base
resource_type: PowerFeed
version: 0.7.2
family: Resource
status: active
filed_under:
  - power
  - facility
metadata:
  display_name: Power Feed
  description: 'A power source feeding equipment: a utility circuit, a UPS, a PDU or a generator. The root of the
    estate graph: hosts depend on a feed, so a reverse-topological shutdown walks everything that transitively draws
    from it. A Base by the Base test (CLS-002): Redfish Circuit abstracts over every feed type, so a feed with a
    given type, capacity and redundancy is one deliverable any power provider realizes; NUT supplies UPS telemetry
    by reference.'
  maintainer: udlm-registry
  origination_timestamp: '2026-06-27T00:38:59Z'
elements:
  - element: feed_type
    scope: PowerFeed
    optional: false
    state: canonical
    description: 'Kind of source: `utility`, `ups`, `pdu`, `generator`. `ups` implies a `supplied_by` edge to the
      UPS; one without the other reads as incomplete, not contradictory.'
    schema:
      type: string
      enum:
        - utility
        - ups
        - pdu
        - generator
      description: 'Kind of source: `utility`, `ups`, `pdu`, `generator`. `ups` implies a `supplied_by` edge to
        the UPS; one without the other reads as incomplete, not contradictory.'
  - element: capacity
    scope: PowerFeed
    optional: true
    state: canonical
    description: Rated capacity (Redfish Circuit ratings).
    schema:
      type: object
      description: Rated capacity (Redfish Circuit ratings).
      properties:
        watts:
          type: integer
          minimum: 1
          description: Rated real power, W (VA for UPS where applicable).
        voltage:
          type: integer
          minimum: 1
          description: Nominal voltage, V.
        phases:
          type: integer
          enum:
            - 1
            - 3
          description: Single- or three-phase.
  - element: redundancy
    scope: PowerFeed
    optional: true
    state: canonical
    description: 'Feed redundancy: none, n+1, 2n.'
    schema:
      type: string
      enum:
        - none
        - n+1
        - 2n
      description: 'Feed redundancy: none, n+1, 2n.'
spec_examples:
  - feed_type: pdu
    capacity:
      watts: 5000
      voltage: 208
      phases: 3
    redundancy: n+1
outputs:
  status:
    type: string
    description: Observed feed status — online | on-battery | low-battery | overload | off (maps from NUT ups.status).
      Drives the UPS shutdown trigger.
  battery_charge:
    type: integer
    description: Battery charge percent for a UPS feed (NUT battery.charge).
  runtime_seconds:
    type: integer
    description: Estimated runtime remaining on battery, seconds (NUT battery.runtime).
relationships:
  - edge_type: depends_on
    name: supplied_by
    target: UPS
    cardinality: 0..1
    description: supplied_by — the UPS that conditions this feed (feed_type ups). The feed's status/battery outputs
      are that unit's telemetry; a feed with no UPS (utility, pdu, generator) has no such edge.
adopts:
  - standard: Redfish
    version: '2024.4'
    standard_name: Circuit
    role: power-distribution / circuit rating vocabulary (Redfish DCIM PowerDistribution/Circuit)
    source: https://www.dmtf.org/standards/redfish
    license: DMTF
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: NUT
    version: '2.8'
    standard_name: ups.status
    role: 'UPS telemetry variable namespace (status, battery.charge, battery.runtime) — reference-only: NUT is GPL'
    source: https://networkupstools.org/docs/developer-guide.chunked/apas01.html
    license: GPL-2.0-or-later
    license_compatibility: reference-only
    disposition: tier1_value
context:
  purpose: Models a power source — utility circuit, UPS, PDU, generator — as the root that shutdown/startup ordering
    of everything drawing from it hangs on.
  plain_description: One source of power feeding equipment. Hosts and switches declare which feed they draw from,
    so what loses power when a UPS drains is a graph walk, not tribal knowledge. For UPS feeds it carries live status
    (online, on-battery, low-battery), battery charge, and estimated runtime — the facts an automated graceful shutdown
    triggers on. Rated `capacity` (watts, voltage, phases) and `redundancy` — the enum `none`, `n+1`, or `2n`, not
    a boolean — are declared up front.
  use_when:
    - You need equipment tied to its actual power source so a UPS on-battery event can drive an ordered shutdown
      of exactly what that UPS feeds.
    - You need rated capacity and feed redundancy recorded per circuit/UPS/PDU.
  not_for:
    - The place equipment sits — Location; a rack is a place, a feed is a power source, and the two vary independently.
    - Powering one host off — that action targets the host's BMC control surface, not the feed.
  works_with:
    - Machine.BareMetalHost — hosts declare depends_on the feed(s) they draw from.
    - NetworkSwitch — a UPS-backed switch outlives hosts in a shutdown; connectivity goes last.
    - Job — the shutdown job a feed's on-battery status triggers.
