metadata:
  authority: example
  display_name: Compute.VM.OCPVirt Provider Class (example)
  maintainer: UDLM maintainers
  origination_timestamp: '2026-07-30T18:30:00Z'
  description: >-
    EXAMPLE Provider Class — not canonical. Per the ADR-038 authorship
    ruling, Provider Classes are provider-authored and reach canonical
    standing through the DCM contribution lifecycle; this file demonstrates
    the grammar for the class named illustratively throughout ADR-038.
    OpenShift Virtualization (KubeVirt) Provider Class for the Compute.VM
    Type Class. Carries only what is meaningful when
    the VM lands on this provider: the target namespace (the canonical
    ADR-016 example of a provider-required field that lives off the portable
    type), instancetype/preference selection, run and eviction strategy,
    storage-class and boot-source mechanics, secondary-network attachments,
    and the GPU-passthrough / SR-IOV elements the Compute.VirtualMachine
    flat spec explicitly parks for the Provider tier. Elements are proposed
    pending a grounding pass against a live VirtualMachine custom resource
    (deferred — OpenShift Virtualization not currently installed in the
    reference estate).
elements:
  - element: namespace
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      Target OpenShift namespace for the VirtualMachine object. The
      request-realization enrichment step fills this from a governed layer
      via post-placement policy (ADR-024); a consumer never names it in
      portable intent.
    schema:
      type: string
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      maxLength: 63
  - element: instance_type
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      VirtualMachineClusterInstancetype name (for example u1.medium)
      selecting the provider's sizing bundle. When set, the provider derives
      vCPU and memory from the instancetype; policy validates it against the
      portable cpu and memory elements rather than letting the two diverge.
    schema:
      type: string
  - element: preference
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      VirtualMachineClusterPreference name (for example fedora, windows.10)
      supplying guest-OS-tuned device and feature defaults.
    schema:
      type: string
  - element: run_strategy
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      Desired run posture of the VirtualMachine, mapped to the KubeVirt
      runStrategy values Always, Halted, Manual, RerunOnFailure and Once.
    schema:
      type: string
      enum: [always, halted, manual, rerun_on_failure, once]
  - element: storage_class
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      OpenShift StorageClass backing the VM's root and data volumes.
      Placement selects it from the provider's advertised classes; the
      consumer's portable intent speaks in storage_tier, never in a
      provider class name.
    schema:
      type: string
  - element: boot_source
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      Boot image mechanics for this provider: a containerDisk image
      reference or the name of a DataVolume/PVC boot source in the target
      namespace.
    schema:
      type: string
  - element: network_attachments
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      Multus NetworkAttachmentDefinition references for secondary
      interfaces (for example an OVN localnet to a VLAN). Ordered; the
      primary pod network is implicit and never listed.
    schema:
      type: array
      items:
        type: string
  - element: eviction_strategy
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      Behavior when the scheduler must vacate the node, mapped to the
      KubeVirt evictionStrategy values LiveMigrate, LiveMigrateIfPossible,
      None and External.
    schema:
      type: string
      enum: [live_migrate, live_migrate_if_possible, none, external]
  - element: gpu_passthrough
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      Host GPU devices passed through to the guest, by permitted device
      name. This is one of the two elements the Compute.VirtualMachine flat
      spec deliberately excludes as Provider-Class surface (ADR-038).
    schema:
      type: array
      items:
        type: string
  - element: sriov_networks
    scope: Compute.VM.OCPVirt
    optional: true
    state: proposed
    description: >-
      SR-IOV network references for direct virtual-function interfaces. The
      second element the Compute.VirtualMachine flat spec deliberately
      excludes as Provider-Class surface (ADR-038).
    schema:
      type: array
      items:
        type: string
coverage:
  use_cases:
    - scoped-class/author-scoped-class
  flows:
    - docs/flows/scoped-class-lifecycle.md
