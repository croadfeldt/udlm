metadata:
  authority: canonical
  display_name: Compute Base Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-07-27T21:00:00Z'
  title: Compute Base Class
  description: >-
    The Base Class of the Compute category (ADR-038). Every element here is a SharedDataElement at
    `Compute` scope, inherited by every Compute Type Class (Compute.VM, Compute.BareMetalHost,
    Compute.Container, …). Base-scope = portable across every type in the category. This is the
    first worked Class artifact — the P0 substrate the class-gated queue composes against; the
    generator compiles each Type Class extending it down to today's flat resource-type spec.
  prompt_version: class-p0-keystone-2026-07-27
elements:
  - element: cpu
    scope: Compute
    state: canonical
    description: >-
      Unifies vcpu (VM) / cpu (BareMetal) / resources.cpu (Container) — the same concept under three
      names today. The provider naturalizes to its native model (kubevirt domain cpu, vSphere
      sockets×cores, EC2 vCPUs).
    schema:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          description: vCPUs / cores.
        sockets:
          type: integer
          minimum: 1
          description: Optional topology hint; provider-support-dependent.
        cores_per_socket:
          type: integer
          minimum: 1
      required: [count]
  - element: memory
    scope: Compute
    state: canonical
    description: >-
      Reconciles the drift the sweep found (VM had {hugepages,size}, BareMetal had {size}):
      `hugepages` becomes an optional Base element.
    schema:
      type: object
      properties:
        size:
          type: string
          pattern: "^[0-9]+(Mi|Gi|MB|GB|TB|MiB|GiB|TiB)$"
        hugepages:
          type: object
          properties:
            enabled: { type: boolean }
            page_size: { type: string, description: "e.g. 2Mi, 1Gi." }
      required: [size]
  - element: storage
    scope: Compute
    optional: true
    state: canonical
    description: >-
      The reference-discipline requirements descriptor (PVD-001) — the numeric storage requirements,
      unifying VM disks[].storage / BareMetal storage / Container resources. The requested performance
      class is the governed `storage_tier` element below, not an inline enum here.
    schema:
      type: object
      properties:
        min_iops: { type: integer, minimum: 0 }
        min_throughput_mbps: { type: integer, minimum: 0 }
        min_replication: { type: integer, minimum: 1 }
        encryption: { type: boolean }
  - element: storage_tier
    scope: Compute
    optional: true
    state: canonical
    description: >-
      The requested storage performance class — the neutral `tier` of ADR-036's requirements
      descriptor, as a GOVERNED vocabulary (ADR-038 §2), not an inline enum or a vendor class name.
      The canonical terms are `storage_tier` reference-data records (standard / performance / archive,
      curated proposed→canonical), and each term DENOTES A REQUIREMENTS FLOOR — its canonical
      definition carries the minima it means (e.g. performance → min_iops 20000, min_throughput 500).
      Selection precedence (ADR-036, ruled 2026-07-27): name-selectable but requirements-authoritative
      — a resource may be selected by tier name alone, but explicit `storage` requirements, if given,
      drive the match, and a tier name resolves to the same floor. One provider's "SSD" and another's
      "performance" both qualify iff they meet the floor (portability retained); the provider records
      its chosen native class as a realized output, never intent. Rigor is profile-driven (ADR-007 +
      the ADR-039 intake ladder): homelab MAY write a bare string; sovereign MUST resolve to a
      canonical term by `data_reference`.
    schema:
      type: string
    values:
      reference_data_type: storage_tier
  - element: guest_os
    scope: Compute
    optional: true
    state: proposed
    description: >-
      The requested operating system, as portable requirements (image family + version), not a
      provider-native image id. Proposed pending the OS-standardization catalog work (task #30).
    schema:
      type: object
      properties:
        family: { type: string, description: "e.g. rhel, ubuntu, windows." }
        version: { type: string }

