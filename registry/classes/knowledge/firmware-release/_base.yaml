context:
  purpose: Records a firmware release as a fact — the thing a device runs, and the subject its software bill of
    materials describes — so one advisory about a release reaches every device that runs it.
  plain_description: 'One firmware release, identified by who makes it, the device model it is for and its version,
    each written exactly as a device reports it. It is knowledge about the estate, never provisioned. Nothing
    ties it to a device by a stored edge: a device already states its maker, its model and the firmware version
    it runs, and a device that states the same three values runs this release. So twenty switches on one release
    share one record, and a device that is updated stops matching the old release without anyone editing either
    record. What is inside the release is not listed here: a SoftwareBillOfMaterials describes it and lists its
    components, one today for most devices and many where a maker publishes a full list.'
  use_when:
    - You need every device tied to the exact firmware release it runs, deduplicated across the fleet.
    - 'You need the subject a firmware bill of materials hangs from: release ← document → packages → vulnerabilities.'
  not_for:
    - The device — NetworkSwitch, NetworkGateway, WirelessAccessPoint and the other device classes state the
      version they run; this is the release as a fact.
    - A container or operating-system image — SoftwareImage, identified by its digest.
    - The firmware file itself — a binary identified by its digest is an image. This record names a release and
      holds no digest, and one file a maker ships for several models is one release per model.
    - A component inside the release — SoftwarePackage, listed by the release's SoftwareBillOfMaterials.
    - A host's boot firmware settings — the Machine `firmware` element.
  works_with:
    - NetworkSwitch, NetworkGateway and WirelessAccessPoint — the devices that run a release, matched by the maker,
      model and firmware version each one states.
    - SoftwareBillOfMaterials — the document that describes the release and lists its components.
