metadata:
  display_name: Firmware Release
  description: 'One firmware release as a fact about the estate, named by its maker, the device model it is for and
    its version. A Knowledge class: discovered, never provider-realized. A device that states this maker, model and
    version runs this release: the match is derived and no edge is stored. A SoftwareBillOfMaterials describes the
    release and lists what is in it.'
  maintainer: udlm-registry
  origination_timestamp: '2026-11-19T23:30:00Z'
