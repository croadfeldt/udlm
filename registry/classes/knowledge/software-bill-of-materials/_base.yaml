class: base
resource_type: SoftwareBillOfMaterials
version: 0.1.0
family: Knowledge
status: active
metadata:
  display_name: Software Bill of Materials
  description: 'One software bill of materials as a fact: the document listing what one subject contains. A Knowledge
    class: produced by a scanner or a supplier, never provider-realized. SPDX and CycloneDX are adopted by reference;
    the document stays in the store that is its system of record and this record points at it by URL and digest. The
    record adds which estate record the document describes and one captured edge per package listed.'
  maintainer: udlm-registry
  origination_timestamp: '2026-11-13T00:00:00Z'
entity_type: SoftwareBillOfMaterials
elements:
- element: format
  scope: SoftwareBillOfMaterials
  optional: false
  state: proposed
  description: 'The adopted document format: `spdx` or `cyclonedx`.'
  schema:
    type: string
    enum:
    - spdx
    - cyclonedx
    description: 'The adopted document format: `spdx` or `cyclonedx`.'
- element: spec_version
  scope: SoftwareBillOfMaterials
  optional: true
  state: proposed
  description: The version of the format the document is written in, as the document states it (SPDX `spdxVersion`,
    CycloneDX `specVersion`).
  schema:
    type: string
    description: The version of the format the document is written in, as the document states it (SPDX `spdxVersion`,
      CycloneDX `specVersion`).
- element: document_url
  scope: SoftwareBillOfMaterials
  optional: false
  state: proposed
  description: Where the document is kept in the store that is its system of record. A location, not an entity reference.
    The store is authoritative for the document; this record is checked against it.
  schema:
    type: string
    format: uri
    description: Where the document is kept in the store that is its system of record. A location, not an entity reference.
      The store is authoritative for the document; this record is checked against it.
- element: document_digest
  scope: SoftwareBillOfMaterials
  optional: false
  state: proposed
  description: 'The sha256 digest of the document''s bytes when this record was built from it. A reader compares it
    with what the store serves now: a difference means the record is out of date.'
  schema:
    type: string
    pattern: ^sha256:[a-f0-9]{64}$
    description: 'The sha256 digest of the document''s bytes when this record was built from it. A reader compares
      it with what the store serves now: a difference means the record is out of date.'
- element: document_id
  scope: SoftwareBillOfMaterials
  optional: true
  state: proposed
  description: The document's own identifier in its format (SPDX `documentNamespace`, CycloneDX `serialNumber`). It
    is how a VEX document or another bill of materials names this one.
  schema:
    type: string
    description: The document's own identifier in its format (SPDX `documentNamespace`, CycloneDX `serialNumber`).
      It is how a VEX document or another bill of materials names this one.
- element: created_at
  scope: SoftwareBillOfMaterials
  optional: true
  state: proposed
  description: When the document was produced, as the document states it (SPDX `creationInfo.created`, CycloneDX `metadata.timestamp`).
    A subject that changed after this instant is not described by this document.
  schema:
    $ref: ../../../common-elements.schema.json#/$defs/Timestamp
    description: When the document was produced, as the document states it (SPDX `creationInfo.created`, CycloneDX
      `metadata.timestamp`). A subject that changed after this instant is not described by this document.
- element: attestation
  scope: SoftwareBillOfMaterials
  optional: true
  state: proposed
  description: The signed form of the document, where one exists. An in-toto Statement whose predicate is the document
    and whose subject is the thing described. This record points at it and never asserts that the signature verified.
    Verifying it, and deciding whose signature counts, is Policy.
  schema:
    type: object
    additionalProperties: false
    required:
    - predicate_type
    - url
    description: The signed form of the document, where one exists. An in-toto Statement whose predicate is the document
      and whose subject is the thing described. This record points at it and never asserts that the signature verified.
      Verifying it, and deciding whose signature counts, is Policy.
    properties:
      predicate_type:
        type: string
        x-standard: in-toto Attestation Framework:1.0 predicateType
        enum:
        - https://spdx.dev/Document
        - https://cyclonedx.org/bom
        description: The in-toto predicate type of the statement, one per adopted format.
      url:
        type: string
        format: uri
        description: Where the signed statement is kept, such as an OCI referrer of the image or a transparency log
          entry.
      digest:
        type: string
        pattern: ^sha256:[a-f0-9]{64}$
        description: The sha256 digest of the statement envelope.
