metadata:
  display_name: Capability
  description: 'A discrete platform capability — the unit of architectural capability tracked, normalized,
    and gap-analysed by DAV. A Knowledge-family entity: its lifecycle is curation (proposed -> under-review
    -> canonical -> deprecated), not provisioning, and it is never realized by a provider. The family
    tag disambiguates the collision-prone bare word ''Capability'' from any Resource type.'
  maintainer: dav
  origination_timestamp: '2026-06-18T00:58:56Z'
entity_type: Capability
elements:
- element: name
  scope: Capability
  optional: false
  state: canonical
  description: Canonical capability name (single normalized handle). The curation lifecycle converges
    aliases onto this.
  schema:
    type: string
    description: Canonical capability name (single normalized handle). The curation lifecycle converges
      aliases onto this.
- element: description
  scope: Capability
  optional: false
  state: canonical
  description: What the capability is and the architectural concern it addresses.
  schema:
    type: string
    description: What the capability is and the architectural concern it addresses.
- element: pillar
  scope: Capability
  optional: true
  state: canonical
  description: Top-level grouping the capability rolls up to (e.g. a maturity-framework pillar).
  schema:
    type: string
    description: Top-level grouping the capability rolls up to (e.g. a maturity-framework pillar).
- element: domain
  scope: Capability
  optional: true
  state: canonical
  description: Capability domain (e.g. one of control-plane capability domains) this capability belongs to.
  schema:
    type: string
    description: Capability domain (e.g. one of control-plane capability domains) this capability belongs to.
- element: curation_state
  scope: Capability
  optional: true
  state: canonical
  description: Position in the curation lifecycle — the Knowledge-family interpretation of the four states
    (provenance-first; promotion to canonical is a curation act, applied by Policy, not by a provider).
  schema:
    enum:
    - proposed
    - under-review
    - canonical
    - deprecated
    description: Position in the curation lifecycle — the Knowledge-family interpretation of the four
      states (provenance-first; promotion to canonical is a curation act, applied by Policy, not by a
      provider).
spec_examples:
- name: workload-placement
  description: Schedule a workload onto a suitable host or node according to declared placement constraints
    (affinity, topology, resource fit).
  pillar: Operate
  domain: Scheduling
  curation_state: canonical
outputs:
  normalized_handle:
    type: string
    description: The canonical handle a Capability resolves to once curated to `canonical`. Other Knowledge
      entities (aliases, use cases) bind to this via typed references rather than free-text capability
      names.
relationships:
- edge_type: references
  target: TaxonomyTerm
  target_field: termHandle
  cardinality: 0..n
  description: normalized_to — this capability is mapped to one or more canonical taxonomy terms (e.g.
    control-plane capability taxonomy). A declarative typed reference; the mapping act is Policy.
- edge_type: depends_on
  target: Capability
  cardinality: 0..n
  description: This capability depends on another capability (capability-map edge). Forms an acyclic capability
    DAG; traversal/ordering is Policy.
context:
  purpose: Names one discrete platform capability so architecture analysis can track, normalize, and gap-score
    it.
  plain_description: 'A single named thing a platform can do — e.g. workload placement, or secret rotation
    — kept as a curated fact rather than provisioned infrastructure. Capabilities move through a curation
    lifecycle — the `curation_state` property: `proposed`, `under-review`, `canonical`, `deprecated`;
    once canonical, other records bind to the capability''s normalized handle instead of free-text names,
    so the same capability spelled five ways converges onto one record. Nothing is ever built from a Capability
    — it is knowledge about the platform, not a resource in it.'
  use_when:
  - You need to track which architectural capabilities a platform has, is missing, or has duplicated across
    teams.
  - You need many differently-worded mentions of the same capability to converge onto one canonical name.
  not_for:
  - The vocabulary term a capability normalizes onto — that is TaxonomyTerm (the authority); Capability
    is the observed thing being normalized.
  - A provider's concrete operation vocabulary (create-volume, allocate-address) — that lives as provider-capability
    terms under TaxonomyTerm, not here.
  works_with:
  - TaxonomyTerm — the canonical taxonomy a capability is mapped onto (normalized_to).
  - Capability — capabilities depend on other capabilities, forming the capability map.
