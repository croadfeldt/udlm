metadata:
  display_name: VEX Statement
  description: 'One party''s statement about one vulnerability in one package version: who said it and the status
    they give, in their own words (row 179). A supplier''s VEX, a test harness and an SBOM store''s finding are each
    one. It records what was said and decides nothing; whether something is exposed is a policy''s answer. A
    Knowledge class: the party''s statement is drafted, product security confirms it. It lives apart from the
    Vulnerability, because one vulnerability concerns many packages.'
  maintainer: udlm-registry
  origination_timestamp: '2026-09-13T00:00:00Z'
entity_type: VexStatement
elements:
  - element: vulnerability_ref
    scope: VexStatement
    optional: false
    state: proposed
    description: The Vulnerability (one record per CVE) this statement is about.
    schema:
      $ref: ../../../common-elements.schema.json#/$defs/Reference
      description: The Vulnerability (one record per CVE) this statement is about.
  - element: software_package_ref
    scope: VexStatement
    optional: false
    state: proposed
    description: The SoftwarePackage (one record per purl) this statement is about.
    schema:
      $ref: ../../../common-elements.schema.json#/$defs/Reference
      description: The SoftwarePackage (one record per purl) this statement is about.
  - element: source
    scope: VexStatement
    optional: false
    state: proposed
    description: Who states this, in which format, and where it can be read again. Two parties that say different
      things about the same pair make two statements, and both are kept.
    schema:
      $ref: ../../../common-elements.schema.json#/$defs/vulnerability_source
      description: Who states this, in which format, and where it can be read again. Two parties that say different
        things about the same pair make two statements, and both are kept.
  - element: source_status
    scope: VexStatement
    optional: true
    state: proposed
    description: 'The status the party gives this package version, in its own vocabulary, verbatim: a CSAF product
      status such as `known_not_affected`, a CycloneDX analysis state such as `in_triage`, an SPDX relationship type
      such as `doesNotAffect`, an OpenVEX status. Each standard''s codelist is accepted as it is spelled.'
    schema:
      description: 'The status the party gives this package version, in its own vocabulary, verbatim: a CSAF product
        status such as `known_not_affected`, a CycloneDX analysis state such as `in_triage`, an SPDX relationship
        type such as `doesNotAffect`, an OpenVEX status.'
      anyOf:
        - type: string
          x-standard: 'OpenVEX: statement status'
          enum: [not_affected, affected, fixed, under_investigation]
        - $ref: ../../../common-elements.schema.json#/$defs/csaf_product_status
        - type: string
          x-standard: 'CycloneDX: vulnerabilities[].analysis.state'
          enum: [resolved, resolved_with_pedigree, exploitable, in_triage, false_positive, not_affected]
        - type: string
          x-standard: 'SPDX: 3.0 security relationship type'
          enum: [affects, doesNotAffect, fixedIn, underInvestigationFor]
  - element: source_justification
    scope: VexStatement
    optional: true
    state: proposed
    description: The party's reason for a not-affected status, in its own vocabulary, verbatim (an OpenVEX or CSAF
      label, a CycloneDX justification such as `code_not_reachable`).
    schema:
      description: The party's reason for a not-affected status, in its own vocabulary, verbatim (an OpenVEX or
        CSAF label, a CycloneDX justification such as `code_not_reachable`).
      anyOf:
        - type: string
          x-standard: 'OpenVEX: statement justification'
          enum: [component_not_present, vulnerable_code_not_present, vulnerable_code_not_in_execute_path,
                 vulnerable_code_cannot_be_controlled_by_adversary, inline_mitigations_already_exist]
        - type: string
          x-standard: 'CycloneDX: vulnerabilities[].analysis.justification'
          enum: [code_not_present, code_not_reachable, requires_configuration, requires_dependency,
                 requires_environment, protected_by_compiler, protected_at_runtime, protected_at_perimeter,
                 protected_by_mitigating_control]
        - type: string
          x-standard: 'SPDX: 3.0 VexJustificationType'
          enum: [componentNotPresent, vulnerableCodeNotPresent, vulnerableCodeNotInExecutePath,
                 vulnerableCodeCannotBeControlledByAdversary, inlineMitigationsAlreadyExist]
  - element: status
    scope: VexStatement
    optional: true
    state: proposed
    description: 'The status in the OpenVEX vocabulary, the one every VEX format shares: not_affected, affected,
      fixed, under_investigation. Set where the party''s own status is one of the four in other words (CSAF
      `known_not_affected` is `not_affected`). Absent where its status is not one of them.'
    schema:
      type: string
      enum:
        - not_affected
        - affected
        - fixed
        - under_investigation
      description: 'The status in the OpenVEX vocabulary, the one every VEX format shares: not_affected, affected,
        fixed, under_investigation. Set where the party''s own status is one of the four in other words (CSAF
        `known_not_affected` is `not_affected`). Absent where its status is not one of them.'
  - element: justification
    scope: VexStatement
    optional: true
    state: proposed
    description: The OpenVEX justification label for a `not_affected` status, where the party uses that vocabulary
      (OpenVEX, CSAF).
    schema:
      type: string
      enum:
        - component_not_present
        - vulnerable_code_not_present
        - vulnerable_code_not_in_execute_path
        - vulnerable_code_cannot_be_controlled_by_adversary
        - inline_mitigations_already_exist
      description: The OpenVEX justification label for a `not_affected` status, where the party uses that
        vocabulary (OpenVEX, CSAF).
  - element: status_notes
    scope: VexStatement
    optional: true
    state: proposed
    description: The basis for the statement in plain words, for the reviewer.
    schema:
      type: string
      description: The basis for the statement in plain words, for the reviewer.
  - element: evidence_refs
    scope: VexStatement
    optional: true
    state: proposed
    description: The TestEvidence records the status rests on. A `fixed` or `affected` status with none is a claim,
      and says so by being empty here.
    schema:
      type: array
      items:
        $ref: ../../../common-elements.schema.json#/$defs/Reference
      description: The TestEvidence records the status rests on. A `fixed` or `affected` status with none is a claim,
        and says so by being empty here.
