  - vulnerability_ref: estate/cexample/knowledge/vulnerability/cve-2026-00003
    software_package_ref: estate/cexample/knowledge/software-package/example-lib-2-3-0
    source:
      format: osv
      issuer: cexample SBOM store, from the GitHub Advisory Database
      document: GHSA-xxxx-xxxx-xxxx
    source_status: affected
    status: affected
    status_notes: The SBOM store matched the package by purl and reports it affected. No test here backs it.
relationships:
  - edge_type: references
    target: Vulnerability
    name: about
    cardinality: 1..1
    description: about — the vulnerability the statement concerns. Read in reverse by the affected walk.
  - edge_type: references
    target: SoftwarePackage
    name: concerns
    cardinality: 1..1
    description: concerns — the package version the statement concerns.
  - edge_type: references
    target: TestEvidence
    name: rests_on
    cardinality: 0..n
    description: rests_on — the tests that back the status.
adopts:
  - standard: OpenVEX
    version: 0.2.0
    standard_name: OpenVEX statement and status codelist
    role: the shared status vocabulary and the justification codelist, carried by reference; a document is pointed
      at, not restated
    source: https://github.com/openvex/spec
    license: Apache-2.0
    license_compatibility: compatible_reference
    disposition: tier1_value
  - standard: CSAF
    version: '2.0'
    standard_name: Common Security Advisory Framework, product_status and flags
    role: a source format; the product status categories and flags a party states are copied verbatim
    source: https://docs.oasis-open.org/csaf/csaf/v2.0/csaf-v2.0.html
    license: OASIS IPR policy (specification free to implement)
    license_compatibility: compatible_reference
    disposition: tier1_value
  - standard: CycloneDX
    version: '1.5'
    standard_name: vulnerabilities[].analysis (state, justification)
    role: a source format; the analysis state and justification a party states are copied verbatim
    source: https://cyclonedx.org/
    license: Apache-2.0
    license_compatibility: compatible_reference
    disposition: tier1_value
  - standard: SPDX
    version: '3.0'
    standard_name: security profile, VEX relationship types and justification types
    role: a source format; the relationship type and justification type a party states are copied verbatim
    source: https://spdx.dev/
    license: Community-Spec-1.0
    license_compatibility: reference_only
    disposition: tier1_value
context:
  purpose: Records one party's statement about one vulnerability in one package version, in its own words, so a
    policy can decide what it means.
  plain_description: One statement per (vulnerability, package version, party). It names the party and the format,
    keeps the party's own status word for word, and carries one of the four shared VEX statuses where the party's
    status is one of them. It covers links someone else concluded, such as a supplier's VEX or an SBOM store's
    finding. A link the estate concludes itself is not stored. It is read from the Vulnerability's `applicability`
    and the package's purl or CPE. Product Security confirms a statement (the realized record).
  use_when:
    - A supplier, a scanner, an SBOM store or a test harness says something about a vulnerability in a package,
      and the claim needs keeping with who made it.
    - A consumer or regulator asks what was verified about a known vulnerability in a shipped package.
  not_for:
    - Deciding whether something is exposed. That is a policy over these facts (policy-contract.md).
    - What an advisory says it applies to. That is the Vulnerability's `applicability`, one entry per source.
