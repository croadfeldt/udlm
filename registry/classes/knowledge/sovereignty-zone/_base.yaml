# SovereigntyZone — a coined zone name, declared in terms a peer can evaluate.
#
# The accreditation side speaks ISO 3166 (`scope.geographic_scope` — "ISO 3166 country / 3166-2
# subdivision, or a declared region grouping"). The entity side carries `sovereignty.zone`, a coined
# label like `eu-west`. Nothing connected them, so the residency-subsumption rule had nothing to
# evaluate: no stated way an entity in `eu-west` meets an accreditation scoped `DE`.
#
# This is the declaration that connects them. A zone states which jurisdictions it spans, in the same
# vocabulary the accreditation uses, so the match becomes a computation instead of an assumption.
#
# DECLARATION, NOT TRANSLATION. Mapping coined names between peers is O(N²), goes stale, and leaves
# an auditor no single answer to "why did you think this was EU?" — a question that needs exactly one.
# Every cloud coins its own region names and each publishes what jurisdiction the region sits in;
# nobody built a universal translator. Declaration is O(N) and owned by the party that knows.
#
# PHYSICAL LOCATION IS DELIBERATELY ABSENT. Three location axes stay separate, and conflating them is
# what this class exists to prevent: physical (Facility.Location — a rack, never crosses a peer
# boundary), jurisdictional (this class — the only axis peers must agree on), and authority (the URF
# `//peer/` axis — naming, not location). "eu-west is DE and NL, under EU" honours sovereignty
# without disclosing a datacenter.
#
# Knowledge family on the Vulnerability precedent: a curated record with structured attributes,
# declared by the party that holds the truth, never realized by a provider. Its lifecycle is curation
# — established at setup, then governed — not provisioning.
$id: https://udlm.dev/registry/udlm/0.1/class/SovereigntyZone/0.1.0
conforms_to: udlm/0.1
uuid: e44193cc-a41f-4bf6-bfcf-aa70029dc10e
record_type: class
class: base
resource_type: SovereigntyZone
version: 0.1.0
family: Knowledge
status: active

metadata:
  display_name: Sovereignty Zone
  description: >-
    A named sovereignty zone declared in ISO 3166 terms — what a coined label like `eu-west` actually
    means jurisdictionally. Entities cite the zone by handle; accreditations state their scope in the
    same vocabulary; the residency-subsumption match is then computable rather than assumed. Carries
    no physical location by design.
  maintainer: UDLM project
  origination_timestamp: '2026-08-09T00:00:00Z'

entity_type: SovereigntyZone

context:
  purpose: >-
    Give a coined zone name a declared meaning, so that "is this entity's placement covered by that
    accreditation?" is a question the model can answer.
  plain_description: >-
    What a zone name actually means. `eu-west` is Germany and the Netherlands, under EU law. Written
    down once by whoever knows, so every peer reads the same answer and an auditor gets exactly one.
  use_when:
    - An entity's `sovereignty.zone` needs to be checked against an accreditation's geographic scope
    - A peer must understand your zone names without a private mapping table
    - A zone spans more than one jurisdiction, or sits under a supranational regime
  not_for:
    - Physical location — a site, a rack, a datacenter. That is `Facility.Location`, and it does not
      cross a peer boundary
    - Naming an authority or a peer — that is the URF `//authority/` axis, which is naming rather
      than location
    - Recording where a workload happens to run right now. This declares what a zone MEANS, not what
      is in it; membership derives from the entities that cite it
  works_with:
    - accreditation records — `scope.geographic_scope` speaks the same ISO 3166 vocabulary
    - a realized entity's `sovereignty.zone`, which cites a zone by handle

elements:
  - element: jurisdictions
    scope: SovereigntyZone
    optional: false
    state: proposed
    description: >-
      The jurisdictions this zone spans, as ISO 3166 codes — 3166-1 for a country (`DE`), 3166-2 for
      a subdivision (`US-MN`). Required, and required to be non-empty: a zone whose jurisdictions are
      unknown cannot be matched against any accreditation, so declaring it without them records a
      name and answers nothing. More than one is normal — a zone that spans DE and NL states both,
      and an accreditation must cover all of them to cover the zone.
    schema:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        pattern: ^[A-Z]{2}(-[A-Z0-9]{1,3})?$
        description: ISO 3166-1 alpha-2, optionally with a 3166-2 subdivision (`DE`, `US-MN`).

  - element: regimes
    scope: SovereigntyZone
    optional: true
    state: proposed
    description: >-
      Supranational regimes the zone sits under (`EU`). Separate from `jurisdictions` because a
      regime is not a country and does not subsume the same way: an accreditation scoped `EU` is not
      an accreditation scoped `DE`, and §3.8 matches a distinct sovereignty regime EXACTLY rather
      than by containment. Absent means no supranational regime applies.
    schema:
      type: array
      uniqueItems: true
      items:
        type: string
        pattern: ^[A-Z][A-Z0-9-]{1,15}$

  - element: description
    scope: SovereigntyZone
    optional: true
    state: proposed
    description: >-
      What this zone is for, in the operator's own words — the sentence that makes a coined name
      legible to someone who did not coin it.
    schema:
      type: string

spec_examples:
  - jurisdictions: [DE, NL]
    regimes: [EU]
    description: Western European zone — customer data stays inside the EU.
