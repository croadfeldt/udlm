$id: https://udlm.dev/registry/udlm/0.1/class/SoftwarePackage/0.3.1
conforms_to: udlm/0.1
uuid: df4b2ff1-c6d4-4075-a355-ee85db5bc366
record_type: class
class: base
resource_type: SoftwarePackage
version: 0.3.1
family: Knowledge
status: active
metadata:
  display_name: Software Package
  description: 'A software package or library as a fact: one record per purl, shared by every SoftwareImage that
    contains it. A Knowledge class: discovered by a scanner sweep, never provider-realized. Package URL and SPDX/CycloneDX
    component identity are adopted by reference; the purl is the portable correlation id. Contained by SoftwareImage;
    references Vulnerability.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-22T00:00:00Z'
entity_type: SoftwarePackage
elements:
  - element: purl
    scope: SoftwarePackage
    optional: false
    state: canonical
    description: Package URL, the portable identity and dedup key (pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1).
      One record per purl.
    schema:
      type: string
      description: Package URL, the portable identity and dedup key (pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1).
        One record per purl.
  - element: name
    scope: SoftwarePackage
    optional: true
    state: canonical
    description: Package name, as parsed from the purl or SBOM.
    schema:
      type: string
      description: Package name, as parsed from the purl or SBOM.
  - element: version
    scope: SoftwarePackage
    optional: true
    state: canonical
    description: Package version, as parsed.
    schema:
      type: string
      description: Package version, as parsed.
  - element: type
    scope: SoftwarePackage
    optional: true
    state: canonical
    description: Package ecosystem, the purl type (rpm, deb, npm, pypi, …).
    schema:
      $ref: ../../../common-elements.schema.json#/$defs/purl_type
      description: Package ecosystem, the purl type (rpm, deb, npm, pypi, …).
  - element: license
    scope: SoftwarePackage
    optional: true
    state: canonical
    description: Declared license as an SPDX identifier (Apache-2.0), where the SBOM reports one.
    schema:
      type: string
      description: Declared license as an SPDX identifier (Apache-2.0), where the SBOM reports one.
spec_examples:
  - purl: pkg:rpm/redhat/openssl@3.0.7-18.el9?arch=x86_64
    name: openssl
    version: 3.0.7-18.el9
    type: rpm
    license: OpenSSL
relationships:
  - edge_type: references
    target: Vulnerability
    cardinality: 0..n
    description: affected_by — this package version is affected by the vulnerability (OSV / VEX). A declarative
      typed reference; the match is Policy. Non-ordering, but walked by blast-radius/impact in reverse (the CVE
      -> resource path).
adopts:
  - standard: purl
    version: 1.x
    standard_name: package URL
    role: the canonical package identifier this type's identity fields carry
    source: https://github.com/package-url/purl-spec
    license: MIT
    license_compatibility: compatible-reference
    disposition: tier1_value
  - standard: SPDX
    version: '2.3'
    standard_name: SBOM package fields / license list
    role: SBOM interchange alignment; license identifiers use the SPDX license list
    source: https://spdx.dev/
    license: Community-Spec-1.0 (license list data CC0-1.0)
    license_compatibility: reference-only
    disposition: tier1_value
  - standard: CycloneDX
    version: '1.5'
    standard_name: component / bom-ref
    role: SBOM interchange alignment (component identity and references)
    source: https://cyclonedx.org/
    license: Apache-2.0
    license_compatibility: compatible-reference
    disposition: tier1_value
context:
  purpose: Records a software package or library as one shared fact per package URL, so every image containing it
    points at the same record.
  plain_description: 'One package at one version — identified by its purl (Package URL), the portable id that carries
    ecosystem, name, and version in one string. There is exactly one record per purl no matter how many images contain
    it, which is what makes blast-radius questions cheap: find the package once, walk back to every image and container
    that includes it. Discovered by scanners; never built or provisioned.'
  use_when:
    - You need where-do-we-run-version-X-of-library-Y answerable as a graph walk.
    - You need packages linked to the advisories affecting them.
  not_for:
    - The image bundling the package — SoftwareImage contains packages.
    - The advisory itself — Vulnerability; a package is affected_by it.
  works_with:
    - SoftwareImage — the images that contain this package.
    - Vulnerability — the advisories affecting this package version.
