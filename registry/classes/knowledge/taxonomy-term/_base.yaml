      description: The term's domain. For a provider-capability term, the class, family or usage group the capability
        operates over (TRI-003).
  - element: root
    scope: TaxonomyTerm
    optional: true
    state: canonical
    description: The vocabulary root this term belongs to. Derivable by walking `parent`; recorded for query convenience.
    schema:
      type: string
      description: The vocabulary root this term belongs to. Derivable by walking `parent`; recorded for query convenience.
  - element: normalization_rules
    scope: TaxonomyTerm
