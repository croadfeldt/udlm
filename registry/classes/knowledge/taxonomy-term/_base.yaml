spec_examples:
  - term: workload-placement
    definition: The capability to schedule a workload onto a suitable host or node according to declared placement
      constraints.
    pillar: Operate
    domain: Machine
    root: architecture-capability
    normalization_rules: Map free-text mentions of scheduling, bin-packing, affinity/anti-affinity, and node selection
