metadata:
  display_name: Taxonomy Term
  description: 'A canonical vocabulary term: the normalization authority a catalog normalizes onto. A Knowledge
    class: its lifecycle is curation, never provisioning. One class serves many vocabularies, each a disjoint subtree
    under its own root (`architecture-capability`, `provider-capability`, `usage-group`, …); the `parent` chain
    up to a root keeps them disjoint.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
entity_type: TaxonomyTerm
elements:
  - element: term
    scope: TaxonomyTerm
    optional: false
    state: canonical
    description: The canonical handle items normalize onto, unique within its root.
    schema:
      type: string
      description: The canonical handle items normalize onto, unique within its root.
  - element: definition
    scope: TaxonomyTerm
    optional: false
    state: canonical
    description: What the term means; the definition items are normalized against.
    schema:
      type: string
      description: What the term means; the definition items are normalized against.
  - element: pillar
    scope: TaxonomyTerm
    optional: true
    state: canonical
    description: Top-level grouping the term rolls up to.
    schema:
