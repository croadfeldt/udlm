outputs:
  term_handle:
    type: string
    description: The canonical handle a term resolves to once curated to `canonical`. Other Knowledge entities (Capability.normalized_to,
      Alias.resolves_to) and — for provider-capability terms — provider capability declarations and Governance-Matrix
      policy targets bind to this via typed references rather than free-text.
relationships:
  - edge_type: references
    target: TaxonomyTerm
    target_field: term_handle
    cardinality: 0..1
    description: parent — this term's parent in the hierarchy. The parent chain terminates at a vocabulary root
      and never crosses into another root's subtree (keeps shared-machinery vocabularies disjoint).
context:
  purpose: Holds one canonical vocabulary term — the fixed point that free-text mentions are normalized onto.
  plain_description: 'A term with an authoritative definition, living in a named vocabulary tree (its root), with
    a parent chain that never crosses into another vocabulary. Several vocabularies share this one type while staying
    disjoint — e.g. an architecture-capability taxonomy and a provider-operation vocabulary are separate roots.
    Terms are curated — the `curation_state` property: `proposed`, `under-review`, `canonical`, `deprecated`; once
    canonical, the term''s handle is what other records bind to instead of restating names.'
  use_when:
    - You need an authoritative vocabulary that observed, free-text items normalize onto.
    - You need several disjoint controlled vocabularies without minting a new type per vocabulary.
  not_for:
    - The observed thing being normalized — Capability records normalize onto terms; the term is the authority,
      not the observation.
    - Ad-hoc classification of resources — labels on resource records cover that; TaxonomyTerm is for governed vocabularies
      with curation.
  works_with:
    - Capability — capabilities normalize onto terms (normalized_to).
    - TaxonomyTerm — the parent term; chains stay inside one vocabulary root.
