resource_type: TaxonomyTerm
version: 0.3.2
family: Knowledge
status: active
metadata:
  display_name: Taxonomy Term
  description: 'A canonical vocabulary term — the normalization authority a catalog normalizes onto (the
    ''spec'' half of the spec/reality pair; Capability is ''reality''). Formalizes docs/spec/foundations/knowledge-family.md
    §4.2. A Knowledge-family entity: its lifecycle is curation (proposed -> under-review -> canonical
    -> deprecated), never realized by a provider. Cross-cutting foundational machinery — SHARED by multiple
    vocabularies that occupy DISJOINT subtrees under distinct roots (parent chains never cross roots):
    e.g. ''architecture-capability'' (holds Capability [Knowledge], DAV''s architecture-capability sense)
    and ''provider-capability'' (the substrate provider-operation vocabulary; ADR-PROV-002). The `parent`
    chain up to a root is what keeps those vocabularies disjoint under one type.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-11T00:00:00Z'
entity_type: TaxonomyTerm
elements:
- element: term
  scope: TaxonomyTerm
  optional: false
  state: canonical
  description: Canonical term (single normalized handle) that items normalize onto. Unique within its
    root subtree.
  schema:
    type: string
    description: Canonical term (single normalized handle) that items normalize onto. Unique within its
      root subtree.
- element: definition
  scope: TaxonomyTerm
  optional: false
  state: canonical
  description: What the term means — the authoritative definition items are normalized against.
  schema:
    type: string
    description: What the term means — the authoritative definition items are normalized against.
- element: pillar
  scope: TaxonomyTerm
  optional: true
  state: canonical
  description: Top-level grouping the term rolls up to (e.g. a maturity-framework pillar).
  schema:
    type: string
    description: Top-level grouping the term rolls up to (e.g. a maturity-framework pillar).
- element: domain
  scope: TaxonomyTerm
  optional: true
  state: canonical
  description: Term domain (prefix + name). For a provider-capability term this is the resource-type domain
    the capability operates over (the Category segment of a resource-type $id, e.g. Storage, Compute,
    Network); ADR-PROV-002.
  schema:
    type: string
    description: Term domain (prefix + name). For a provider-capability term this is the resource-type
      domain the capability operates over (the Category segment of a resource-type $id, e.g. Storage,
      Compute, Network); ADR-PROV-002.
- element: root
  scope: TaxonomyTerm
  optional: true
  state: canonical
  description: The vocabulary root this term belongs to (e.g. 'architecture-capability', 'provider-capability').
    Distinct roots are disjoint subtrees sharing this one type. Derivable by walking `parent` to the top;
    recorded for query convenience.
  schema:
    type: string
    description: The vocabulary root this term belongs to (e.g. 'architecture-capability', 'provider-capability').
      Distinct roots are disjoint subtrees sharing this one type. Derivable by walking `parent` to the
      top; recorded for query convenience.
- element: normalization_rules
  scope: TaxonomyTerm
  optional: true
  state: canonical
  description: How to normalize items for this subject matter onto the term.
  schema:
    type: string
    description: How to normalize items for this subject matter onto the term.
- element: category
  scope: TaxonomyTerm
  optional: true
  state: canonical
  description: Source grouping the term was drawn from (provenance of the term itself).
  schema:
    type: string
    description: Source grouping the term was drawn from (provenance of the term itself).
- element: curation_state
  scope: TaxonomyTerm
  optional: true
  state: canonical
  description: Position in the curation lifecycle — the Knowledge-family interpretation of the four states.
    Seeded `canonical` from an authoritative taxonomy; `proposed` for a back-fill candidate a catalog
    surfaced. Promotion is a curation act applied by Policy, not by a provider.
  schema:
    enum:
    - proposed
    - under-review
    - canonical
    - deprecated
    description: Position in the curation lifecycle — the Knowledge-family interpretation of the four
      states. Seeded `canonical` from an authoritative taxonomy; `proposed` for a back-fill candidate
      a catalog surfaced. Promotion is a curation act applied by Policy, not by a provider.
spec_examples:
- term: workload-placement
  definition: The capability to schedule a workload onto a suitable host or node according to declared
    placement constraints.
  pillar: Operate
  domain: Compute
  root: architecture-capability
  normalization_rules: Map free-text mentions of scheduling, bin-packing, affinity/anti-affinity, and
    node selection onto this term.
  category: dcm-capability-taxonomy
  curation_state: canonical
outputs:
  term_handle:
    type: string
    description: The canonical handle a term resolves to once curated to `canonical`. Other Knowledge
      entities (Capability.normalized_to, Alias.resolves_to) and — for provider-capability terms — provider
      capability declarations and Governance-Matrix policy targets bind to this via typed references rather
      than free-text.
relationships:
- edge_type: references
  target: TaxonomyTerm
  target_field: term_handle
  cardinality: 0..1
  description: parent — this term's parent in the hierarchy. The parent chain terminates at a vocabulary
    root and never crosses into another root's subtree (keeps shared-machinery vocabularies disjoint).
context:
  purpose: Holds one canonical vocabulary term — the fixed point that free-text mentions are normalized
    onto.
  plain_description: 'A term with an authoritative definition, living in a named vocabulary tree (its
    root), with a parent chain that never crosses into another vocabulary. Several vocabularies share
    this one type while staying disjoint — e.g. an architecture-capability taxonomy and a provider-operation
    vocabulary are separate roots. Terms are curated — the `curation_state` property: `proposed`, `under-review`,
    `canonical`, `deprecated`; once canonical, the term''s handle is what other records bind to instead
    of restating names.'
  use_when:
  - You need an authoritative vocabulary that observed, free-text items normalize onto.
  - You need several disjoint controlled vocabularies without minting a new type per vocabulary.
  not_for:
  - The observed thing being normalized — Capability records normalize onto terms; the term is the authority,
    not the observation.
  - Ad-hoc classification of resources — labels on resource records cover that; TaxonomyTerm is for governed
    vocabularies with curation.
  works_with:
  - Capability — capabilities normalize onto terms (normalized_to).
  - TaxonomyTerm — the parent term; chains stay inside one vocabulary root.
