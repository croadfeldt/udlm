    schema:
      type: string
      description: The source grouping the term was drawn from, as provenance.
  - element: curation_state
    scope: TaxonomyTerm
    optional: true
    state: canonical
    description: 'Position in the curation lifecycle: `canonical` when seeded from an authority or adopted, `proposed`
