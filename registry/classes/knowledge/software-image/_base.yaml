metadata:
  display_name: Software Image
  description: 'An OCI image as a fact about the estate: the digest-identified artifact a Container runs, or a
    Machine boots when its operating system is delivered as an image. A Knowledge class: discovered by a scanner
    sweep, never provider-realized. The OCI image spec is adopted by reference — the digest is the identity, a
    pinned pointer names the version, and the standard''s schema is not restated. Referenced by Container and Machine
    (`runs_image`); described by a SoftwareBillOfMaterials, which lists its packages.'
  maintainer: udlm-registry
  origination_timestamp: '2026-07-22T00:00:00Z'
entity_type: SoftwareImage
elements:
  - element: digest
    scope: SoftwareImage
    optional: false
    state: canonical
    description: The image manifest digest (sha256:…), the immutable correlation id. One record per digest.
    schema:
      type: string
      description: The image manifest digest (sha256:…), the immutable correlation id. One record per digest.
  - element: repository
    scope: SoftwareImage
    optional: true
    state: canonical
    description: Repository path (registry.example.com/org/app).
    schema:
      type: string
      description: Repository path (registry.example.com/org/app).
  - element: tag
    scope: SoftwareImage
    optional: true
    state: canonical
    description: A tag observed pointing at this digest; advisory, since tags move and digests do not.
    schema:
      type: string
      description: A tag observed pointing at this digest; advisory, since tags move and digests do not.
  - element: registry
    scope: SoftwareImage
    optional: true
    state: canonical
    description: The registry host serving the image.
    schema:
      type: string
      description: The registry host serving the image.
  - element: os
    scope: SoftwareImage
    optional: true
    state: canonical
    description: Target OS from the image config (OCI platform.os).
    schema:
      $ref: ../../../common-elements.schema.json#/$defs/oci_os
      description: Target OS from the image config (OCI platform.os).
  - element: arch
    scope: SoftwareImage
