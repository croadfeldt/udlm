    disposition: tier1_value
context:
  purpose: Records an OCI image as a digest-identified fact — the thing a container runs or a machine boots, and
    the subject its software bill of materials describes.
  plain_description: 'One image, identified by its content digest (one observed `tag` is recorded, singular and
    advisory — tags move, the digest does not). It is knowledge about the estate, discovered by scanning, never
    provisioned: which `repository` and `registry` it came from and what platform it targets (`os` and `arch`).
    A container image and a bootable operating-system image are the same kind of artifact and the same class. What
    is inside the image is not listed here: a SoftwareBillOfMaterials describes the image and lists its packages,
    so two scans of one image are two documents about one record. That chain is what turns which containers run
    something shipping a given library from an investigation into a graph walk.'
  use_when:
    - You need every running container tied to the exact image digest it runs, deduplicated across the fleet.
    - You need a host that boots an image tied to that image, so a fix is a new image and not a package update.
    - 'You need the subject a bill of materials hangs from: image ← document → packages → vulnerabilities.'
  not_for:
    - The running workload — Container runs an image; this is the image as a fact.
    - A package inside the image — SoftwarePackage, listed by the image's SoftwareBillOfMaterials.
  works_with:
    - Container and Machine — the things that run this image.
    - SoftwareBillOfMaterials — the document that describes the image and lists its packages.
