immutable:
- guest_os.type
outputs:
  ip_addresses:
    type: array
    description: Assigned guest IP addresses (all interfaces), IPv4-first ordering. The canonical binding
      surface for LB backend pools, DNS records, and monitoring targets.
  primary_ip:
    type: string
    description: The primary/management address — first of ip_addresses; the single-address convenience
      most bindings want.
  hostname:
    type: string
    description: Realized guest hostname (FQDN where the realm provides one).
  mac_addresses:
    type: array
    description: Realized MAC per interface, ordered as spec.networks[]. Binding surface for DHCP reservation
      and switch-port records.
  provider_handle:
    type: string
    description: The provider-native identifier of the realized VM (opaque; correlation/ops use only —
      never a portable reference).
  observed_run_state:
    type: string
    description: Observed run state at last reconciliation (running|stopped|suspended) — the discovered
      counterpart of spec.run_state.desired_state. Renamed from `run_state` (0.7.0) so desired (spec)
      and observed (outputs) never share a name.
  target_segment:
    type: string
    description: 'Realize-time placement fact (ADR-011 two-phase reserve): a reference to the Network.VLAN
      segment the reserved/realized placement can reach (adopt-not-absorb — the segment id/encapsulation
      live on the Network.VLAN). This is the declarable binding source for a fulfillment:provider dependency
      whose criteria are simply the target segment — e.g. a Network.IPAddress allocated on the reachable
      segment (ADR-009 §3 worked example: bind target_segment -> the IP request''s segment_ref). It is
      a shared-reference fact, NOT the vNIC/MAC/host-networking (those are the VM provider''s own internal
      facts, never cross-provider criteria).'
