adopts:
- standard: Redfish
  version: '2024.4'
  standard_name: ComputerSystem
  role: 'Vendor-neutral compute-system representation spanning physical AND virtual (Redfish ComputerSystem
    SystemType: Physical | Virtual | Composed | Partitioned) - the single representative standard for
    the Compute.* family (shared with Compute.BareMetalHost). Provider-NATIVE realizations (KubeVirt,
    a hypervisor platform, a public cloud, ...) are declared on the provider support matrix, not on the
    substrate type.'
  source: https://www.dmtf.org/standards/redfish
  license: DMTF
  license_compatibility: compatible-reference
  disposition: tier1_value
- standard: KubeVirt
  version: '>=1.2'
  standard_name: VirtualMachine / VirtualMachineInstance
  role: k8s-native VM realization vocabulary (domain cpu/memory, interfaces->networks, volumes, runStrategy/power)
    — the parallel to Metal3 for bare metal
  source: https://kubevirt.io/
  license: Apache-2.0
  license_compatibility: compatible-reference
  disposition: tier1_value
context:
  purpose: Declares a virtual machine — sizing, guest OS, storage requirements, network attachments, placement
    — as portable intent any virtualization provider can realize.
  plain_description: 'The request for one VM: how big — a named size class (`instance_size`), or explicit
    `cpu` and `memory` in its place — what `guest_os`, what storage it needs (`storage` minima and a governed
    `storage_tier`), which Storage.Layout describes its disks (`layout_ref`), and which existing networks
    its NICs attach to (`networks`, each entry naming a `network_ref`). Placement is a selection of an
    existing location, not an invention. Once the provider builds it, the record carries realized facts
    back: IP addresses, hostname, provider handle. The hypervisor (KubeVirt, libvirt, a cloud) is a provider
    detail, never part of the type.'
  use_when:
  - You need to request a VM with declared size, OS, storage requirements, and network attachments, portable
    across hypervisors.
  - You need VM records in the dependency graph so ordering (host before VM, VM before its services) is
    derivable.
  - You need a VM's disk shape and addresses to reference existing Storage.Layout / Network.IPAddress
    records rather than duplicate them.
  not_for:
  - The physical machine it runs on — Compute.BareMetalHost.
  - A containerized workload — Compute.Container; the VM carries a full guest OS.
  - The per-disk shape (sizes, boot designation) — Storage.Layout; the VM references one via layout_ref.
  - The vNIC as a device record — that is Hardware.NetworkInterface with a virtual device_class; the VM's
    networks list declares attachment intent, not device inventory.
  works_with:
  - Storage.Layout — the disk layout the VM realizes (per-disk shape, boot designation).
  - Network.VirtualNetwork — the networks the VM's NICs attach to.
  - Storage.Volume — the consumable volumes realizing its layout entries.
  - Facility.Location — where the VM is placed (selected from existing places, policy-governed).
  - Network.IPAddress — pre-allocated addresses the VM consumes.
spec_examples:
- cpu:
    count: 4
    sockets: 2
    cores_per_socket: 2
  memory:
    size: 16GB
  guest_os:
    type: linux-server-9
    version: '9.4'
  layout_ref: web-01-layout
  storage:
    min_iops: 5000
    min_replication: 2
    encryption: true
  storage_tier: performance
  placement:
    location_ref: dc-west-rack-3
    zone: zone-a
    affinity:
    - target: web-tier
      rule: anti_affinity
  networks:
  - name: eth0
    network_ref: app-net
    mac: 00:11:22:33:44:55
    ip_address_ref: vm-mgmt-ip
  run_state:
    desired_state: running
  firmware:
    type: uefi
    secure_boot: true
    vtpm: true
spec_constraints:
  description: 'Deliberate exclusions: GPU/PCI passthrough and SR-IOV are Provider-Class SharedDataElements
    (ADR-038) — provider-variable capability, not portable base surface. Day-0 guest personalization (cloud-init/user-data)
    is an open design decision (process concern vs VM field) — tracked on the type, not silently absent.
    Per-disk shape (sizes, boot designation) lives on Storage.Layout, referenced via layout_ref.'
  oneOf:
  - required:
    - instance_size
  - required:
    - cpu
    - memory
