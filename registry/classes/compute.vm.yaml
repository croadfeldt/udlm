metadata:
  authority: canonical
  display_name: Compute.VM Type Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-07-27T21:00:00Z'
  title: Compute.VM Type Class
  description: The VM Type Class — extends the Compute Base Class (cpu/memory/storage/storage_tier/guest_os,
    inherited) with VM-specific SharedDataElements, under the Liskov invariant (add or refine, never contradict).
    A provider Class (Compute.VM.OCPVirt, …) extends this further. The generator compiles this class +
    its ancestors into today's flat Compute.VM resource-type spec.
  prompt_version: class-p0-keystone-2026-07-27
elements:
- element: firmware
  scope: Compute.VM
  optional: true
  state: canonical
  description: 'Guest firmware surface, flat-spec object shape adopted (2026-07-29 reconciliation, A7
    — the flat VM''s firmware object won over the earlier bare-string draft): the firmware interface (`type`),
    UEFI Secure Boot, and virtual TPM — portable across every major virtualization stack. The governed
    `vm_firmware` vocabulary declared below governs the `type` sub-field''s values; the provider naturalizes
    to its native setting.'
  values:
    reference_data_type: vm_firmware
  schema:
    type: object
    additionalProperties: false
    description: Guest firmware surface — portable across every major virtualization stack (Redfish Boot.BootSourceOverrideMode,
      KubeVirt firmware/TPM, cloud UEFI/trusted-launch). Required by modern guests (Win11-class needs
      uefi + secure_boot + vtpm). Governed vocabulary `vm_firmware` (ADR-038 §2); name-selectable but
      requirements-authoritative (ADR-036). Profile decides bare-vs-reference.
    properties:
      type:
        enum:
        - bios
        - uefi
        default: uefi
        description: Firmware interface presented to the guest.
      secure_boot:
        type: boolean
        default: false
        description: 'UEFI Secure Boot. Only valid with type: uefi (policy-validated).'
      vtpm:
        type: boolean
        default: false
        description: Virtual TPM 2.0 device presented to the guest.
- element: boot_order
  scope: Compute.VM
  optional: true
  state: proposed
  description: Ordered boot device preference (VM-specific; not meaningful for BareMetal or Container).
  schema:
    type: array
    items:
      type: string
- element: layout_ref
  scope: Compute.VM
  optional: true
  state: canonical
  description: The Storage.Layout this VM realizes — handle/uuid reference to an existing Storage.Layout
    whose entries describe the VM's disks (per-disk shape, boot designation, storage tier). Common-elements
    Refere
  schema:
    description: The Storage.Layout this VM realizes — handle/uuid reference to an existing Storage.Layout
      whose entries describe the VM's disks (per-disk shape, boot designation, storage tier). Common-elements
      Reference (handle string or {uuid, handle} object), following the location_ref/network_ref precedent.
      Also carried as a references->Storage.Layout relationship (storage_layout).
    oneOf:
    - type: string
      description: Short form — the handle of an existing Storage.Layout.
    - $ref: ../../common-elements.schema.json#/$defs/Reference
- element: networks
  scope: Compute.VM
  optional: true
  state: canonical
  description: Network attachment INTENT — each entry SELECTS an existing Network.VirtualNetwork (platform-layer
    and/or provider-advertised) the NIC attaches to; the responsible network provider + policy decide
    elig
  schema:
    type: array
    description: Network attachment INTENT — each entry SELECTS an existing Network.VirtualNetwork (platform-layer
      and/or provider-advertised) the NIC attaches to; the responsible network provider + policy decide
      eligibility. The VM references existing networks, it does not define network segments itself.
    items:
      type: object
      required:
      - network_ref
      properties:
        name:
          type: string
          description: Local NIC name, e.g. eth0.
        network_ref:
          description: The Network.VirtualNetwork this interface attaches to — common-elements Reference
            (handle string or {uuid, handle} object); resolvable, policy-walkable, never an opaque string.
          oneOf:
          - type: string
            description: Short form — the handle of an existing Network.VirtualNetwork.
          - $ref: ../../common-elements.schema.json#/$defs/Reference
        mac:
          type: string
          description: Optional requested MAC address.
        ip_address_ref:
          description: A pre-allocated Network.IPAddress to bind to this interface (optional — omitted
            means the address service allocates at realization). Common-elements Reference shape.
          oneOf:
          - type: string
            description: Short form — the handle of an existing Network.IPAddress.
          - $ref: ../../common-elements.schema.json#/$defs/Reference
- element: placement
  scope: Compute.VM
  optional: true
  state: canonical
  description: Placement INTENT expressed as a SELECTION of an existing Facility.Location (populated by
    a platform data layer and/or a Facility.Location provider), plus affinity relative to other existing
    resources.
  schema:
    type: object
    description: 'Placement INTENT expressed as a SELECTION of an existing Facility.Location (populated
      by a platform data layer and/or a Facility.Location provider), plus affinity relative to other existing
      resources. Policy governs which locations a given consumer may select; the VM only references one
      — it does not define locations itself (ADR-009 §4: guidance, not a gate).'
    properties:
      location_ref:
        type: string
        description: handle/uuid of an existing Facility.Location the VM is placed in — chosen from the
          eligible set (platform-layer + provider-advertised, policy-filtered). Also carried as a references->Facility.Location
          relationship.
      zone:
        type: string
        description: Availability/sovereignty zone constraint, selected from the zones the provider advertises
          for the chosen location; resolved against that location.
      affinity:
        type: array
        description: Co-location / separation intent relative to OTHER named resources (not nodes). Each
          target is resolved at reserve, so a pre-known UUID is not required.
        items:
          type: object
          required:
          - target
          - rule
          properties:
            target:
              type: string
              description: Handle OR label-selector of an existing resource to co-locate with / avoid,
                resolved at reserve (ADR-025/AEP-124) - you do not need its UUID in advance.
            rule:
              enum:
              - affinity
              - anti_affinity
            selector:
              type: object
              description: 'Alternative to a handle: match target(s) by labels (key/value).'
              additionalProperties:
                type: string
- element: run_state
  scope: Compute.VM
  optional: true
  state: canonical
  description: Desired guest RUN state the provider drives to (e.g. KubeVirt runStrategy). Distinct from
    the four-state lifecycle_state; snapshot/restore are separate operations, not run states. The discovered
    count
  schema:
    type: object
    description: Desired guest RUN state the provider drives to (e.g. KubeVirt runStrategy). Distinct
      from the four-state lifecycle_state; snapshot/restore are separate operations, not run states. The
      discovered counterpart is outputs.observed_run_state.
    properties:
      desired_state:
        enum:
        - running
        - stopped
        - suspended
        default: running
        description: Target guest run state.
- element: guest_os
  scope: Compute.VM
  optional: true
  state: canonical
  description: 'The requested operating system. Flat-spec shape adopted (2026-07-29 reconciliation, A4
    — the flat VM''s guest_os won over the earlier {family, version} draft): portable form is a data_reference
    to an os_image reference-data vocabulary (ADR-012) the target provider advertises via capability discovery
    (ADR-004); inline {type, version} is the portability_breaking escape. Proposed pending the OS-standardization
    catalog work (task #30). Redeclared at VM scope (identical refinement) so the VM tier may freeze guest_os.type
    — tighten at your scope, never above.'
  schema:
    description: 'Guest operating system. Portable form is a reference to an os_image reference-data vocabulary
      (ADR-012; layering §3.7) the target provider advertises via capability discovery (ADR-004); policy
      validates membership at request. Inline is the portability_breaking escape. Optional at the data
      layer (bare-instantiation philosophy): a VM may be declared by sizing alone; a profile MAY require
      it.'
    oneOf:
    - type: object
      required:
      - type
      additionalProperties: false
      properties:
        type:
          type: string
          description: 'Inline OS identifier (e.g. linux-server-9). portability_breaking: a value with
            no os_image vocabulary entry — a review finding.'
        version:
          type: string
          description: Inline OS version (e.g. 9.4).
    - allOf:
      - $ref: ../../data-reference.schema.json#/$defs/data_reference
      - required:
        - reference_data_type
        properties:
          reference_data_type:
            const: os_image
