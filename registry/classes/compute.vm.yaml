  title: Compute.VM Type Class
  description: >-
    The VM Type Class — extends the Compute Base Class (cpu/memory/storage/storage_tier/guest_os,
    inherited) with VM-specific SharedDataElements, under the Liskov invariant (add or refine, never
    contradict). A provider Class (Compute.VM.OCPVirt, …) extends this further. The generator compiles
    this class + its ancestors into today's flat Compute.VM resource-type spec.
  prompt_version: class-p0-keystone-2026-07-27
elements:
  - element: firmware
    scope: Compute.VM
    optional: true
    state: canonical
    description: >-
      Guest firmware surface, flat-spec object shape adopted (2026-07-29 reconciliation, A7 —
      the flat VM's firmware object won over the earlier bare-string draft): the firmware
      interface (`type`), UEFI Secure Boot, and virtual TPM — portable across every major
      virtualization stack. The governed `vm_firmware` vocabulary declared below governs the
      `type` sub-field's values; the provider naturalizes to its native setting.
    values:
      reference_data_type: vm_firmware
    schema:
      type: object
      additionalProperties: false
      properties:
        type:
          enum: [bios, uefi]
          default: uefi
          description: Firmware interface presented to the guest (values governed by the vm_firmware vocabulary).
        secure_boot:
          type: boolean
          default: false
          description: "UEFI Secure Boot. Only valid with type: uefi (policy-validated)."
        vtpm:
          type: boolean
          default: false
          description: Virtual TPM 2.0 device presented to the guest.
  - element: boot_order
    scope: Compute.VM
    optional: true
    state: proposed
    description: Ordered boot device preference (VM-specific; not meaningful for BareMetal or Container).
    schema:
      type: array
      items: { type: string }

