metadata:
  authority: canonical
  display_name: Automation.OSPatch Type Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-07-27T22:00:00Z'
  description: 'The portable OS-patching process: the definition every engine shares. It names no engine; it is
    what policy gates, schedules reference and compliance reports against, and what a provider must satisfy to declare
    `execute_workflows / Automation.OSPatch`. outputs-exempt: each run is a Job whose `results` and `completed_at` carry the outcome; the latest run is read from the Job records, never copied up (row 116).'
  prompt_version: class-p1-process-pilot-2026-07-27
elements:
  - element: targets
    scope: Automation.OSPatch
    state: canonical
    description: 'The hosts to patch: references to Machine records or to a grouping.'
    schema:
      type: array
      items:
        type: string
      description: 'The hosts to patch: references to Machine records or to a grouping.'
  - element: patch_policy
    scope: Automation.OSPatch
    state: canonical
    description: 'What to patch, a bounded codelist: security, all, kernel.'
    schema:
      type: string
      enum:
        - security_only
        - all_updates
        - cve_list
      description: 'What to patch, a bounded codelist: security, all, kernel.'
  - element: reboot_policy
    scope: Automation.OSPatch
    state: canonical
    description: 'Reboot behaviour, a bounded codelist: never, if-required (may name a maintenance window), always.'
    schema:
      type: string
      enum:
        - never
        - if_required
        - always
      description: 'Reboot behaviour, a bounded codelist: never, if-required (may name a maintenance window), always.'
  - element: exclusions
    scope: Automation.OSPatch
    optional: true
    state: canonical
    description: Packages held back as known fragile.
    schema:
      type: array
      items:
        type: string
      description: Packages held back as known fragile.
coverage:
  use_cases:
    - scoped-class/multi-provider-engine-swap
    - scoped-class/liskov-contradict-refused
  flows:
    - docs/flows/scoped-class-lifecycle.md
context:
  purpose: The portable OS-patching process — what org policy gates, schedules reference, and compliance reports
    against, independent of which engine executes it.
  plain_description: 'Declares that hosts get patched: which package sets, within which maintenance windows, at
    which severity floor. Both engines (blue today, green tomorrow) satisfy this one definition — swapping engines
    never touches the declared process.'
  use_when:
    - You schedule or gate OS patching as governed automation
    - You need engine-portable patch compliance reporting
  not_for:
    - Application deployment (a different process family)
    - Ad-hoc one-host package installs
  works_with:
    - Machine.BareMetalHost — the patched substrate
    - Machine.VM — the patched substrate
    - Automation.OSPatch.EngineBlue / EngineGreen — the executing engines
spec_examples:
  - targets:
      - role:web
    patch_policy: security_only
    reboot_policy: if_required
    inputs_schema:
      type: object
      properties:
        window:
          type: string
    outputs_schema:
      type: object
      properties:
        packages_updated:
          type: integer
    idempotency: idempotent
    compensation: none
