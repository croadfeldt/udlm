uuid: 90de377f-8c9f-4a03-8f11-8f72eabb90a4
record_type: class
class: base
resource_type: Automation
version: 1.1.0
family: Process
status: active
metadata:
  authority: canonical
  display_name: Process Base Class
  maintainer: UDLM maintainers
  origination_timestamp: '2026-07-27T22:00:00Z'
  description: >-
    The Base Class of the Process family (ADR-038) — automation intent, the portable "what a run is"
    that every process shares regardless of engine. The realization-plan flags Process as the likely
    most-used class model: platform-to-platform automation migration is recurring where
    resource-provider migration is episodic. A Provider Class (an automation engine) naturalizes this
    intent; two engines declaring the same Type Class is the multi-provider declaration.
  prompt_version: class-p1-process-pilot-2026-07-27
elements:
  - element: inputs_schema
    scope: Automation
    state: canonical
    description: The typed parameters the run accepts (a declarative JSON-Schema for the run's inputs).
    schema: { type: object }
  - element: outputs_schema
    scope: Automation
    state: canonical
    description: The typed results the run publishes (E2 — every engine must satisfy it).
    schema: { type: object }
  - element: idempotency
    scope: Automation
    state: canonical
    description: Re-run semantics — a bounded codelist (PVD-001 form b), fixed semantics not a growing vocabulary.
    schema: { type: string, enum: [idempotent, at-most-once, unsafe-repeat] }
  - element: timeout
    scope: Automation
    optional: true
    state: canonical
    description: Maximum run duration (ISO 8601 duration).
    schema: { type: string, pattern: "^P" }
  - element: retry_policy
    scope: Automation
    optional: true
    state: canonical
    description: How a failed run retries.
    schema:
      type: object
      properties:
        max_attempts: { type: integer, minimum: 1 }
        backoff: { type: string, enum: [none, linear, exponential] }
  - element: compensation
    scope: Automation
    state: canonical
    description: What undo means, if anything — a bounded codelist. Rollback is a DIFFERENT process type, declared honestly.
    schema: { type: string, enum: [none, declared] }
  - element: affected_entities
    scope: Automation
    optional: true
    state: canonical
    description: Which records this run may mutate — the blast-radius declaration (references).
    schema: { type: array, items: { type: string } }

coverage:
  use_cases:
    - scoped-class/author-scoped-class
    - scoped-class/multi-provider-engine-swap
  flows:
    - docs/flows/scoped-class-lifecycle.md
