  maintainer: UDLM maintainers
  origination_timestamp: '2026-07-27T22:00:00Z'
  description: 'The Base of the Process family: automation intent, the portable statement of what a run is, independent
    of engine. A provider (an automation engine) naturalizes it; two engines declaring the same Type is the multi-provider
    declaration, and engine migration is a provider swap on an untouched definition. outputs-exempt: an Automation
    is a definition; the run is a Job record and the Job carries the outputs.'
  prompt_version: class-p1-process-pilot-2026-07-27
