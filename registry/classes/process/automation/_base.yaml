context:
  purpose: Declares an automation — what a run is, portable across engines — so any engine that exposes run, status
    and cancel can execute it.
  plain_description: 'The definition of something that can be run: what it takes in, what it gives back, whether
    running it twice is safe, how long it may take, how it retries and how it is undone. Executing it produces a
    Job record, which is the receipt. An order at this Base is satisfied by any engine that offers any Automation
    type.'
  use_when:
    - You need to register a runnable definition without committing to an engine or a type of automation.
    - You want the portable contract every engine must honor before a specific type adds its own fields.
  not_for:
    - A run — that is a Job.
    - A specific automation with its own fields — order the Type (Automation.OSPatch and kin).
  works_with:
    - Job — the receipt of running it.
    - Automation.OSPatch — a Type that narrows it.
spec_examples:
  - inputs_schema:
      type: object
      properties:
        target:
          type: string
    outputs_schema:
      type: object
      properties:
        changed:
          type: boolean
    idempotency: idempotent
    timeout: PT30M
    compensation: none
