# ─────────────────────────────────────────────────────────────────────────────
# TIER 1 — the BASE class. The mechanism, and nothing else.
#
# NO `constituents:` here. That is not a style choice — class.schema.json's
# constituents property is "permitted on type and provider tiers, NEVER base"
# (maintainer ruling 2026-08-03). The base declares what a composition IS;
# it never declares one.
#
# NO values anywhere. Every element declares a SHAPE. Rule 41 (NDF-001).
# ─────────────────────────────────────────────────────────────────────────────
$id: https://udlm.dev/registry/udlm/0.1/class/Template/0.1.0
conforms_to: udlm/0.1
uuid: 841085df-9bdb-43ff-96c9-309132f8560d
record_type: class
class: base
resource_type: Template
version: 0.1.0
family: Resource
status: active

metadata:
  display_name: Template — the orderable composition
  maintainer: UDLM maintainers
  origination_timestamp: '2026-08-07T00:00:00Z'
  description: >-
    A consumable composition: an orderable unit assembled from other classes and references, ordered
    once and realized many times. The Base Class carries only the composition MECHANISM — how a
    composition refines another, how much of itself it exposes, what sovereignty floor it must hold,
    and which non-isolating groupings its realized parts join. It declares no constituents: a Base
    Class states what a composition is, never what any particular composition contains.

elements:

  # ── the ladder ──────────────────────────────────────────────────────────────
  # Pattern -> Template -> System is a refinement chain by REFERENCE, not three
  # states of one record. ADR-033 claims all three are states, then also claims
  # "one Pattern -> many Templates, one Template -> many Systems". States are 1:1;
  # that cardinality means three records. This element is the chain.
  - element: refines
    scope: Template
    optional: true
    state: proposed
    description: >-
      The composition this one refines — a URF to another Template class. A Template naming concrete
      classes refines a Pattern naming capabilities; a provider projection refines the Template. Absent
      means this is the top of its chain. Never a copy of the refined composition: the chain is walked,
      not flattened (DRV-001).
    schema:
      type: string
      format: udlm-ref-url

  # ── how much of itself the composition exposes ──────────────────────────────
  # Moved off catalog-item.schema.json, where it currently lives as an
  # authored field on a record that should be a projection.
  - element: composition_visibility
    scope: Template
    optional: false
    state: proposed
    description: >-
      How constituents surface as first-class entities once realized. opaque = only the System's uuid
      is addressable; transparent = every constituent is its own entity with a deterministic uuid;
      selective = a declared subset. Governs what a consumer can reference, operate on, and be billed
      for — not merely what a UI renders.
    schema:
      type: string
      enum: [opaque, transparent, selective]

  # ── SOVEREIGNTY: data carrying an operational constraint ────────────────────
  # UDLM codifies and communicates; it never vets and never enforces (ADR-057).
  # The base declares the SHAPE of the floor. No zone, no classification, no
  # value of any kind lives here.
  #
  # `cohesion` is the element that does not exist anywhere today, and it is the
  # one a composite actually needs: it is what makes the constraint JOINT.
  - element: sovereignty_floor
    scope: Template
    optional: true
    state: proposed
    description: >-
      The sovereignty requirement this composition must hold, carried as immutable data and
      communicated to the Governance Matrix, which decides admission (ADR-057 — UDLM codifies, does
      not vet). Realized onto each constituent's `sovereignty` block at placement. `cohesion` is the
      part no single-resource constraint has: it says whether every constituent must satisfy the floor
      in the SAME zone, or each independently. A three-tier app whose database lands in-zone and whose
      web tier lands out-of-zone is valid at every constituent and wrong as a whole; only cohesion
      catches it.
    schema:
      type: object
      additionalProperties: false
      properties:
        zone:
          type: string
          description: >-
            Sovereign zone the composition must be placed within. Vocabulary is UNRESOLVED (#385 —
            zones vs ISO 3166 accreditation subjects); this element cannot be authored with a real
            value until that lands.
        classification:
          type: string
          description: Data classification floor the placement must satisfy.
        cohesion:
          type: string
          enum: [same_zone, per_constituent]
          description: >-
            same_zone = every constituent must land in ONE zone satisfying the floor — a joint
            constraint, evaluable only once all placements are known, which is why placement sits
            inside the convergence loop rather than after it. per_constituent = each satisfies the
            floor independently.

  # ── NAMESPACE: grouping without isolation ───────────────────────────────────
  # Tenancy is a border; a namespace is a grouping. Different enforcement_model
  # on the same primitive (Grouping): tenant_boundary is a structural lock
  # with exclusivity `one`; resource_grouping is advisory with exclusivity `many`.
  #
  # The System's OWN grouping is NOT declared here — it is derived (membership is
  # a URF criterion over composite_uuid, never a stored member list). Only
  # groupings that cannot be derived are declared.
  - element: groupings
    scope: Template
    optional: true
    state: proposed
    description: >-
      Additional NON-isolating groupings the realized constituents join — cost center, project,
      business unit. References Grouping records of class `resource_grouping` (advisory
      enforcement, a member may belong to many). Deliberately NOT the System's own grouping, which is
      derived from the composite uuid and never stored (DRV-001), and deliberately NOT a tenant: a
      tenant_boundary is an isolation border with a structural exclusivity lock, and it is carried on
      the realized entity's `tenant_uuid`, not chosen by a Template.
    schema:
      type: array
      items:
        type: string
        format: udlm-ref-url

coverage:
  use_cases: []          # TODO before this can land — rule-36 completeness gate
  flows: []
