# ─────────────────────────────────────────────────────────────────────────────
# TIER 5 — the SYSTEM. The realized instance. All three land here, for real.
#
# This is a realized-entity.schema.json record — the shape that already ships.
# System is NOT a class and NOT a fourth tier: it is the instance, which is why
# ADR-033's "Pattern/Template/System = Intent/Requested/Realized" never sat
# right. Those three are records in a refinement chain, and each one runs the
# four states independently. This record has its own intent/requested/realized.
# ─────────────────────────────────────────────────────────────────────────────
uuid: 3385cdad-0fd1-49d0-a447-f488961d57bb
handle: appteam/shop-prod                    # tenant-scoped handle (identifier-scheme §3)
conforms_to: udlm/0.1

resource_type: Template.Application          # the PORTABLE two-segment name
type_version: 1.0.0
type_ref: https://udlm.dev/registry/udlm/0.1/class/Template.Application.AcmeThreeTier/1.0.0
# ^ pins WHICH spec it was realized against — after placement that is the provider
#   class. Same carrier the #402 collapse check already uses. No new field.

lifecycle_state: Realized

# ═════════════════════════════════════════════════════════════════════════════
# TENANCY — the border
# ═════════════════════════════════════════════════════════════════════════════
# REQUIRED, exactly one, at every lifecycle state (TEN-001/TEN-003, [D3]).
# The System belongs to AppTeam. PlatformOps authored the template and owns the
# catalog record; ownership of the ORDERED THING is the consumer's.
tenant_uuid: 69fa6f6f-7b73-4d3c-92a6-8e5001ca5f00        # AppTeam

states:
  intent:
    fields:
      exposure: private_network
      high_availability: true
    at: '2026-08-07T09:00:00Z'
    time_source: dcm-api
  requested:
    fields:
      exposure: private_network
      transport_security: true               # collapsed by the grouped clause — only value offered
      high_availability: true
    at: '2026-08-07T09:00:04Z'
    time_source: dcm-api
  realized:
    fields:
      exposure: private_network
      transport_security: true
      high_availability: true
    at: '2026-08-07T09:06:12Z'
    time_source: provider-callback

# ═════════════════════════════════════════════════════════════════════════════
# CONSTITUENTS — the PARTS. Every one is AppTeam's. GRP-INV-002 requires it.
# ═════════════════════════════════════════════════════════════════════════════
#   "Constituent relationships may not cross tenant_boundary group boundaries"
#   — non-overridable, regardless of profile or enforcement model.
#
# The namespace and the VLAN are NOT here. They are PlatformOps-owned; listing
# them as constituents would be an invariant violation, not a style problem.
constituents:
  - component_id: database
    resource_type: Data.Database
    instance_uuid: c2ec2fda-654b-4bb6-8dae-5bdf0c108da7
    provided_by: external
    lifecycle_state: Realized
  - component_id: app
    resource_type: Compute.Container
    instance_uuid: c9bd301f-c0f2-4871-91d7-916378cad4c4
    provided_by: self
    lifecycle_state: Realized
  - component_id: web
    resource_type: Compute.Container
    instance_uuid: c6baee20-0117-4dd6-88fd-cb9503455ca8
    provided_by: self
    lifecycle_state: Realized

# ═════════════════════════════════════════════════════════════════════════════
# DEPENDENCIES — the EDGES. Where everything cross-tenant lives.
# ═════════════════════════════════════════════════════════════════════════════
# `edge_type` is ALREADY in the shipped enum: depends_on | references |
# contained_by | binds_to. The instance can express the tenancy-safe distinction
# TODAY. The catalog item cannot — its constituents have no edge_type, so every
# one is implicitly containment.
#
# That asymmetry is the gap in one line: THE TEMPLATE CANNOT DECLARE WHAT THE
# SYSTEM IS REQUIRED TO RECORD.
dependencies:
  - edge_type: binds_to
    target_uuid: 4b7857ed-f34e-49b7-9e77-8a35bfb75691     # Platform.Namespace
    target_handle: platformops/ocp-prod/ns-appteam-shop
    bound_field: namespace
    resolved_at: '2026-08-07T09:02:00Z'
    # PlatformOps-owned. A STAKE, not ownership (ownership-sharing-allocation
    # §2.3). Backed by cross_tenant_authorization 03c76693-… (CTX-001).

  - edge_type: binds_to
    target_uuid: 9e4acf81-e521-4c64-b2f1-f98ff7d581c3     # Network.VLAN
    target_handle: platformops/vlan-1042
    bound_field: network_attachment
    resolved_at: '2026-08-07T09:02:00Z'
    # Shareable. PlatformOps can see every active stake — which is how they know
    # who is affected by a planned decommission.

  - edge_type: references
    target_uuid: 6aacea59-9e26-46fe-9ead-a7086113f89c     # the nightly backup Job
    resolved_at: '2026-08-07T09:06:30Z'
    # A bound ACTIVITY. Terminal-lifecycle, operates on the stack, is not part of
    # it. As containment it would be decommissioned in reverse-topological order
    # with the stack — meaningless for a completed run.

# ═════════════════════════════════════════════════════════════════════════════
# SOVEREIGNTY — data carrying an operational constraint, now BACKED
# ═════════════════════════════════════════════════════════════════════════════
# Realized from immutable/createOnly type fields — cannot change without replace
# plus Governance-Matrix re-evaluation.
#
# `plane_attestations` is the "backed, not merely declared" part: a zone and a
# classification alone record the CLAIM, not its authorization.
sovereignty:
  zone: eu-central-sovereign
  classification: restricted
  plane_attestations:
    - plane: data
      accreditation_uuid: 03c76693-24d1-41cf-927a-2bb5d42ddfd6
      verification_result: verified
      verified_at: '2026-08-07T09:05:58Z'
    - plane: control
      accreditation_uuid: 03c76693-24d1-41cf-927a-2bb5d42ddfd6
      verification_result: verified
      verified_at: '2026-08-07T09:05:58Z'

# ⚠️  WHAT IS NOT CHECKED ANYWHERE TODAY:
#     cohesion: same_zone. Each of database/app/web carries its own `sovereignty`
#     block, each independently verified. NOTHING compares them. If web had landed
#     in eu-west-sovereign, every per-constituent gate would still pass.
#     This is the joint constraint, and it is why placement has to sit INSIDE the
#     convergence loop: it can only be evaluated once all placements are known,
#     and a failure has to re-place the others.

status:
  conditions: []

metadata:
  display_name: Shop (production)
