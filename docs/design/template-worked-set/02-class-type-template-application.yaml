# ─────────────────────────────────────────────────────────────────────────────
# TIER 2 — the TYPE class. The CATEGORY OF SERVICE. This is the GUI nav.
#
# Note what it does NOT have: constituents. A category is not a composition.
# The type tier is *permitted* to carry constituents (the 2026-08-03 ruling
# allows type and provider) — a Pattern would use that. A category does not.
#
# Note what it DOES have: `context`. That block is permitted ONLY on a type-tier
# class, and its own description says "TYPE-CATALOG renders from it". The GUI
# surface you asked for is already at the tier you picked, already prose-homed,
# already gated (#323 — prose has one audience-facing home).
#
# This type earns its class under the rule the Job ruling set (2026-08-04: ONE
# class, no per-domain subtypes, domain filtering is a DERIVED facet): a category
# is a Type Class only if it ADDS ELEMENTS. Application adds three.
# ─────────────────────────────────────────────────────────────────────────────
