conforms_to: udlm/0.1
uuid: c3bdca77-672a-4382-b67a-2fe792862990
record_type: class
class: type
resource_type: Template.Application
parent: Template
version: 0.1.0
family: Resource
status: active

metadata:
  display_name: Application Template
  maintainer: UDLM maintainers
  origination_timestamp: '2026-08-07T00:00:00Z'
  description: >-
    The category of service whose yield is a running application — a MAINTAINED outcome (reconciled,
    drift-checked, decommissioned), as opposed to Template.Workflow whose yield is terminal.

context:
  purpose: >-
    Order an application as one unit — its tiers, their wiring, and the operational activities bound
    to it — rather than assembling the parts by hand and remembering how they connect.
  plain_description: >-
    An application you can order. You choose how it is exposed and which release stream it tracks;
    everything else is composed for you and stays reconciled.
  use_when:
    - The deliverable is software that keeps running and is expected to stay healthy
    - The parts are individually addressable and DCM sequences them
  not_for:
    - A single managed service where the provider's internals are invisible by design — that is an
      ordinary Type Class (a managed database is Data.Database), not a Template
    - A run that completes — that is Template.Workflow
  works_with:
    - Template.Workflow — the day-2 activities bound to a realized Application
    - Access.Grouping — the non-isolating groupings its parts join

elements:

  - element: exposure
    scope: Template.Application
    optional: false
    state: proposed
    description: >-
      How the application is reachable. Portable intent: the shape of reachability, never a hostname,
      a load balancer, or an ingress class — those are the provider's naturalization.
    schema:
      type: string
      enum: [internal, private_network, public]
      # NO default. An opinionated org supplies it from a layer, where it carries provenance.

  - element: release_channel
    scope: Template.Application
    optional: true
    state: proposed
    description: >-
      The release stream this application tracks. Governed vocabulary rather than an inline enum —
      channels are curated and change without a spec edit (ADR-058).
    values:
      reference_data_type: release_channel
    schema:
      type: string

  - element: transport_security
    scope: Template.Application
    optional: true
    state: proposed
    description: >-
      Whether transport encryption is required of the realized exposure. A requirement, not a
      certificate: the certificate is a Security.CredentialRef constituent.
    schema:
      type: boolean
      # NO default. `enable_tls: true` in today's catalog item is one org's opinion
      # shipped to every consumer — exactly what NDF-001 removed 46 of.

coverage:
  use_cases: []
  flows: []
